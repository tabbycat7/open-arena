{% extends "base.html" %}

{% block title %}教学导航 - Open Arena{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/mat_nav.css') }}">
{% endblock %}

{% block content %}
<div class="nav-page" id="navPage">
    <header class="nav-topbar">
        <div class="nav-topbar-left">
            <a href="/app/multi-agent-teaching/?record={{ task_id }}" class="nav-back-link" aria-label="返回教学地图">
                <svg viewBox="0 0 16 16" fill="none" width="14" height="14" aria-hidden="true">
                    <path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>返回教学地图</span>
            </a>
            <div class="nav-title-group">
                <h1 class="nav-page-title">教学导航</h1>
                <span class="nav-status-badge" id="navStatusBadge">加载中</span>
            </div>
        </div>
        <div class="nav-topbar-right">
            <span class="nav-progress-text" id="navProgressText">--</span>
            <button type="button" class="nav-icon-btn" id="navLargeTextToggle" aria-pressed="false" title="大字模式">
                <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                    <path d="M5.5 16a1 1 0 01-.94-1.34l4-11a1 1 0 011.88 0l4 11a1 1 0 11-1.88.68L11.71 13H7.29l-.85 2.34A1 1 0 015.5 16zM8.02 11h2.96L9.5 6.93 8.02 11z"/>
                </svg>
            </button>
            <button type="button" class="nav-icon-btn" id="navProjectorToggle" aria-pressed="false" title="投屏模式">
                <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                    <path fill-rule="evenodd" d="M3 4a2 2 0 012-2h10a2 2 0 012 2v7a2 2 0 01-2 2h-4v2h3a1 1 0 110 2H6a1 1 0 110-2h3v-2H5a2 2 0 01-2-2V4zm2 0v7h10V4H5z" clip-rule="evenodd"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="nav-loading" id="navLoading">
        <div class="nav-loading-spinner"></div>
        <p>正在加载教学地图...</p>
    </div>

    <div class="nav-error" id="navError" style="display:none;">
        <div class="nav-error-icon">!</div>
        <p id="navErrorText">加载失败</p>
        <a href="/app/multi-agent-teaching/?record={{ task_id }}" class="btn btn-primary">返回</a>
    </div>

    <main class="nav-main" id="navMain" style="display:none;">
        <section class="nav-stage" id="navQuestionCard">
            <div class="nav-stage-head">
                <div class="nav-question-meta">
                    <span class="nav-question-badge" id="navQuestionBadge">M1</span>
                    <span class="nav-question-type" id="navQuestionType">主干问题</span>
                    <span class="nav-question-difficulty" id="navQuestionDifficulty"></span>
                </div>
                <div class="nav-timer" id="navTimer">
                    <span class="nav-timer-display" id="navTimerDisplay">03:00</span>
                    <button type="button" class="nav-timer-btn" id="navTimerToggle">开始</button>
                    <button type="button" class="nav-timer-btn" id="navTimerReset">重置</button>
                </div>
            </div>

            <div class="nav-stage-body" id="navQuestionBody">
                <div class="nav-material-panel" id="navVisualAid" style="display:none;">
                    <iframe class="nav-visual-aid-frame" id="navVisualAidFrame" title="交互可视化" sandbox="allow-scripts" loading="lazy" referrerpolicy="no-referrer"></iframe>
                    <img class="nav-visual-aid-img" id="navVisualAidImg" src="" alt="配图">
                    <button class="nav-visual-aid-zoom" id="navVisualAidZoom" type="button" aria-label="放大查看">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
                            <path d="M5 8a1 1 0 011-1h3V4a1 1 0 112 0v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0V9H6a1 1 0 01-1-1z"/>
                            <path fill-rule="evenodd" d="M8 16A8 8 0 108 0a8 8 0 000 16zm0-2A6 6 0 108 2a6 6 0 000 12z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                </div>
                <button class="nav-material-hint" id="navVisualAidHint" type="button" style="display:none;">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                        <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"/>
                    </svg>
                    <span id="navVisualAidHintText"></span>
                </button>

                <div class="nav-question-content" id="navQuestionContent">
                    <p class="nav-question-text" id="navQuestionText"></p>
                </div>
            </div>
        </section>

        <aside class="nav-tool-panel" id="navToolPanel">
            <div class="nav-tool-tabs" role="tablist" aria-label="教师工具">
                <button type="button" class="nav-tool-tab active" data-panel="script">说课稿</button>
                <button type="button" class="nav-tool-tab" data-panel="explanation">解析</button>
                <button type="button" class="nav-tool-tab" data-panel="notes">便签</button>
            </div>
            <div class="nav-tool-body">
                <div class="nav-tool-pane active" id="navScriptPanel" data-panel="script">
                    <div class="nav-tool-content" id="navScriptContent"></div>
                </div>
                <div class="nav-tool-pane" id="navExplanationPanel" data-panel="explanation">
                    <div class="nav-tool-content" id="navExplanationBody"></div>
                </div>
                <div class="nav-tool-pane" id="navNotesPanel" data-panel="notes">
                    <textarea id="navTeacherNote" class="nav-note-input" rows="9" placeholder="记录本题课堂观察、学生回答或后续调整。"></textarea>
                </div>
            </div>
        </aside>

        <section class="nav-completed-card" id="navCompletedCard" style="display:none;">
            <div class="nav-completed-icon">
                <svg viewBox="0 0 24 24" fill="none" width="48" height="48" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                    <path d="M8 12l2.5 2.5L16 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h2>导航完成</h2>
            <p>所有可用的问题节点已遍历完毕</p>
            <button class="btn btn-primary nav-restart-btn" id="navRestartBtn">重新开始</button>
        </section>

        <section class="nav-trail-shell" aria-label="访问路径">
            <div class="nav-trail" id="navTrail"></div>
        </section>
    </main>

    <footer class="nav-controls" id="navControls" style="display:none;">
        <div class="nav-controls-inner">
            <div class="nav-toggle-section">
                <div class="nav-toggle-group">
                    <label class="nav-toggle-label">课堂参与度</label>
                    <div class="nav-toggle-buttons" id="participationToggle">
                        <button class="nav-toggle-btn nav-toggle-high active" data-value="high" type="button">高</button>
                        <button class="nav-toggle-btn nav-toggle-low" data-value="low" type="button">低</button>
                    </div>
                </div>
                <div class="nav-toggle-group">
                    <label class="nav-toggle-label">回答准确率</label>
                    <div class="nav-toggle-buttons" id="accuracyToggle">
                        <button class="nav-toggle-btn nav-toggle-high active" data-value="high" type="button">高</button>
                        <button class="nav-toggle-btn nav-toggle-low" data-value="low" type="button">低</button>
                    </div>
                </div>
            </div>

            <div class="nav-scenario-indicator" id="navScenarioIndicator">
                <span class="nav-scenario-label">当前策略</span>
                <strong class="nav-scenario-text" id="navScenarioText">纵向认知进阶</strong>
            </div>

            <div class="nav-dispatch-actions">
                <button type="button" class="nav-back-btn" id="navBackBtn" disabled aria-label="回到上一个问题">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
                    </svg>
                    <span>上一个问题</span>
                </button>
                <button type="button" class="nav-dispatch-btn" id="navDispatchBtn">
                    <span>调度下一个问题</span>
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
                    </svg>
                </button>
            </div>
        </div>
    </footer>
</div>

<div class="nav-lightbox-overlay" id="navLightbox" style="display:none;">
    <div class="nav-lightbox-backdrop"></div>
    <div class="nav-lightbox-content">
        <iframe class="nav-lightbox-frame" id="navLightboxFrame" title="交互可视化放大" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
        <img class="nav-lightbox-img" id="navLightboxImg" src="" alt="配图放大">
        <div class="nav-lightbox-text" id="navLightboxText"></div>
        <button class="nav-lightbox-close" id="navLightboxClose" type="button" aria-label="关闭">&times;</button>
    </div>
</div>

<script>
    window.NAV_TASK_ID = "{{ task_id }}";
</script>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="{{ url_for('static', filename='js/mat_nav.js') }}"></script>
{% endblock %}
