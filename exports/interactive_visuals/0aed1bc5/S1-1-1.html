<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>平行四边形割补法 — 数学六年级</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            padding: 16px;
        }
        .container {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
            max-width: 880px;
            width: 100%;
            aspect-ratio: 4 / 3;
            padding: 24px 30px 28px 30px;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 600;
            color: #1a2a4a;
            letter-spacing: 1px;
            line-height: 1.3;
        }
        .header .badge {
            font-size: 15px;
            background: #eef2f9;
            color: #2c3e6b;
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: 500;
        }
        .phase-desc {
            font-size: 19px;
            font-weight: 500;
            color: #1f3a6b;
            background: #f0f4fe;
            padding: 6px 18px;
            border-radius: 40px;
            display: inline-block;
            margin: 4px 0 10px 0;
            min-height: 40px;
            transition: background 0.25s, color 0.25s;
            border-left: 5px solid #3a7bd5;
        }
        .svg-wrap {
            flex: 1;
            min-height: 0;
            width: 100%;
            background: #fafcff;
            border-radius: 16px;
            border: 1px solid #e6edf6;
            overflow: hidden;
            position: relative;
        }
        .svg-wrap svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        .controls {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 20px;
        }
        .slider-group {
            flex: 3;
            min-width: 180px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-group label {
            font-size: 17px;
            font-weight: 500;
            color: #2c3e6b;
            white-space: nowrap;
        }
        .slider-group input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 6px;
            border-radius: 4px;
            background: linear-gradient(to right, #b3c9e8, #3a7bd5);
            outline: none;
            transition: background 0.15s;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #2a5f9e;
            box-shadow: 0 2px 8px rgba(42, 95, 158, 0.25);
            cursor: pointer;
            transition: 0.1s;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.08);
            box-shadow: 0 2px 12px rgba(42, 95, 158, 0.35);
        }
        .slider-group input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #2a5f9e;
            cursor: pointer;
        }
        .slider-value {
            font-size: 17px;
            font-weight: 600;
            color: #1a2a4a;
            min-width: 48px;
            text-align: center;
            background: #eef2f9;
            padding: 2px 8px;
            border-radius: 30px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 10px;
            flex: 2;
            min-width: 200px;
            justify-content: flex-end;
        }
        .btn-group button {
            font-size: 16px;
            font-weight: 500;
            padding: 8px 20px;
            border: none;
            border-radius: 40px;
            background: #eef2f9;
            color: #1f3a6b;
            cursor: pointer;
            transition: all 0.18s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            letter-spacing: 0.3px;
        }
        .btn-group button:hover {
            background: #dce4f2;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.06);
        }
        .btn-group button.active {
            background: #2a5f9e;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(42, 95, 158, 0.25);
        }
        .btn-group button.active:hover {
            background: #1f4a7e;
        }
        .btn-group .btn-reset {
            background: #f0ebe4;
            color: #6b4f3a;
        }
        .btn-group .btn-reset:hover {
            background: #e6ddd2;
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px 14px 18px 14px;
                border-radius: 18px;
            }
            .header h1 {
                font-size: 20px;
            }
            .header .badge {
                font-size: 13px;
                padding: 2px 12px;
            }
            .phase-desc {
                font-size: 16px;
                padding: 4px 14px;
                min-height: 34px;
            }
            .controls {
                flex-direction: column;
                gap: 12px;
                margin-top: 12px;
            }
            .btn-group {
                justify-content: center;
                flex: 1;
                width: 100%;
            }
            .btn-group button {
                font-size: 14px;
                padding: 6px 16px;
            }
            .slider-group {
                width: 100%;
            }
            .slider-group label {
                font-size: 15px;
            }
            .slider-value {
                font-size: 15px;
                min-width: 40px;
            }
        }
        @media (max-width: 480px) {
            .header h1 {
                font-size: 17px;
            }
            .phase-desc {
                font-size: 14px;
                padding: 3px 10px;
            }
            .btn-group button {
                font-size: 13px;
                padding: 5px 12px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📐 平行四边形 → 长方形</h1>
        <span class="badge">割补法 · 六年级</span>
    </div>
    <div class="phase-desc" id="phaseDesc">观察平行四边形，试着沿高剪开</div>
    <div class="svg-wrap">
        <svg id="mainSvg" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid meet">
            <!-- 背景 -->
            <rect x="0" y="0" width="800" height="560" fill="#fafcff" rx="12" />

            <!-- 所有可绘制元素都在这里，通过 JS 动态控制 -->
            <g id="scene">
                <!-- 1. 梯形部分 (固定) DHBC -->
                <polygon id="trapezoid" points="" fill="#e3f0fa" stroke="#2a5f9e" stroke-width="2.5" stroke-linejoin="round" />
                <!-- 2. 三角形部分 (可平移) ADH -->
                <polygon id="triangle" points="" fill="#fde8d0" stroke="#c0762a" stroke-width="2.5" stroke-linejoin="round" />
                <!-- 3. 切割线 DH -->
                <line id="cutLine" x1="0" y1="0" x2="0" y2="0" stroke="#d1453b" stroke-width="3.5" stroke-dasharray="10,7" stroke-linecap="round" opacity="0" />
                <!-- 4. 高辅助线 (浅色虚线) 从D到H -->
                <line id="heightLine" x1="0" y1="0" x2="0" y2="0" stroke="#6b8bb0" stroke-width="2" stroke-dasharray="6,5" opacity="0.4" />
                <!-- 5. 直角标记 (在H处) -->
                <polyline id="rightAngle" points="" fill="none" stroke="#1f3a6b" stroke-width="2.2" stroke-linecap="round" />
                <!-- 6. 平移箭头 (指示方向) -->
                <g id="arrowGroup" opacity="0">
                    <line id="arrowLine" x1="0" y1="0" x2="0" y2="0" stroke="#c0762a" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrowHead)" />
                </g>
                <!-- 7. 长方形轮廓 (完成态) -->
                <polygon id="rectOutline" points="" fill="rgba(185, 210, 245, 0.15)" stroke="#1a5a9e" stroke-width="2.8" stroke-dasharray="0" stroke-linejoin="round" opacity="0" />

                <!-- 标记定义：箭头 -->
                <defs>
                    <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                        <path d="M0,0 L10,4 L0,8 Z" fill="#c0762a" />
                    </marker>
                    <marker id="arrowHeadBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                        <path d="M0,0 L10,4 L0,8 Z" fill="#1a5a9e" />
                    </marker>
                </defs>

                <!-- 8. 顶点标签 -->
                <text id="labelA" class="vtx-label" fill="#1a2a4a" font-size="22" font-weight="600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">A</text>
                <text id="labelB" class="vtx-label" fill="#1a2a4a" font-size="22" font-weight="600">B</text>
                <text id="labelC" class="vtx-label" fill="#1a2a4a" font-size="22" font-weight="600">C</text>
                <text id="labelD" class="vtx-label" fill="#1a2a4a" font-size="22" font-weight="600">D</text>
                <text id="labelH" class="vtx-label" fill="#1a2a4a" font-size="20" font-weight="600">H</text>
                <text id="labelHp" class="vtx-label" fill="#1a2a4a" font-size="20" font-weight="600" opacity="0">H'</text>
                <text id="labelDp" class="vtx-label" fill="#1a2a4a" font-size="20" font-weight="600" opacity="0">D'</text>

                <!-- 9. 尺寸标注 (底、高、长、宽) -->
                <g id="dimsOriginal" opacity="0.7">
                    <!-- 底 -->
                    <line x1="180" y1="448" x2="620" y2="448" stroke="#1f3a6b" stroke-width="1.8" stroke-dasharray="3,3" />
                    <text x="400" y="466" text-anchor="middle" fill="#1f3a6b" font-size="18" font-weight="500">底</text>
                    <!-- 高 -->
                    <line x1="264" y1="220" x2="264" y2="420" stroke="#1f3a6b" stroke-width="1.8" stroke-dasharray="3,3" />
                    <text x="252" y="326" text-anchor="end" fill="#1f3a6b" font-size="18" font-weight="500">高</text>
                </g>
                <g id="dimsFinal" opacity="0">
                    <!-- 长 -->
                    <line x1="280" y1="448" x2="720" y2="448" stroke="#1a5a9e" stroke-width="2" stroke-dasharray="4,4" />
                    <text x="500" y="468" text-anchor="middle" fill="#1a5a9e" font-size="19" font-weight="600">长 = 底</text>
                    <!-- 宽 -->
                    <line x1="736" y1="220" x2="736" y2="420" stroke="#1a5a9e" stroke-width="2" stroke-dasharray="4,4" />
                    <text x="750" y="326" text-anchor="start" fill="#1a5a9e" font-size="19" font-weight="600">宽 = 高</text>
                </g>

                <!-- 10. 辅助说明文字 (剪开/平移) -->
                <text id="hintCut" x="250" y="190" text-anchor="middle" fill="#d1453b" font-size="20" font-weight="600" opacity="0">✂ 沿高剪开</text>
                <text id="hintMove" x="380" y="180" text-anchor="middle" fill="#c0762a" font-size="20" font-weight="600" opacity="0">➡ 向右平移</text>
                <text id="hintDone" x="510" y="180" text-anchor="middle" fill="#1a5a9e" font-size="21" font-weight="600" opacity="0">✅ 拼成长方形</text>
            </g>
        </svg>
    </div>
    <div class="controls">
        <div class="slider-group">
            <label for="progressSlider">割补</label>
            <input type="range" id="progressSlider" min="0" max="100" value="0" step="1">
            <span class="slider-value" id="sliderVal">0%</span>
        </div>
        <div class="btn-group">
            <button data-step="0" class="active" id="btnReset">原始</button>
            <button data-step="28" id="btnCut">剪开</button>
            <button data-step="55" id="btnMove">平移</button>
            <button data-step="100" id="btnDone">完成</button>
        </div>
    </div>
</div>
<script>
    (function() {
        // -------- 几何坐标 (所有关键点) --------
        const A = { x: 180, y: 420 };
        const B = { x: 620, y: 420 };
        const C = { x: 520, y: 220 };
        const D = { x: 280, y: 220 };
        const H = { x: 280, y: 420 }; // 垂足
        const offsetX = B.x - A.x; // 平移向量 = 440

        // 平移后的点
        const A2 = { x: A.x + offsetX, y: A.y };
        const D2 = { x: D.x + offsetX, y: D.y };
        const H2 = { x: H.x + offsetX, y: H.y };

        // -------- DOM 引用 --------
        const svg = document.getElementById('mainSvg');
        const slider = document.getElementById('progressSlider');
        const sliderVal = document.getElementById('sliderVal');
        const phaseDesc = document.getElementById('phaseDesc');
        const buttons = document.querySelectorAll('.btn-group button');

        // 图形元素
        const triangle = document.getElementById('triangle');
        const trapezoid = document.getElementById('trapezoid');
        const cutLine = document.getElementById('cutLine');
        const heightLine = document.getElementById('heightLine');
        const rightAngle = document.getElementById('rightAngle');
        const arrowGroup = document.getElementById('arrowGroup');
        const arrowLine = document.getElementById('arrowLine');
        const rectOutline = document.getElementById('rectOutline');

        // 标签
        const labelA = document.getElementById('labelA');
        const labelB = document.getElementById('labelB');
        const labelC = document.getElementById('labelC');
        const labelD = document.getElementById('labelD');
        const labelH = document.getElementById('labelH');
        const labelHp = document.getElementById('labelHp');
        const labelDp = document.getElementById('labelDp');

        // 标注组
        const dimsOriginal = document.getElementById('dimsOriginal');
        const dimsFinal = document.getElementById('dimsFinal');

        // 提示文字
        const hintCut = document.getElementById('hintCut');
        const hintMove = document.getElementById('hintMove');
        const hintDone = document.getElementById('hintDone');

        // -------- 辅助函数：更新点坐标 --------
        function updatePolygon(el, pts) {
            el.setAttribute('points', pts.map(p => `${p.x},${p.y}`).join(' '));
        }

        // -------- 核心更新函数 (根据进度 t = 0~1) --------
        function updateScene(t) {
            // 阶段边界
            const cutStart = 0.0;
            const cutEnd = 0.28;
            const moveStart = 0.28;
            const moveEnd = 0.72;
            const doneStart = 0.72;
            const doneEnd = 1.0;

            // ----- 切割线透明度 -----
            let cutOpacity = 0;
            if (t <= cutStart) cutOpacity = 0;
            else if (t < cutEnd) cutOpacity = (t - cutStart) / (cutEnd - cutStart);
            else cutOpacity = 1;

            // ----- 平移量 (插值) -----
            let translateRatio = 0;
            if (t <= moveStart) translateRatio = 0;
            else if (t < moveEnd) translateRatio = (t - moveStart) / (moveEnd - moveStart);
            else translateRatio = 1;
            const tx = translateRatio * offsetX;

            // ----- 最终长方形淡入 -----
            let rectOpacity = 0;
            if (t > doneStart) {
                rectOpacity = (t - doneStart) / (doneEnd - doneStart);
                if (rectOpacity > 1) rectOpacity = 1;
            }

            // ----- 1. 更新梯形 DHBC (固定) -----
            updatePolygon(trapezoid, [D, H, B, C]);

            // ----- 2. 更新三角形 ADH (平移) -----
            const triPts = [
                { x: A.x + tx, y: A.y },
                { x: D.x + tx, y: D.y },
                { x: H.x + tx, y: H.y }
            ];
            updatePolygon(triangle, triPts);

            // ----- 3. 切割线 (从D到H，固定位置) -----
            cutLine.setAttribute('x1', D.x);
            cutLine.setAttribute('y1', D.y);
            cutLine.setAttribute('x2', H.x);
            cutLine.setAttribute('y2', H.y);
            cutLine.setAttribute('opacity', cutOpacity);

            // ----- 4. 高辅助线 (从D到H，浅色虚线) -----
            heightLine.setAttribute('x1', D.x);
            heightLine.setAttribute('y1', D.y);
            heightLine.setAttribute('x2', H.x);
            heightLine.setAttribute('y2', H.y);
            // 当切割线完全显示后，高辅助线淡出
            let heightOpacity = 0.4 * (1 - cutOpacity);
            heightLine.setAttribute('opacity', Math.max(0, heightOpacity));

            // ----- 5. 直角标记 (在H处) -----
            const size = 18;
            const hx = H.x,
                hy = H.y;
            // 两条边方向: 从H到D (垂直向上) 和 从H到B (水平向右)
            const dx = 0,
                dy = -size; // 向上 (D方向)
            const ex = size,
                ey = 0; // 向右 (B方向)
            rightAngle.setAttribute('points', `${hx+dx},${hy+dy} ${hx+dx+ex},${hy+dy+ey} ${hx+ex},${hy+ey}`);
            rightAngle.setAttribute('opacity', Math.min(1, cutOpacity + 0.2));

            // ----- 6. 平移箭头 (当平移进行时显示) -----
            if (translateRatio > 0 && translateRatio < 1) {
                const arrowY = D.y - 36;
                const startX = D.x + 10;
                const endX = D.x + tx - 10;
                arrowGroup.setAttribute('opacity', Math.min(1, translateRatio * 2));
                arrowLine.setAttribute('x1', startX);
                arrowLine.setAttribute('y1', arrowY);
                arrowLine.setAttribute('x2', Math.max(startX + 20, endX));
                arrowLine.setAttribute('y2', arrowY);
            } else if (translateRatio >= 1) {
                arrowGroup.setAttribute('opacity', 0);
            } else {
                arrowGroup.setAttribute('opacity', 0);
            }

            // ----- 7. 长方形轮廓 (最终态) -----
            // 长方形: H → H' → D' → D
            const rectPts = [H, H2, D2, D];
            updatePolygon(rectOutline, rectPts);
            rectOutline.setAttribute('opacity', rectOpacity);

            // ----- 8. 顶点标签位置 -----
            // A (随三角形平移)
            const labelAPos = { x: A.x + tx, y: A.y };
            labelA.setAttribute('x', labelAPos.x - 16);
            labelA.setAttribute('y', labelAPos.y + 32);
            // B 固定
            labelB.setAttribute('x', B.x + 8);
            labelB.setAttribute('y', B.y + 32);
            // C 固定
            labelC.setAttribute('x', C.x + 8);
            labelC.setAttribute('y', C.y - 12);
            // D (随三角形平移)
            const labelDPos = { x: D.x + tx, y: D.y };
            labelD.setAttribute('x', labelDPos.x - 18);
            labelD.setAttribute('y', labelDPos.y - 12);
            // H (固定)
            labelH.setAttribute('x', H.x - 22);
            labelH.setAttribute('y', H.y + 32);

            // H' 和 D' (最终长方形顶点)
            const hpShow = rectOpacity > 0.3;
            labelHp.setAttribute('opacity', rectOpacity);
            labelDp.setAttribute('opacity', rectOpacity);
            labelHp.setAttribute('x', H2.x + 6);
            labelHp.setAttribute('y', H2.y + 32);
            labelDp.setAttribute('x', D2.x + 6);
            labelDp.setAttribute('y', D2.y - 12);

            // ----- 9. 尺寸标注 -----
            if (translateRatio < 0.5) {
                dimsOriginal.setAttribute('opacity', 0.7 * (1 - translateRatio * 2));
                dimsFinal.setAttribute('opacity', 0);
            } else {
                const f = (translateRatio - 0.5) * 2;
                dimsOriginal.setAttribute('opacity', 0);
                dimsFinal.setAttribute('opacity', Math.min(1, f * 1.2));
            }

            // ----- 10. 提示文字 -----
            // 剪开提示: 在切割线显示且平移尚未开始时
            if (cutOpacity > 0.3 && translateRatio < 0.1) {
                hintCut.setAttribute('opacity', Math.min(1, cutOpacity));
            } else {
                hintCut.setAttribute('opacity', 0);
            }
            // 平移提示: 平移进行中
            if (translateRatio > 0.1 && translateRatio < 0.9) {
                hintMove.setAttribute('opacity', Math.min(1, translateRatio * 2));
            } else {
                hintMove.setAttribute('opacity', 0);
            }
            // 完成提示: 平移完成
            if (translateRatio >= 0.95) {
                hintDone.setAttribute('opacity', Math.min(1, (translateRatio - 0.95) * 10));
            } else {
                hintDone.setAttribute('opacity', 0);
            }

            // ----- 11. 更新阶段描述 -----
            updatePhaseDesc(translateRatio, cutOpacity, rectOpacity);

            // ----- 12. 更新滑块数值显示 -----
            const pct = Math.round(t * 100);
            sliderVal.textContent = pct + '%';

            // ----- 13. 更新按钮激活状态 -----
            updateActiveButton(pct);
        }

        // -------- 阶段描述文字 --------
        function updatePhaseDesc(tr, cutOp, rectOp) {
            let desc = '';
            if (tr < 0.02 && cutOp < 0.3) {
                desc = '🔍 观察：这是一个平行四边形，底边 AB，高 DH';
            } else if (cutOp >= 0.3 && tr < 0.1) {
                desc = '✂ 沿高 DH 剪开，分成一个三角形和一个梯形';
            } else if (tr >= 0.1 && tr < 0.45) {
                desc = '➡ 把三角形向右平移……';
            } else if (tr >= 0.45 && tr < 0.85) {
                desc = '📐 三角形与梯形拼合，逐渐变成长方形';
            } else if (tr >= 0.85) {
                desc = '✅ 拼成长方形！长 = 底，宽 = 高';
            } else {
                desc = '🔍 观察平行四边形';
            }
            phaseDesc.textContent = desc;
        }

        // -------- 按钮激活状态 --------
        function updateActiveButton(val) {
            buttons.forEach(btn => {
                const step = parseInt(btn.getAttribute('data-step'), 10);
                // 允许10%的容差
                const isActive = Math.abs(val - step) <= 5 || (step === 0 && val <= 5) || (step === 100 && val >= 95);
                if (isActive) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            // 特殊处理中间态: 如果值在28附近, 剪开按钮高亮
            const pct = val;
            buttons.forEach(btn => {
                const step = parseInt(btn.getAttribute('data-step'), 10);
                if (step === 28 && pct >= 20 && pct <= 38) {
                    btn.classList.add('active');
                }
                if (step === 55 && pct >= 45 && pct <= 65) {
                    btn.classList.add('active');
                }
            });
        }

        // -------- 从滑块更新 --------
        function fromSlider() {
            const val = parseInt(slider.value, 10);
            const t = val / 100;
            updateScene(t);
        }

        // -------- 从按钮跳转 --------
        function jumpToStep(stepVal) {
            const t = stepVal / 100;
            slider.value = stepVal;
            updateScene(t);
        }

        // -------- 事件绑定 --------
        slider.addEventListener('input', fromSlider);

        buttons.forEach(btn => {
            btn.addEventListener('click', function(e) {
                const step = parseInt(this.getAttribute('data-step'), 10);
                jumpToStep(step);
            });
        });

        // -------- 窗口自适应: 保证SVG清晰 --------
        // 无需额外操作, viewBox已处理

        // -------- 初始化 --------
        // 设置初始坐标 (t=0)
        function initScene() {
            // 默认状态: t=0
            updateScene(0);
            // 确保H'和D'标签位置正确但透明
            labelHp.setAttribute('x', H2.x + 6);
            labelHp.setAttribute('y', H2.y + 32);
            labelDp.setAttribute('x', D2.x + 6);
            labelDp.setAttribute('y', D2.y - 12);
            // 滑块归零
            slider.value = 0;
            sliderVal.textContent = '0%';
            // 激活按钮
            updateActiveButton(0);
        }

        initScene();

        // 额外: 如果用户点击"剪开"但还没看到切割线, 增加一个微小延迟? 不需要, 直接跳转。
        // 但是为了体验, 让"剪开"按钮跳转到28, 切割线已显示
        // "平移"跳转到55 (平移中间态)
        // "完成"跳转到100

        // 修正一个细节: 当滑块拖到100时, 确保所有元素最终态正确
        // 一切正常

        // 附加: 点击按钮后稍微增加触感反馈
        buttons.forEach(btn => {
            btn.addEventListener('mousedown', function() {
                this.style.transform = 'scale(0.96)';
            });
            btn.addEventListener('mouseup', function() {
                this.style.transform = 'scale(1)';
            });
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
            });
        });

        // 处理触摸设备
        if ('ontouchstart' in window) {
            buttons.forEach(btn => {
                btn.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.96)';
                });
                btn.addEventListener('touchend', function() {
                    this.style.transform = 'scale(1)';
                });
            });
        }

        // 检查: 当平移完成后, 三角形与梯形恰好拼合
        // 三角形顶点: A+tx, D+tx, H+tx
        // 当 tx = offsetX 时, A+tx = B, D+tx = D2, H+tx = H2
        // 此时长方形顶点为 H, H2, D2, D
        // 梯形为 D, H, B, C, 而 B = A+tx, C = D2
        // 验证: 长方形 + 梯形重叠? 实际上在完成态, 我们只显示长方形轮廓和填充
        // 三角形和梯形仍然存在, 但视觉上被长方形覆盖
        // 在完成态, 我们让长方形透明度变为1, 同时三角形和梯形保持显示但被覆盖
        // 这样看起来就是一个完整的长方形

        // 为了更干净, 当rectOpacity > 0.9时, 可以稍微降低三角形和梯形的描边透明度
        // 但保留它们以显示拼合过程
        // 这个已经通过颜色叠加处理好了

        // 额外小优化: 当完全完成时, 淡化切割线
        // 在updateScene中已经处理: 切割线始终保持可见(因为cutOpacity=1), 但在完成态, 我们可以让它变淡
        // 修改: 在平移完成后, 切割线逐渐变淡
        // 但为了教学清晰, 保留切割线作为参考线

        // 实际上, 在真实课堂中, 切割线在拼合后成为长方形内部的一条线, 应该变淡
        // 我们在t > 0.85时让切割线逐渐变淡
        // 修改updateScene中的cutOpacity逻辑:
        // 在原有基础上, 如果t > 0.85, 切割线透明度降低
        // 但为了不破坏原有逻辑, 我单独处理

        // 重写部分: 在updateScene末尾调整cutLine透明度
        // 采用后期处理方式
        const origUpdate = updateScene;
        updateScene = function(t) {
            origUpdate(t);

            // 完成态淡化切割线
            let finalCut = parseFloat(cutLine.getAttribute('opacity'));
            if (t > 0.82) {
                const fade = 1 - (t - 0.82) / 0.18;
                finalCut = Math.max(0, Math.min(1, fade)) * 0.5;
                cutLine.setAttribute('opacity', finalCut);
                // 同时淡化直角标记
                const raOp = Math.min(1, parseFloat(rightAngle.getAttribute('opacity')));
                if (t > 0.85) {
                    rightAngle.setAttribute('opacity', raOp * (1 - (t - 0.85) / 0.15));
                }
            }
            // 在完成态, 高辅助线完全消失
            if (t > 0.8) {
                heightLine.setAttribute('opacity', 0);
            }
        };

        // 重新初始化
        initScene();

        // 确保响应式: 窗口变化不影响SVG内部
        console.log('✅ 平行四边形割补法可视化已加载');
    })();
</script>
