<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>信息核实决策树</title>
    <style>
        :root {
            --primary: #4a90e2;
            --danger: #e74c3c;
            --success: #27ae60;
            --bg: #f4f7f6;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 30px; }
        .node {
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
        }
        .node:hover { transform: scale(1.05); }
        .box {
            fill: white;
            stroke: #333;
            stroke-width: 2;
            rx: 8;
        }
        .text { font-size: 16px; font-weight: bold; pointer-events: none; }
        .feedback { font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.3s; }
        #status-text { margin-top: 20px; font-size: 18px; font-weight: bold; height: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h2>信息核实决策树：明天学校放假吗？</h2>
    <svg id="canvas" width="700" height="350" viewBox="0 0 700 350">
        <!-- 根节点 -->
        <rect x="250" y="20" width="200" height="50" class="box" />
        <text x="350" y="50" text-anchor="middle" class="text">传言：“明天放假！”</text>
        <line x1="350" y1="70" x2="350" y2="120" stroke="#333" stroke-width="2" />

        <!-- 选项节点 -->
        <g id="opt1" class="node">
            <rect x="50" y="120" width="180" height="60" class="box" />
            <text x="140" y="155" text-anchor="middle" class="text">同学小刚说</text>
        </g>
        <g id="opt2" class="node">
            <rect x="260" y="120" width="180" height="60" class="box" />
            <text x="350" y="155" text-anchor="middle" class="text">隔壁班传闻</text>
        </g>
        <g id="opt3" class="node">
            <rect x="470" y="120" width="180" height="60" class="box" />
            <text x="560" y="155" text-anchor="middle" class="text">班主任群通知</text>
        </g>

        <!-- 反馈图标容器 -->
        <g id="feedback-area"></g>
    </svg>
    <div id="status-text">请点击上方选项进行核实</div>
</div>

<script>
    const feedbackArea = document.getElementById('feedback-area');
    const statusText = document.getElementById('status-text');

    const options = [
        { id: 'opt1', x: 140, y: 220, msg: "不可靠信源：小道消息容易以讹传讹。", color: "#e74c3c", icon: "❌" },
        { id: 'opt2', x: 350, y: 220, msg: "不可靠信源：未经证实的传闻不可信。", color: "#e74c3c", icon: "❌" },
        { id: 'opt3', x: 560, y: 220, msg: "权威一手信源：安全可靠！", color: "#27ae60", icon: "✅" }
    ];

    options.forEach(opt => {
        document.getElementById(opt.id).addEventListener('click', () => {
            feedbackArea.innerHTML = '';
            
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            group.innerHTML = `
                <text x="${opt.x}" y="${opt.y}" text-anchor="middle" font-size="40" fill="${opt.color}">${opt.icon}</text>
            `;
            feedbackArea.appendChild(group);
            
            statusText.textContent = opt.msg;
            statusText.style.color = opt.color;
        });
    });
</script>

</body>
</html>
