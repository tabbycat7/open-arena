<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>S2-2-2 心情晴雨表</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --green: #2ecc71;
            --red: #e74c3c;
            --text: #2c3e50;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 80%;
            max-width: 800px;
            text-align: center;
        }
        h2 { font-size: 2.2vw; margin-bottom: 20px; }
        .stage {
            height: 300px;
            background: white;
            border-radius: 20px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
        }
        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        button {
            padding: 15px 25px;
            font-size: 1.2vw;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        #btn-polite { background-color: var(--green); }
        #btn-rude { background-color: var(--red); }
        
        #status-text { font-size: 1.8vw; font-weight: bold; margin-top: 10px; }
        #weather-icon { font-size: 80px; margin-bottom: 10px; }
        
        canvas { width: 100%; height: 100px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>当你向AI提问时，你的心情会发生什么变化？</h2>
    
    <div class="stage">
        <div id="weather-icon">😊</div>
        <div id="status-text">请选择一种沟通方式</div>
        <canvas id="heartbeat"></canvas>
    </div>

    <div class="controls">
        <button id="btn-polite">发送：谢谢你，帮我查个资料吧</button>
        <button id="btn-rude">发送：笨蛋，快点给我答案！</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('heartbeat');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status-text');
    const weatherIcon = document.getElementById('weather-icon');
    
    function drawWave(type) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.strokeStyle = (type === 'polite') ? '#2ecc71' : '#e74c3c';
        
        let x = 0;
        const y = canvas.height / 2;
        
        for (let i = 0; i < canvas.width; i++) {
            let amplitude = (type === 'polite') ? 5 : 40;
            let frequency = (type === 'polite') ? 0.02 : 0.15;
            let val = Math.sin(i * frequency) * amplitude;
            ctx.lineTo(i, y + val);
        }
        ctx.stroke();
    }

    document.getElementById('btn-polite').addEventListener('click', () => {
        weatherIcon.innerText = '☀️';
        statusText.innerText = '保持礼貌，内心平静';
        statusText.style.color = '#2ecc71';
        drawWave('polite');
    });

    document.getElementById('btn-rude').addEventListener('click', () => {
        weatherIcon.innerText = '⛈️';
        statusText.innerText = '情绪垃圾，反噬自我';
        statusText.style.color = '#e74c3c';
        drawWave('rude');
    });

    // 初始化画布尺寸
    function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();
</script>

</body>
</html>
