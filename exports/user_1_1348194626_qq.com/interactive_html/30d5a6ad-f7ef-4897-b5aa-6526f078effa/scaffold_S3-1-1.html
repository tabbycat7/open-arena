<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>S3-1-1 语气与真相</title>
    <style>
        :root {
            --primary: #4a90e2;
            --danger: #e74c3c;
            --bg: #f4f7f6;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #stage {
            width: 80vw;
            height: 60vw;
            max-width: 600px;
            max-height: 450px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .character {
            font-size: 80px;
            margin-top: 40px;
            transition: transform 0.3s;
        }
        #bubble {
            background: #fff;
            border: 3px solid #333;
            padding: 15px;
            border-radius: 20px;
            margin-top: 20px;
            font-weight: bold;
            position: relative;
            text-align: center;
            max-width: 80%;
        }
        #bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            border-width: 15px 10px 0;
            border-style: solid;
            border-color: #333 transparent;
        }
        #official-notice {
            display: none;
            background: #ffeaa7;
            border: 2px dashed #d63031;
            padding: 15px;
            margin-top: 30px;
            border-radius: 10px;
            text-align: center;
            color: #d63031;
            font-weight: bold;
        }
        button {
            margin-top: 30px;
            padding: 10px 25px;
            font-size: 18px;
            cursor: pointer;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            transition: background 0.3s;
        }
        button:hover { background: #357abd; }
        #hint {
            margin-top: 20px;
            font-size: 16px;
            color: #555;
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

<div id="stage">
    <div id="char" class="character">😎</div>
    <div id="bubble">大剧院明天免费发冰淇淋，<br>我保证是真的！</div>
    
    <div id="official-notice">
        【大剧院公告】<br>明日闭馆整修，无任何活动。
    </div>

    <button id="verify-btn">核实真相</button>
    <div id="hint">说话很自信，不代表就是真的。AI也是如此！</div>
</div>

<script>
    const btn = document.getElementById('verify-btn');
    const char = document.getElementById('char');
    const bubble = document.getElementById('bubble');
    const notice = document.getElementById('official-notice');
    const hint = document.getElementById('hint');

    btn.addEventListener('click', function() {
        // 改变角色状态
        char.textContent = '😳';
        char.style.transform = 'scale(0.9)';
        
        // 改变对话框
        bubble.style.borderColor = '#999';
        bubble.style.color = '#999';
        bubble.textContent = '呃...好像是我记错了...';
        
        // 显示公告
        notice.style.display = 'block';
        
        // 显示提示
        hint.style.opacity = '1';
        
        // 隐藏按钮
        btn.style.display = 'none';
    });
</script>

</body>
</html>
