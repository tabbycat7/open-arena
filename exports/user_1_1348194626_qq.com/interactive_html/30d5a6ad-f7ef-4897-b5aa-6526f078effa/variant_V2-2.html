<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>数据去向对比仪</title>
    <style>
        :root { --primary: #2563eb; --danger: #dc2626; --bg: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { width: 800px; height: 600px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; }
        h2 { text-align: center; color: #1e293b; margin-top: 0; }
        .canvas-area { flex-grow: 1; position: relative; border: 2px dashed #cbd5e1; border-radius: 8px; margin: 10px 0; overflow: hidden; }
        .controls { padding: 15px; background: #f1f5f9; border-radius: 8px; }
        input[type=range] { width: 100%; cursor: pointer; }
        .labels { display: flex; justify-content: space-between; font-size: 14px; color: #64748b; margin-top: 5px; }
        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>数据去向对比仪：谁在掌控你的隐私？</h2>
    <div class="canvas-area" id="canvas-container">
        <svg id="viz" width="100%" height="100%" viewBox="0 0 800 400">
            <!-- 学校食堂区域 -->
            <rect x="50" y="50" width="300" height="300" fill="#f0fdf4" stroke="#22c55e" stroke-dasharray="5,5"/>
            <text x="120" y="80" font-weight="bold" fill="#166534">学校食堂 (内网)</text>
            <circle id="data-school" cx="200" cy="200" r="20" fill="#22c55e"/>
            <text id="text-school" x="170" y="250" font-size="12">人脸数据</text>

            <!-- 换脸App区域 -->
            <rect x="450" y="50" width="300" height="300" fill="#fef2f2" stroke="#ef4444" stroke-dasharray="5,5"/>
            <text x="530" y="80" font-weight="bold" fill="#991b1b">换脸App (云端)</text>
            <circle id="data-app" cx="600" cy="200" r="20" fill="#ef4444"/>
            <text id="text-app" x="570" y="250" font-size="12">人脸数据</text>
            
            <!-- 路径线 -->
            <path id="path-app" d="M 600 220 L 600 350" stroke="#ef4444" stroke-width="3" stroke-dasharray="5,5" opacity="0"/>
        </svg>
    </div>

    <div class="controls">
        <input type="range" id="time-slider" min="0" max="100" value="0">
        <div class="labels">
            <span>入学/注册</span>
            <span>在校期间</span>
            <span style="color:var(--danger); font-weight:bold;">毕业/注销</span>
        </div>
    </div>
    <div class="legend">
        <span><b style="color:#22c55e">●</b> 封闭存储</span>
        <span><b style="color:#ef4444">●</b> 扩散风险</span>
    </div>
</div>

<script>
    const slider = document.getElementById('time-slider');
    const dataSchool = document.getElementById('data-school');
    const dataApp = document.getElementById('data-app');
    const pathApp = document.getElementById('path-app');
    const textSchool = document.getElementById('text-school');

    slider.addEventListener('input', (e) => {
        const val = e.target.value;
        
        // 学校逻辑：超过80%即销毁
        if (val > 80) {
            dataSchool.setAttribute('fill', '#94a3b8');
            dataSchool.setAttribute('r', '10');
            textSchool.textContent = "数据已销毁";
        } else {
            dataSchool.setAttribute('fill', '#22c55e');
            dataSchool.setAttribute('r', '20');
            textSchool.textContent = "人脸数据";
        }

        // App逻辑：随时间扩散
        const opacity = val / 100;
        pathApp.setAttribute('opacity', opacity);
        dataApp.setAttribute('cy', 200 + (val * 1.5));
        
        if (val > 50) {
            pathApp.setAttribute('d', `M 600 220 Q 650 ${200 + val} 600 350`);
        } else {
            pathApp.setAttribute('d', `M 600 220 L 600 350`);
        }
    });
</script>

</body>
</html>
