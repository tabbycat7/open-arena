<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>人机交互文明设计实验</title>
    <style>
        :root { --bg: #f0f4f8; --primary: #2c3e50; --accent: #3498db; }
        body { font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #container { width: 80vw; height: 60vh; background: white; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; margin: 0 10px; cursor: pointer; border: none; border-radius: 5px; background: var(--accent); color: white; font-size: 16px; }
        button:hover { opacity: 0.9; }
        svg { width: 100%; height: 300px; }
        .box { transition: all 0.3s; }
        .text-label { font-size: 14px; font-weight: bold; }
        #status-text { margin-top: 10px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div id="container">
    <h3>人机情绪互锁实验：你会如何设定AI？</h3>
    <div class="controls">
        <button id="btn-a">设定 A：以牙还牙</button>
        <button id="btn-b">设定 B：冷处理/引导</button>
    </div>
    
    <svg viewBox="0 0 600 200">
        <!-- 用户 -->
        <rect id="user-box" x="50" y="50" width="150" height="80" rx="10" fill="#bdc3c7" />
        <text x="125" y="95" text-anchor="middle" class="text-label">用户 (愤怒)</text>
        
        <!-- AI -->
        <rect id="ai-box" x="400" y="50" width="150" height="80" rx="10" fill="#bdc3c7" />
        <text x="475" y="95" text-anchor="middle" class="text-label">AI 客服</text>
        
        <!-- 连线 -->
        <path id="link" d="M 200 90 L 400 90" stroke="#7f8c8d" stroke-width="4" marker-end="url(#arrow)" />
        <defs>
            <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L0,6 L9,3 z" fill="#7f8c8d" />
            </marker>
        </defs>
    </svg>
    <div id="status-text">请选择一种设定开始模拟</div>
</div>

<script>
    const userBox = document.getElementById('user-box');
    const aiBox = document.getElementById('ai-box');
    const statusText = document.getElementById('status-text');
    const btnA = document.getElementById('btn-a');
    const btnB = document.getElementById('btn-b');

    function reset() {
        userBox.setAttribute('fill', '#bdc3c7');
        aiBox.setAttribute('fill', '#bdc3c7');
    }

    btnA.addEventListener('click', () => {
        reset();
        userBox.setAttribute('fill', '#e74c3c');
        aiBox.setAttribute('fill', '#e74c3c');
        statusText.innerText = "设定 A：恶性循环触发！双方情绪升级，沟通彻底破裂。";
        statusText.style.color = "#e74c3c";
    });

    btnB.addEventListener('click', () => {
        reset();
        userBox.setAttribute('fill', '#2ecc71');
        aiBox.setAttribute('fill', '#3498db');
        statusText.innerText = "设定 B：冷处理生效。AI保持专业，用户愤怒值逐渐平复。";
        statusText.style.color = "#27ae60";
    });
</script>

</body>
</html>
