<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>习惯的肌肉记忆</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f4f8;
            font-family: "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }
        #stage {
            width: 800px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: opacity 0.5s ease;
        }
        .hidden { opacity: 0; pointer-events: none; }
        
        h2 { text-align: center; color: #333; margin-top: 20px; }
        
        #controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }
        button {
            padding: 10px 25px;
            font-size: 18px;
            cursor: pointer;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover { background: #357abd; }

        .word-cloud {
            fill: #ff4d4f;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
        }
        
        #cloud-home { transition: all 0.5s ease; }
        #cloud-school { 
            transition: all 1s ease;
            opacity: 0;
            transform: translateY(50px);
        }
    </style>
</head>
<body>

    <div id="stage">
        <!-- 场景1：家里 -->
        <svg id="scene-home" class="scene" viewBox="0 0 800 600">
            <rect x="50" y="100" width="200" height="150" fill="#ddd" />
            <text x="100" y="180" font-size="20">电脑屏幕</text>
            <circle cx="400" cy="300" r="50" fill="#ffcc99" />
            <path d="M380 320 Q400 340 420 320" stroke="black" fill="none" />
            <text x="350" y="220" class="word-cloud">#@%&!</text>
            <text x="200" y="500" font-size="24" fill="#555">场景：家里 - 习惯养成中</text>
        </svg>

        <!-- 场景2：学校 -->
        <svg id="scene-school" class="scene hidden" viewBox="0 0 800 600">
            <rect x="0" y="0" width="800" height="600" fill="#e6f7ff" />
            <circle cx="200" cy="300" r="50" fill="#ffcc99" />
            <circle cx="600" cy="300" r="50" fill="#99ccff" />
            <text x="150" y="380">我</text>
            <text x="550" y="380">同学</text>
            <text id="cloud-school" x="250" y="280" class="word-cloud">#@%&!</text>
            <text x="550" y="250" font-size="40">☹️</text>
            <text x="100" y="500" font-size="24" fill="#d9363e">你对AI的粗鲁，正在悄悄变成你对朋友的伤害。</text>
        </svg>
    </div>

    <div id="controls">
        <button id="btn-toggle">时间流逝：去学校</button>
    </div>

    <script>
        const btn = document.getElementById('btn-toggle');
        const sceneHome = document.getElementById('scene-home');
        const sceneSchool = document.getElementById('scene-school');
        const cloudSchool = document.getElementById('cloud-school');
        
        let isAtSchool = false;

        btn.addEventListener('click', () => {
            isAtSchool = !isAtSchool;
            if (isAtSchool) {
                sceneHome.classList.add('hidden');
                sceneSchool.classList.remove('hidden');
                btn.textContent = "回到家里";
                
                // 动画效果
                setTimeout(() => {
                    cloudSchool.style.opacity = "1";
                    cloudSchool.style.transform = "translateY(0)";
                }, 300);
            } else {
                sceneHome.classList.remove('hidden');
                sceneSchool.classList.add('hidden');
                btn.textContent = "时间流逝：去学校";
                cloudSchool.style.opacity = "0";
                cloudSchool.style.transform = "translateY(50px)";
            }
        });
    </script>
</body>
</html>
