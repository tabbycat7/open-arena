<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>S4-2-1 诚实申报单</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --paper: #ffffff;
            --text: #333;
            --danger: #e74c3c;
            --success: #27ae60;
            --gold: #f1c40f;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 80vw;
            height: 60vh;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            gap: 20px;
        }
        .left-panel {
            flex: 1;
            border: 2px dashed #ccc;
            padding: 20px;
            position: relative;
            transition: all 0.3s;
        }
        .right-panel {
            width: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: white;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        .btn-hide { background-color: var(--danger); }
        .btn-show { background-color: var(--success); }
        
        #paper-content { font-size: 14px; line-height: 1.6; color: #555; }
        #declaration { 
            margin-top: 20px; 
            font-size: 12px; 
            color: var(--gold); 
            font-weight: bold;
            opacity: 0;
        }
        #status-msg {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left-panel" id="paper">
        <h3>我的作文：《未来的学校》</h3>
        <div id="paper-content">
            未来的学校是一座漂浮在云端的城堡。学生们通过传送门进入教室，书本都是全息投影的。我们可以在虚拟实验室里观察原子运动，在历史长廊中与古人对话。科技让学习变得无比有趣，我希望未来能成为一名科学家，创造出更多造福人类的工具……
        </div>
        <div id="declaration">本文大纲由AI辅助生成，正文由本人撰写并润色</div>
        <div id="status-msg"></div>
    </div>

    <div class="right-panel">
        <button class="btn-hide" id="btn-hide">隐瞒使用AI</button>
        <button class="btn-show" id="btn-show">主动附上AI辅助声明</button>
    </div>
</div>

<script>
    const paper = document.getElementById('paper');
    const declaration = document.getElementById('declaration');
    const statusMsg = document.getElementById('status-msg');
    const btnHide = document.getElementById('btn-hide');
    const btnShow = document.getElementById('btn-show');

    btnHide.addEventListener('click', () => {
        paper.style.borderColor = 'var(--gold)';
        paper.style.boxShadow = '0 0 20px rgba(241, 196, 15, 0.3)';
        declaration.style.opacity = '0';
        statusMsg.innerText = "⚠️ 如果被发现，将面临诚信危机！";
        statusMsg.style.color = 'var(--danger)';
    });

    btnShow.addEventListener('click', () => {
        paper.style.borderColor = 'var(--success)';
        paper.style.boxShadow = '0 0 20px rgba(39, 174, 96, 0.3)';
        declaration.style.opacity = '1';
        statusMsg.innerText = "✅ 诚实透明，合理使用！";
        statusMsg.style.color = 'var(--success)';
    });
</script>

</body>
</html>
