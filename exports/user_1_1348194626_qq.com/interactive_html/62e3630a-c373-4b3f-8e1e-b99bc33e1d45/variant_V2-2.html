<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>税率变化可视化</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        #container {
            width: 80vmin;
            height: 60vmin;
            background: white;
            border: 2px solid #ddd;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .controls {
            margin-top: 20px;
            width: 80vmin;
            text-align: center;
        }
        input[type=range] { width: 60%; cursor: pointer; }
        .label { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
        svg { width: 100%; height: 80%; overflow: visible; }
        .axis { stroke: #333; stroke-width: 2; }
        .tax-line { stroke: #e74c3c; stroke-width: 3; fill: none; transition: d 0.1s; }
        .grid { stroke: #eee; stroke-width: 1; }
        text { font-size: 12px; fill: #666; }
    </style>
</head>
<body>

<div id="container">
    <div class="label">税率调节：<span id="rateVal">3</span>%</div>
    <svg id="chart" viewBox="0 0 400 300">
        <!-- 坐标轴 -->
        <line x1="40" y1="260" x2="380" y2="260" class="axis" />
        <line x1="40" y1="260" x2="40" y2="20" class="axis" />
        
        <!-- 标签 -->
        <text x="350" y="280">收入</text>
        <text x="10" y="30">税额</text>
        
        <!-- 动态纳税线 -->
        <path id="taxLine" class="tax-line" d="M 40 260 L 360 260" />
        
        <!-- 高亮参考点 -->
        <circle id="point" cx="200" cy="260" r="5" fill="#2980b9" />
        <line id="guideX" x1="200" y1="260" x2="200" y2="260" stroke="#2980b9" stroke-dasharray="4" />
        <line id="guideY" x1="200" y1="260" x2="40" y2="260" stroke="#2980b9" stroke-dasharray="4" />
    </svg>
</div>

<div class="controls">
    <input type="range" id="rateSlider" min="1" max="10" step="0.1" value="3">
</div>

<script>
    const slider = document.getElementById('rateSlider');
    const rateVal = document.getElementById('rateVal');
    const taxLine = document.getElementById('taxLine');
    const point = document.getElementById('point');
    const guideX = document.getElementById('guideX');
    const guideY = document.getElementById('guideY');

    const originX = 40;
    const originY = 260;
    const maxX = 320; // 收入最大跨度
    const refX = 200; // 参考点横坐标

    function update() {
        const rate = parseFloat(slider.value);
        rateVal.textContent = rate.toFixed(1);
        
        // 计算斜率 (税率越高，斜率越大)
        // 假设最大收入对应高度为 200px
        const slope = (rate / 10) * 2; 
        const endY = originY - (maxX * slope);
        
        // 更新直线
        taxLine.setAttribute('d', `M ${originX} ${originY} L ${originX + maxX} ${endY}`);
        
        // 更新参考点位置
        const pointY = originY - ((refX - originX) * slope);
        point.setAttribute('cy', pointY);
        
        // 更新辅助线
        guideX.setAttribute('y2', pointY);
        guideY.setAttribute('y1', pointY);
        guideY.setAttribute('y2', pointY);
    }

    slider.addEventListener('input', update);
    
    // 初始化
    update();
</script>

</body>
</html>
