<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>算法执行演示</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f4f8;
            height: 100vh;
            box-sizing: border-box;
        }
        #container {
            width: 80vh;
            height: 60vh;
            background: white;
            border: 2px solid #333;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:disabled { background: #ccc; }
        .table {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            color: white;
        }
        #table1 { background: #28a745; left: 100px; top: 150px; }
        #table2 { background: #dc3545; left: 300px; top: 150px; }
        #robot {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #333;
            border-radius: 50%;
            transition: all 2s linear;
            z-index: 10;
        }
        #error-msg {
            position: absolute;
            top: 80px;
            left: 280px;
            color: red;
            font-size: 24px;
            font-weight: bold;
            display: none;
            border: 2px solid red;
            padding: 5px;
            background: rgba(255,255,255,0.9);
        }
    </style>
</head>
<body>

    <div class="controls">
        <strong>当前场景：</strong> 2号桌客人点餐了。
        <button id="runBtn">运行算法甲（去1号桌）</button>
    </div>

    <div id="container">
        <div id="table1" class="table">1号桌</div>
        <div id="table2" class="table">2号桌</div>
        <div id="robot" style="left: 200px; top: 350px;"></div>
        <div id="error-msg">❌ 送错啦！</div>
    </div>

    <script>
        const robot = document.getElementById('robot');
        const runBtn = document.getElementById('runBtn');
        const errorMsg = document.getElementById('error-msg');

        runBtn.addEventListener('click', () => {
            runBtn.disabled = true;
            errorMsg.style.display = 'none';
            
            // 机器人移动到1号桌位置
            robot.style.left = '120px';
            robot.style.top = '170px';

            // 动画结束后显示错误
            setTimeout(() => {
                errorMsg.style.display = 'block';
            }, 2000);
        });
    </script>
</body>
</html>
