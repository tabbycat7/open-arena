<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>算法评价：效率与消耗的权衡</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); color: var(--primary); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { width: 80vw; height: 60vh; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 25px; font-size: 18px; cursor: pointer; background: var(--accent); color: white; border: none; border-radius: 5px; margin: 0 10px; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        .chart-area { display: flex; justify-content: space-around; width: 100%; align-items: center; flex-grow: 1; }
        .gauge-box { text-align: center; }
        .gauge { width: 150px; height: 150px; border: 8px solid #eee; border-radius: 50%; position: relative; margin: 10px auto; }
        .needle { width: 4px; height: 60px; background: #e74c3c; position: absolute; left: 73px; top: 15px; transform-origin: bottom; transition: transform 0.5s ease; transform: rotate(0deg); }
        .label { font-weight: bold; margin-top: 10px; }
        #question-mark { font-size: 60px; color: #f1c40f; opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body>

<div class="container">
    <h3>送餐方案对比：哪种更好？</h3>
    <div class="controls">
        <button id="btn1">选择：路线一 (省电)</button>
        <button id="btn2">选择：路线二 (极速)</button>
    </div>
    
    <div class="chart-area">
        <div class="gauge-box">
            <div class="gauge"><div id="time-needle" class="needle"></div></div>
            <div class="label">时间消耗</div>
        </div>
        <div id="question-mark">?</div>
        <div class="gauge-box">
            <div class="gauge"><div id="power-needle" class="needle"></div></div>
            <div class="label">电量消耗</div>
        </div>
    </div>
    <p id="hint">请点击上方按钮进行对比观察</p>
</div>

<script>
    const btn1 = document.getElementById('btn1');
    const btn2 = document.getElementById('btn2');
    const timeNeedle = document.getElementById('time-needle');
    const powerNeedle = document.getElementById('power-needle');
    const qMark = document.getElementById('question-mark');
    const hint = document.getElementById('hint');

    function update(type) {
        qMark.style.opacity = 1;
        if (type === 'slow') {
            timeNeedle.style.transform = 'rotate(70deg)'; // 慢
            powerNeedle.style.transform = 'rotate(-70deg)'; // 省电
            hint.innerText = "路线一：虽然时间长，但电量消耗极低。如果电量有限，这是否是更好的选择？";
        } else {
            timeNeedle.style.transform = 'rotate(-70deg)'; // 快
            powerNeedle.style.transform = 'rotate(70deg)'; // 费电
            hint.innerText = "路线二：虽然速度极快，但电量消耗巨大。如果急需送餐，这是否是更好的选择？";
        }
    }

    btn1.addEventListener('click', () => update('slow'));
    btn2.addEventListener('click', () => update('fast'));
</script>

</body>
</html>
