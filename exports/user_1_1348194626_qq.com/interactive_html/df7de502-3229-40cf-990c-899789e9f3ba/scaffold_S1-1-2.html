<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>餐厅机器人路线选择</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #50c878;
            --danger: #ff6b6b;
            --bg: #f4f7f6;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 80%;
            max-width: 800px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 30px; }
        .cards {
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s, border 0.3s;
            border: 4px solid transparent;
            width: 40%;
        }
        .card:hover { transform: translateY(-5px); }
        .card.selected { border-color: var(--success); }
        .emoji { font-size: 60px; margin: 10px 0; }
        .label { font-weight: bold; font-size: 1.2em; }
        #feedback {
            margin-top: 30px;
            font-size: 1.5em;
            font-weight: bold;
            color: var(--success);
            height: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>如果你是餐厅经理，你会选择哪条路线？</h2>
    
    <div class="cards">
        <div class="card" id="slow-card">
            <div class="emoji">😠</div>
            <div class="label">慢速路线</div>
        </div>
        <div class="card" id="fast-card">
            <div class="emoji">😊</div>
            <div class="label">快速路线</div>
        </div>
    </div>

    <div id="feedback"></div>
</div>

<script>
    const fastCard = document.getElementById('fast-card');
    const slowCard = document.getElementById('slow-card');
    const feedback = document.getElementById('feedback');

    // 使用 Web Audio API 模拟金币音效
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playCoinSound() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 800;
        gain.gain.value = 0.1;
        osc.start();
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.stop(audioCtx.currentTime + 0.1);
    }

    fastCard.addEventListener('click', () => {
        fastCard.classList.add('selected');
        slowCard.classList.remove('selected');
        feedback.textContent = "选得好！速度快能提升顾客满意度。";
        playCoinSound();
    });

    slowCard.addEventListener('click', () => {
        slowCard.classList.add('selected');
        fastCard.classList.remove('selected');
        feedback.textContent = "再想想，慢速会让顾客等待太久哦！";
        feedback.style.color = "#ff6b6b";
    });
</script>

</body>
</html>
