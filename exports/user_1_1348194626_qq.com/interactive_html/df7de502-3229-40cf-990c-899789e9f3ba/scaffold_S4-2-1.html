<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>机器人任务路径分析</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
            color: #333;
        }
        #container {
            width: 80vw;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        svg { width: 100%; height: auto; border: 2px solid #ddd; border-radius: 8px; }
        .controls { margin-top: 20px; text-align: center; }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 0 10px;
        }
        button:disabled { background: #ccc; }
        #counter { font-size: 24px; font-weight: bold; color: #d9534f; margin-top: 10px; }
        .label { font-size: 14px; fill: #555; font-weight: bold; }
    </style>
</head>
<body>

<div id="container">
    <h3 style="text-align:center;">机器人任务路径追踪</h3>
    <svg id="scene" viewBox="0 0 600 200">
        <!-- 场景背景 -->
        <rect x="50" y="80" width="500" height="40" fill="#eee" rx="5"/>
        <text x="70" y="70" class="label">厨房</text>
        <text x="500" y="70" class="label">3号桌</text>
        
        <!-- 机器人 -->
        <circle id="robot" cx="70" cy="100" r="15" fill="#007bff"/>
        <text id="robotLabel" x="55" y="105" fill="white" font-size="12">机</text>
    </svg>

    <div class="controls">
        <button id="stepBtn">下一步</button>
        <button id="resetBtn">重置</button>
        <div id="counter">当前趟数：0</div>
    </div>
</div>

<script>
    const robot = document.getElementById('robot');
    const robotLabel = document.getElementById('robotLabel');
    const counterDisplay = document.getElementById('counter');
    const stepBtn = document.getElementById('stepBtn');
    const resetBtn = document.getElementById('resetBtn');

    let step = 0;
    const positions = [70, 530]; // 厨房, 3号桌
    const states = [
        { text: "送餐", color: "#28a745" },
        { text: "空回", color: "#6c757d" },
        { text: "空去", color: "#6c757d" },
        { text: "收盘", color: "#ffc107" }
    ];

    function update() {
        if (step >= 4) {
            stepBtn.disabled = true;
            return;
        }

        // 移动机器人
        const targetX = (step % 2 === 0) ? positions[1] : positions[0];
        robot.setAttribute('cx', targetX);
        robotLabel.setAttribute('x', targetX - 15);
        
        // 更新状态
        robot.setAttribute('fill', states[step].color);
        
        step++;
        counterDisplay.innerText = `当前趟数：${step}`;
    }

    function reset() {
        step = 0;
        robot.setAttribute('cx', positions[0]);
        robotLabel.setAttribute('x', positions[0] - 15);
        robot.setAttribute('fill', '#007bff');
        counterDisplay.innerText = `当前趟数：0`;
        stepBtn.disabled = false;
    }

    stepBtn.addEventListener('click', update);
    resetBtn.addEventListener('click', reset);
</script>

</body>
</html>
