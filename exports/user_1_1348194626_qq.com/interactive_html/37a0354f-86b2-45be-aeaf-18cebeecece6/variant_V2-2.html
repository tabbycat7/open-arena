<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>谁的税率更高？- 课堂交互教学课件</title>
  <style>
    /* 全局重置与 4:3 比例自适应设计 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft YaHei", sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 4:3 比例主容器 */
    .app-container {
      width: 800px;
      height: 600px;
      background-color: #ffffff;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      position: relative;
    }

    /* 头部标题 */
    .header {
      text-align: center;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 26px;
      color: #1a1a1a;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 15px;
      color: #666;
    }

    /* 账本对比区域 */
    .ledger-section {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 15px;
    }

    /* 账本卡片样式 */
    .ledger-card {
      flex: 1;
      background: #fdfbf7;
      border: 2px solid #e6dfd3;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      position: relative;
      transition: all 0.3s ease;
    }
    .ledger-card.active {
      border-color: #1890ff;
      box-shadow: 0 4px 15px rgba(24, 144, 255, 0.15);
    }
    .ledger-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      border-radius: 10px 10px 0 0;
    }
    #ledger-a::before { background-color: #fa8c16; } /* 橙色 - 小李饭店 */
    #ledger-b::before { background-color: #1890ff; } /* 蓝色 - 大世界超市 */

    .ledger-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      color: #fff;
    }
    #ledger-a .badge { background-color: #fa8c16; }
    #ledger-b .badge { background-color: #1890ff; }

    .data-row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      margin-bottom: 8px;
      color: #555;
    }
    .data-row strong {
      color: #111;
      font-size: 16px;
    }

    /* 交互按钮与公式 */
    .action-area {
      margin-top: 12px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .calc-btn {
      background-color: #fff;
      border: 1.5px solid #d9d9d9;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      color: #555;
    }
    .calc-btn:hover {
      border-color: #40a9ff;
      color: #40a9ff;
      background-color: #f6ffed;
    }
    .calc-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* 分数公式样式 */
    .formula-box {
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #333;
      animation: fadeIn 0.4s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fraction {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin: 0 8px;
      vertical-align: middle;
    }
    .numerator {
      border-bottom: 1.5px solid #333;
      padding: 0 4px 2px 4px;
      font-weight: bold;
    }
    .denominator {
      padding: 2px 4px 0 4px;
    }
    .eq {
      font-size: 18px;
      margin: 0 6px;
      font-weight: bold;
    }
    .result-rate {
      font-size: 20px;
      font-weight: bold;
      color: #f5222d;
    }

    /* 图表展示区域 */
    .chart-section {
      background-color: #fafafa;
      border: 1px solid #f0f0f0;
      border-radius: 12px;
      padding: 16px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    /* 切换控制器 */
    .control-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .toggle-btn {
      background-color: #e8e8e8;
      border: none;
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      transition: all 0.3s;
    }
    .toggle-btn.active {
      background-color: #314659;
      color: #fff;
      box-shadow: 0 4px 10px rgba(49, 70, 89, 0.3);
    }

    /* SVG 柱状图 */
    .chart-container {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg {
      width: 100%;
      height: 180px;
    }
    .bar {
      transition: y 0.6s cubic-bezier(0.25, 0.8, 0.25, 1), height 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .bar-label {
      transition: y 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
      font-weight: bold;
    }

    /* 底部思考引导 */
    .footer-thinking {
      background-color: #e6f7ff;
      border-left: 4px solid #1890ff;
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      font-size: 14px;
      color: #0050b3;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 头部 -->
    <div class="header">
      <h1>谁的税率更高？</h1>
      <p>点击账本上的“计算税率”按钮，观察纳税额与税率的动态对比</p>
    </div>

    <!-- 账本对比区 -->
    <div class="ledger-section">
      <!-- 商家 A -->
      <div class="ledger-card" id="ledger-a">
        <div class="ledger-title">
          <span>小李饭店</span>
          <span class="badge">商家 A</span>
        </div>
        <div class="data-row">
          <span>本月营业额：</span>
          <strong>10 万元</strong>
        </div>
        <div class="data-row">
          <span>向国家交税：</span>
          <strong style="color: #fa8c16;">3,000 元</strong>
        </div>
        <div class="action-area">
          <button class="calc-btn" id="btn-calc-a">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            计算税率
          </button>
          <div class="formula-box" id="formula-a">
            <div class="fraction">
              <span class="numerator">3,000 元</span>
              <span class="denominator">100,000 元</span>
            </div>
            <span class="eq">=</span>
            <span class="result-rate">3%</span>
          </div>
        </div>
      </div>

      <!-- 商家 B -->
      <div class="ledger-card" id="ledger-b">
        <div class="ledger-title">
          <span>大世界超市</span>
          <span class="badge">商家 B</span>
        </div>
        <div class="data-row">
          <span>本月营业额：</span>
          <strong>20 万元</strong>
        </div>
        <div class="data-row">
          <span>向国家交税：</span>
          <strong style="color: #1890ff;">6,000 元</strong>
        </div>
        <div class="action-area">
          <button class="calc-btn" id="btn-calc-b">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            计算税率
          </button>
          <div class="formula-box" id="formula-b">
            <div class="fraction">
              <span class="numerator">6,000 元</span>
              <span class="denominator">200,000 元</span>
            </div>
            <span class="eq">=</span>
            <span class="result-rate">3%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 图表展示区 -->
    <div class="chart-section">
      <div class="control-bar">
        <button class="toggle-btn active" id="btn-mode-tax">对比：纳税额 (元)</button>
        <button class="toggle-btn" id="btn-mode-rate">对比：税率 (%)</button>
      </div>
      <div class="chart-container">
        <svg viewBox="0 0 500 180">
          <!-- 背景网格线 -->
          <line x1="50" y1="30" x2="450" y2="30" stroke="#f0f0f0" stroke-width="1.5" />
          <line x1="50" y1="85" x2="450" y2="85" stroke="#f0f0f0" stroke-width="1.5" />
          <line x1="50" y1="140" x2="450" y2="140" stroke="#d9d9d9" stroke-width="2" />

          <!-- 柱子 A (小李饭店) -->
          <rect class="bar" id="bar-a" x="130" y="140" width="60" height="0" fill="#fa8c16" rx="6" />
          <text class="bar-label" id="label-a" x="160" y="130" text-anchor="middle" font-size="15" fill="#d46b08">0</text>

          <!-- 柱子 B (大世界超市) -->
          <rect class="bar" id="bar-b" x="310" y="140" width="60" height="0" fill="#1890ff" rx="6" />
          <text class="bar-label" id="label-b" x="340" y="130" text-anchor="middle" font-size="15" fill="#096dd9">0</text>

          <!-- X轴标签 -->
          <text x="160" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">小李饭店 (A)</text>
          <text x="340" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">大世界超市 (B)</text>
        </svg>
      </div>
    </div>

    <!-- 引导思考 -->
    <div class="footer-thinking">
      <strong>💡 课堂思考：</strong>
      大世界超市交的税款（6000元）明显比小李饭店（3000元）多。这能说明大世界超市的税率更高吗？请结合上图的计算和对比，说说你的发现。
    </div>
  </div>

  <script>
    // 数据定义
    const data = {
      tax: {
        a: { val: 3000, height: 50, label: "3,000 元" },
        b: { val: 6000, height: 100, label: "6,000 元" }
      },
      rate: {
        a: { val: 3, height: 80, label: "3%" },
        b: { val: 3, height: 80, label: "3%" }
      }
    };

    let currentMode = 'tax'; // 'tax' 或 'rate'
    let calcAOpened = false;
    let calcBOpened = false;

    // DOM 元素获取
    const btnModeTax = document.getElementById('btn-mode-tax');
    const btnModeRate = document.getElementById('btn-mode-rate');
    const barA = document.getElementById('bar-a');
    const barB = document.getElementById('bar-b');
    const labelA = document.getElementById('label-a');
    const labelB = document.getElementById('label-b');

    const btnCalcA = document.getElementById('btn-calc-a');
    const btnCalcB = document.getElementById('btn-calc-b');
    const formulaA = document.getElementById('formula-a');
    const formulaB = document.getElementById('formula-b');
    const cardA = document.getElementById('ledger-a');
    const cardB = document.getElementById('ledger-b');

    // 更新图表渲染
    function updateChart() {
      const modeData = data[currentMode];
      const baselineY = 140;

      // 更新柱子 A
      barA.setAttribute('height', modeData.a.height);
      barA.setAttribute('y', baselineY - modeData.a.height);
      labelA.textContent = modeData.a.label;
      labelA.setAttribute('y', baselineY - modeData.a.height - 8);

      // 更新柱子 B
      barB.setAttribute('height', modeData.b.height);
      barB.setAttribute('y', baselineY - modeData.b.height);
      labelB.textContent = modeData.b.label;
      labelB.setAttribute('y', baselineY - modeData.b.height - 8);
    }

    // 切换模式
    function setMode(mode) {
      currentMode = mode;
      if (mode === 'tax') {
        btnModeTax.classList.add('active');
        btnModeRate.classList.remove('active');
      } else {
        btnModeTax.classList.remove('active');
        btnModeRate.classList.add('active');
      }
      updateChart();
    }

    // 交互事件绑定
    btnModeTax.addEventListener('click', () => setMode('tax'));
    btnModeRate.addEventListener('click', () => setMode('rate'));

    // 点击计算 A
    btnCalcA.addEventListener('click', () => {
      btnCalcA.style.display = 'none';
      formulaA.style.display = 'inline-flex';
      cardA.classList.add('active');
      calcAOpened = true;
      checkAutoSwitch();
    });

    // 点击计算 B
    btnCalcB.addEventListener('click', () => {
      btnCalcB.style.display = 'none';
      formulaB.style.display = 'inline-flex';
      cardB.classList.add('active');
      calcBOpened = true;
      checkAutoSwitch();
    });

    // 自动切换逻辑：当两个税率都计算出来后，自动切到税率对比，给学生直观的视觉冲击
    function checkAutoSwitch() {
      if (calcAOpened && calcBOpened) {
        setTimeout(() => {
          setMode('rate');
        }, 600);
      }
    }

    // 初始化渲染
    updateChart();
  </script>
</body>
</html>
