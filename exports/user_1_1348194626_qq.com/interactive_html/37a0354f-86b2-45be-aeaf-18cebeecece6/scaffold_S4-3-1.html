<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算式对比与税收分析可视化</title>
  <style>
    :root {
      --primary-color: #3f51b5;
      --success-color: #2e7d32;
      --error-color: #c62828;
      --neutral-color: #37474f;
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft YaHei', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* 4:3 比例自适应容器 */
    .app-container {
      width: 95vw;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    /* 头部区域 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eceff1;
      padding-bottom: 12px;
    }

    .title-area h1 {
      margin: 0;
      font-size: 22px;
      color: var(--neutral-color);
    }

    .title-area p {
      margin: 4px 0 0 0;
      font-size: 14px;
      color: #78909c;
    }

    .btn-reset {
      background: #cfd8dc;
      color: var(--neutral-color);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: #b0bec5;
    }

    /* 算式选择区域 */
    .formula-section {
      display: flex;
      gap: 20px;
      margin: 16px 0;
    }

    .formula-card {
      flex: 1;
      background: #f8f9fa;
      border: 3px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .formula-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.05);
    }

    .formula-card.active-error {
      border-color: var(--error-color);
      background-color: #ffebee;
      box-shadow: 0 8px 20px rgba(198, 40, 40, 0.15);
    }

    .formula-card.active-correct {
      border-color: var(--success-color);
      background-color: #e8f5e9;
      box-shadow: 0 8px 20px rgba(46, 125, 50, 0.15);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      background: #e0e0e0;
      color: #616161;
      margin-bottom: 8px;
      transition: all 0.3s;
    }

    .active-error .card-badge {
      background: var(--error-color);
      color: #fff;
    }

    .active-correct .card-badge {
      background: var(--success-color);
      color: #fff;
    }

    .card-expr {
      font-size: 26px;
      font-weight: bold;
      color: #212121;
      font-family: 'Cambria', Georgia, serif;
    }

    /* 可视化图形区域 */
    .visual-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fafafa;
      border-radius: 12px;
      border: 1px dashed #cfd8dc;
      padding: 10px;
    }

    /* SVG 内部样式与动画 */
    .svg-rect {
      transition: fill 0.4s ease, stroke 0.4s ease;
    }

    .svg-text {
      transition: fill 0.4s ease;
    }

    /* 状态机样式控制 */
    /* 5000元区域状态 */
    .group-5000.neutral .svg-rect { fill: #e8f5e9; stroke: #81c784; }
    .group-5000.neutral .svg-text-val { fill: #2e7d32; }
    .group-5000.neutral .svg-text-lbl { fill: #4caf50; }
    .group-5000.neutral .overlay { opacity: 0; }

    .group-5000.taxed .svg-rect { fill: #ffebee; stroke: #e57373; }
    .group-5000.taxed .svg-text-val { fill: #c62828; }
    .group-5000.taxed .svg-text-lbl { fill: #e53935; }
    .group-5000.taxed .overlay { opacity: 1; }

    .group-5000.exempt .svg-rect { fill: #e8f5e9; stroke: #4caf50; }
    .group-5000.exempt .svg-text-val { fill: #1b5e20; }
    .group-5000.exempt .svg-text-lbl { fill: #2e7d32; }
    .group-5000.exempt .overlay { opacity: 0; }

    /* 3000元区域状态 */
    .group-3000.neutral .svg-rect { fill: #e3f2fd; stroke: #64b5f6; }
    .group-3000.neutral .svg-text-val { fill: #1565c0; }
    .group-3000.neutral .svg-text-lbl { fill: #2196f3; }
    .group-3000.neutral .overlay { opacity: 0; }

    .group-3000.taxed .svg-rect { fill: #ffebee; stroke: #e57373; }
    .group-3000.taxed .svg-text-val { fill: #c62828; }
    .group-3000.taxed .svg-text-lbl { fill: #e53935; }
    .group-3000.taxed .overlay { opacity: 1; }

    /* 信息提示面板 */
    .info-panel {
      background: #eceff1;
      border-left: 6px solid #90a4ae;
      padding: 16px;
      border-radius: 8px;
      font-size: 16px;
      line-height: 1.5;
      color: var(--neutral-color);
      min-height: 72px;
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .info-panel.error {
      border-color: var(--error-color);
      background: #ffebee;
      color: #c62828;
    }

    .info-panel.correct {
      border-color: var(--success-color);
      background: #e8f5e9;
      color: #2e7d32;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 头部 -->
    <div class="header">
      <div class="title-area">
        <h1>算式对比与税收分析</h1>
        <p>点击下方算式，观察 8000 元总收入的计税变化</p>
      </div>
      <button class="btn-reset" id="btn-reset">重置观察</button>
    </div>

    <!-- 算式选择 -->
    <div class="formula-section">
      <div class="formula-card" id="btn-f1">
        <div class="card-badge">算式 ①</div>
        <div class="card-expr">8000 × 3%</div>
      </div>
      <div class="formula-card" id="btn-f2">
        <div class="card-badge">算式 ②</div>
        <div class="card-expr">(8000 - 5000) × 3%</div>
      </div>
    </div>

    <!-- 可视化图形 -->
    <div class="visual-section">
      <svg viewBox="0 0 800 320" width="100%" height="100%">
        <!-- 5000元免税额度组 -->
        <g id="group-5000" class="group-5000 neutral">
          <!-- 基础色块 -->
          <rect class="svg-rect" x="80" y="60" width="390" height="120" rx="12" stroke-width="3" />
          <text class="svg-text svg-text-val" x="275" y="120" text-anchor="middle" font-size="24" font-weight="bold">5000 元</text>
          <text class="svg-text svg-text-lbl" x="275" y="155" text-anchor="middle" font-size="16" font-weight="bold">免税额度 (起征点)</text>
          
          <!-- 征税覆盖层 -->
          <g class="overlay" style="transition: opacity 0.4s ease; pointer-events: none;">
            <rect x="80" y="60" width="390" height="120" rx="12" fill="rgba(244, 67, 54, 0.15)" stroke="#d32f2f" stroke-width="3" stroke-dasharray="6,4" />
            <rect x="215" y="20" width="120" height="30" rx="15" fill="#d32f2f" />
            <text x="275" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">被乘了 3% ❌</text>
          </g>
        </g>

        <!-- 3000元超出部分组 -->
        <g id="group-3000" class="group-3000 neutral">
          <!-- 基础色块 -->
          <rect class="svg-rect" x="490" y="60" width="230" height="120" rx="12" stroke-width="3" />
          <text class="svg-text svg-text-val" x="605" y="120" text-anchor="middle" font-size="24" font-weight="bold">3000 元</text>
          <text class="svg-text svg-text-lbl" x="605" y="155" text-anchor="middle" font-size="16" font-weight="bold">超出部分</text>
          
          <!-- 征税覆盖层 -->
          <g class="overlay" style="transition: opacity 0.4s ease; pointer-events: none;">
            <rect x="490" y="60" width="230" height="120" rx="12" fill="rgba(244, 67, 54, 0.15)" stroke="#d32f2f" stroke-width="3" stroke-dasharray="6,4" />
            <rect x="545" y="20" width="120" height="30" rx="15" fill="#d32f2f" />
            <text x="605" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">计算税额 3%</text>
          </g>
        </g>

        <!-- 总收入大括号与标注 -->
        <path d="M 80 210 L 80 230 L 400 230 L 400 240 L 400 230 L 720 230 L 720 210" fill="none" stroke="#78909c" stroke-width="3" />
        <text x="400" y="275" text-anchor="middle" font-size="22" font-weight="bold" fill="#37474f">总收入 8000 元</text>
      </svg>
    </div>

    <!-- 动态提示面板 -->
    <div class="info-panel" id="info-panel">
      💡 <strong>请点击上方算式</strong>，观察它们是如何对这 8000 元进行计算的。
    </div>
  </div>

  <script>
    const btnF1 = document.getElementById('btn-f1');
    const btnF2 = document.getElementById('btn-f2');
    const btnReset = document.getElementById('btn-reset');
    const group5000 = document.getElementById('group-5000');
    const group3000 = document.getElementById('group-3000');
    const infoPanel = document.getElementById('info-panel');

    function setNeutral() {
      btnF1.className = 'formula-card';
      btnF2.className = 'formula-card';
      group5000.className.baseVal = 'group-5000 neutral';
      group3000.className.baseVal = 'group-3000 neutral';
      infoPanel.className = 'info-panel';
      infoPanel.innerHTML = '💡 <strong>请点击上方算式</strong>，观察它们是如何对这 8000 元进行计算的。';
    }

    function setF1() {
      btnF1.className = 'formula-card active-error';
      btnF2.className = 'formula-card';
      group5000.className.baseVal = 'group-5000 taxed';
      group3000.className.baseVal = 'group-3000 taxed';
      infoPanel.className = 'info-panel error';
      infoPanel.innerHTML = '⚠️ <strong>注意：</strong>算式 ① 直接用 8000 × 3%，导致<strong>免税的 5000 元也被一起乘了 3%</strong>！这相当于对免税部分也征了税。';
    }

    function setF2() {
      btnF1.className = 'formula-card';
      btnF2.className = 'formula-card active-correct';
      group5000.className.baseVal = 'group-5000 exempt';
      group3000.className.baseVal = 'group-3000 taxed';
      infoPanel.className = 'info-panel correct';
      infoPanel.innerHTML = '✅ <strong>观察：</strong>算式 ② 先用 8000 - 5000 排除免税额度，<strong>只对超出的 3000 元计算 3% 的税</strong>。免税的 5000 元得到了保护！';
    }

    btnF1.addEventListener('click', () => {
      if (btnF1.classList.contains('active-error')) {
        setNeutral();
      } else {
        setF1();
      }
    });

    btnF2.addEventListener('click', () => {
      if (btnF2.classList.contains('active-correct')) {
        setNeutral();
      } else {
        setF2();
      }
    });

    btnReset.addEventListener('click', setNeutral);
  </script>
</body>
</html>
