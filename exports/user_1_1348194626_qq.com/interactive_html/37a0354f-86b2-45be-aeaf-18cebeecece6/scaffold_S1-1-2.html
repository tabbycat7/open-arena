<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>税款与营业额的关系 - 交互可视化</title>
  <style>
    :root {
      --primary-color: #3498db;
      --success-color: #2ecc71;
      --warning-color: #f1c40f;
      --danger-color: #e74c3c;
      --dark-color: #2c3e50;
      --light-color: #ecf0f1;
      --bg-color: #f0f4f8;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 4:3 比例自适应容器 */
    .classroom-container {
      width: 95vw;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px 30px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    /* 头部标题区 */
    .header {
      text-align: center;
    }

    .header h2 {
      margin: 0 0 8px 0;
      color: var(--dark-color);
      font-size: 24px;
      font-weight: 700;
    }

    .header p {
      margin: 0;
      color: #7f8c8d;
      font-size: 16px;
    }

    /* 交互主区域 */
    .interactive-area {
      position: relative;
      flex-grow: 1;
      margin: 20px 0;
      background: #fcfdfd;
      border-radius: 16px;
      border: 2px dashed #e2e8f0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* 拖拽时的目标区域高亮 */
    .interactive-area.dragging-active {
      border-color: var(--primary-color);
      background-color: rgba(52, 152, 219, 0.03);
    }

    /* 角色标签 */
    .role-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      color: white;
      margin-top: 8px;
    }

    .role-tag.whole {
      background-color: #e67e22;
    }

    .role-tag.part {
      background-color: var(--danger-color);
    }

    /* 袋子区域通用样式 */
    .bag-zone {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      transition: border-color 0.3s, background-color 0.3s;
    }

    /* 营业额大袋子（目标区） */
    #turnover-zone {
      left: 15%;
      top: 15%;
      width: 240px;
      height: 260px;
      cursor: pointer;
    }

    /* 税款小袋子（可拖拽） */
    #tax-drag {
      left: 65%;
      top: 25%;
      width: 160px;
      height: 180px;
      cursor: grab;
      touch-action: none; /* 阻止移动端默认滚动行为 */
      z-index: 10;
      transition: transform 0.1s ease;
    }

    #tax-drag:active {
      cursor: grabbing;
    }

    #tax-drag.dragging {
      transform: scale(1.08);
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
    }

    .bag-svg {
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
      transition: transform 0.3s ease;
    }

    .bag-label {
      font-size: 18px;
      font-weight: bold;
      color: var(--dark-color);
      margin-top: 8px;
      text-align: center;
    }

    /* 公式与反馈区 */
    .formula-container {
      background: #f8fafc;
      border-radius: 16px;
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .formula-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .formula-item {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      min-width: 90px;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .formula-item.empty {
      border: 2px dashed #cbd5e1;
      color: #94a3b8;
      background-color: #ffffff;
      animation: pulse 2s infinite;
    }

    .formula-item.part-active {
      background-color: var(--danger-color);
      color: white;
      box-shadow: 0 4px 10px rgba(231, 76, 60, 0.2);
    }

    .formula-item.whole-active {
      background-color: #e67e22;
      color: white;
      box-shadow: 0 4px 10px rgba(230, 126, 34, 0.2);
    }

    .formula-item.result {
      background-color: var(--success-color);
      color: white;
      box-shadow: 0 4px 10px rgba(46, 204, 113, 0.2);
    }

    .formula-op {
      font-size: 24px;
      font-weight: bold;
      color: #64748b;
    }

    /* 提示信息 */
    .feedback-msg {
      font-size: 16px;
      color: var(--dark-color);
      text-align: center;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.5;
      padding: 0 10px;
    }

    .feedback-msg strong {
      color: var(--danger-color);
      margin: 0 4px;
    }

    .feedback-msg.success-msg {
      color: #1e3a8a;
    }

    .feedback-msg.fail-msg {
      color: #9a3412;
      animation: shake 0.5s ease;
    }

    /* 重置按钮 */
    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);
      margin-top: 8px;
    }

    .btn:hover {
      background-color: #2980b9;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .hidden {
      display: none !important;
    }

    /* 动画定义 */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); border-color: #94a3b8; }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="classroom-container">
    <!-- 头部 -->
    <div class="header">
      <h2>探索：税款与营业额的关系</h2>
      <p>请用手指或鼠标拖动右侧的【税款】袋子，放入左侧的【营业额】袋子中。</p>
    </div>

    <!-- 交互区 -->
    <div class="interactive-area">
      <!-- 营业额大袋子 -->
      <div id="turnover-zone" class="bag-zone">
        <svg class="bag-svg" viewBox="0 0 200 220" width="180" height="198">
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFE57F" />
              <stop offset="40%" stop-color="#FFC107" />
              <stop offset="100%" stop-color="#FF8F00" />
            </linearGradient>
            <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF8A80" />
              <stop offset="40%" stop-color="#FF5252" />
              <stop offset="100%" stop-color="#C62828" />
            </linearGradient>
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="6" stdDeviation="4" flood-opacity="0.1"/>
            </filter>
          </defs>
          <!-- 袋子主体 -->
          <path d="M 100,30 C 75,30 65,55 80,75 C 50,90 35,130 45,175 C 55,210 145,210 155,175 C 165,130 150,90 120,75 C 135,55 125,30 100,30 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
          <!-- 扎绳 -->
          <path d="M 76,73 C 85,78 115,78 124,73 C 128,70 128,76 124,79 C 115,84 85,84 76,79 C 72,76 72,70 76,73 Z" fill="#D84315" />
          <path d="M 95,78 L 85,95 L 93,97 Z" fill="#D84315" />
          <path d="M 105,78 L 115,95 L 107,97 Z" fill="#D84315" />
          <!-- 营业额符号 -->
          <text x="100" y="145" font-family="system-ui" font-weight="bold" font-size="42" fill="#FFFFFF" text-anchor="middle" opacity="0.9">¥</text>
          
          <!-- 成功后显现的税款占比阴影 -->
          <path id="tax-slice" d="M 48,160 C 55,195 145,195 152,160 C 155,175 145,205 100,205 C 55,205 45,175 48,160 Z" fill="url(#redGrad)" opacity="0" style="transition: opacity 0.5s ease;" />
          <text id="tax-slice-text" x="100" y="190" font-family="system-ui" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle" opacity="0" style="transition: opacity 0.5s ease;">税款 (部分)</text>
        </svg>
        <div class="bag-label">营业额 <br><span class="role-tag whole">整体</span></div>
      </div>

      <!-- 税款小袋子 -->
      <div id="tax-drag" class="bag-zone">
        <svg class="bag-svg" viewBox="0 0 120 130" width="110" height="119">
          <!-- 袋子主体 -->
          <path d="M 60,18 C 45,18 39,33 48,45 C 30,54 21,78 27,105 C 33,126 87,126 93,105 C 99,78 90,54 72,45 C 81,33 75,18 60,18 Z" fill="url(#redGrad)" filter="url(#shadow)"/>
          <!-- 扎绳 -->
          <path d="M 46,44 C 51,47 69,47 74,44 C 77,42 77,46 74,48 C 69,51 51,51 46,48 C 43,46 43,42 46,44 Z" fill="#FFD54F" />
          <path d="M 57,47 L 51,58 L 56,59 Z" fill="#FFD54F" />
          <path d="M 63,47 L 69,58 L 64,59 Z" fill="#FFD54F" />
          <!-- 税款符号 -->
          <text x="60" y="85" font-family="system-ui" font-weight="bold" font-size="26" fill="#FFFFFF" text-anchor="middle" opacity="0.9">¥</text>
        </svg>
        <div class="bag-label">税款 <br><span class="role-tag part">部分</span></div>
      </div>
    </div>

    <!-- 底部公式与反馈 -->
    <div class="formula-container">
      <div class="formula-box">
        <span id="formula-part" class="formula-item empty">?</span>
        <span class="formula-op">÷</span>
        <span id="formula-whole" class="formula-item empty">?</span>
        <span class="formula-op">=</span>
        <span class="formula-item result">百分数 (税率)</span>
      </div>
      <div id="feedback" class="feedback-msg">
        试着把“税款”袋子拖进“营业额”袋子中！
      </div>
      <button id="reset-btn" class="btn hidden">重新探索</button>
    </div>
  </div>

  <script>
    const dragEl = document.getElementById('tax-drag');
    const targetEl = document.getElementById('turnover-zone');
    const interactiveArea = document.querySelector('.interactive-area');
    const taxSlice = document.getElementById('tax-slice');
    const taxSliceText = document.getElementById('tax-slice-text');
    const formulaPart = document.getElementById('formula-part');
    const formulaWhole = document.getElementById('formula-whole');
    const feedback = document.getElementById('feedback');
    const resetBtn = document.getElementById('reset-btn');

    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let currentY = 0;

    // 记录初始位置
    const initialLeft = dragEl.offsetLeft;
    const initialTop = dragEl.offsetTop;

    // 绑定指针事件（兼容鼠标与触摸屏）
    dragEl.addEventListener('pointerdown', onPointerDown);
    targetEl.addEventListener('click', onTargetClick);

    function onPointerDown(e) {
      if (dragEl.classList.contains('success-state')) return;
      
      isDragging = true;
      dragEl.setPointerCapture(e.pointerId);
      
      // 减去当前已有的位移，保证拖拽平滑
      startX = e.clientX - currentX;
      startY = e.clientY - currentY;
      
      dragEl.style.transition = 'none';
      dragEl.classList.add('dragging');
      interactiveArea.classList.add('dragging-active');

      feedback.textContent = "正在拖动：把税款放入营业额中...";
      feedback.className = "feedback-msg";
    }

    // 绑定在 window 上，防止拖拽过快丢失焦点
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    function onPointerMove(e) {
      if (!isDragging) return;
      currentX = e.clientX - startX;
      currentY = e.clientY - startY;
      dragEl.style.transform = `translate(${currentX}px, ${currentY}px)`;
    }

    function onPointerUp(e) {
      if (!isDragging) return;
      isDragging = false;
      dragEl.releasePointerCapture(e.pointerId);
      dragEl.classList.remove('dragging');
      interactiveArea.classList.remove('dragging-active');

      // 碰撞检测
      const dragRect = dragEl.getBoundingClientRect();
      const targetRect = targetEl.getBoundingClientRect();

      // 计算税款袋子中心点
      const dragCenter = {
        x: dragRect.left + dragRect.width / 2,
        y: dragRect.top + dragRect.height / 2
      };

      // 判断中心点是否在营业额袋子范围内
      const isInside = (
        dragCenter.x >= targetRect.left &&
        dragCenter.x <= targetRect.right &&
        dragCenter.y >= targetRect.top &&
        dragCenter.y <= targetRect.bottom
      );

      if (isInside) {
        triggerSuccess();
      } else {
        triggerFail();
      }
    }

    // 成功状态
    function triggerSuccess() {
      dragEl.classList.add('success-state');
      
      // 计算飞入大袋子中心的动画位移
      const containerRect = interactiveArea.getBoundingClientRect();
      const targetCenterX = (targetEl.offsetLeft + targetEl.offsetWidth / 2);
      const targetCenterY = (targetEl.offsetTop + targetEl.offsetHeight / 2);
      
      const dragStartX = initialLeft + dragEl.offsetWidth / 2;
      const dragStartY = initialTop + dragEl.offsetHeight / 2;

      const targetX = targetCenterX - dragStartX;
      const targetY = targetCenterY - dragStartY;

      dragEl.style.transition = 'all 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
      dragEl.style.transform = `translate(${targetX}px, ${targetY}px) scale(0.1)`;
      dragEl.style.opacity = '0';

      // 营业额袋子内部占比显现
      setTimeout(() => {
        taxSlice.style.opacity = '1';
        taxSliceText.style.opacity = '1';
      }, 300);

      // 更新公式
      formulaPart.textContent = "税款";
      formulaPart.className = "formula-item part-active";
      formulaWhole.textContent = "营业额";
      formulaWhole.className = "formula-item whole-active";

      // 反馈信息
      feedback.innerHTML = "太棒了！🎉 观察发现：<strong>税款是营业额的一部分</strong>。<br>所以，是“交的税款”占“营业额”的百分之几。";
      feedback.className = "feedback-msg success-msg";

      resetBtn.classList.remove('hidden');
    }

    // 失败状态
    function triggerFail() {
      dragEl.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      currentX = 0;
      currentY = 0;
      dragEl.style.transform = 'translate(0px, 0px)';

      feedback.textContent = "想一想：税款和营业额，哪个是“部分”，哪个是“整体”？试着把税款放进营业额里！";
      feedback.className = "feedback-msg fail-msg";
    }

    // 点击大袋子提示
    function onTargetClick() {
      if (dragEl.classList.contains('success-state')) return;
      feedback.textContent = "营业额是商家的全部收入（整体）。请拖动右侧红色的“税款”袋子放入其中！";
      feedback.className = "feedback-msg fail-msg";
    }

    // 重置按钮
    resetBtn.addEventListener('click', () => {
      dragEl.classList.remove('success-state');
      dragEl.style.transition = 'none';
      currentX = 0;
      currentY = 0;
      dragEl.style.transform = 'translate(0px, 0px)';
      dragEl.style.opacity = '1';

      taxSlice.style.opacity = '0';
      taxSliceText.style.opacity = '0';

      formulaPart.textContent = "?";
      formulaPart.className = "formula-item empty";
      formulaWhole.textContent = "?";
      formulaWhole.className = "formula-item empty";

      feedback.textContent = "拖动右侧的“税款”袋子，放入左侧的“营业额”中，看看它们的关系吧！";
      feedback.className = "feedback-msg";
      resetBtn.classList.add('hidden');
    });
  </script>
</body>
</html>
