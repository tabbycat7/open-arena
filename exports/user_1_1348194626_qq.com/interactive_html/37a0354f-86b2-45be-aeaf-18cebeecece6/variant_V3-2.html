<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>双部门纳税额大比拼 - 交互可视化教学</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --jia-color: #f97316;
            --jia-light: #ffedd5;
            --jia-border: #fdba74;
            --yi-color: #0284c7;
            --yi-light: #e0f2fe;
            --yi-border: #7dd3fc;
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* 4:3 比例自适应容器 */
        .container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 头部区域 */
        .header {
            padding: 20px 30px 10px 30px;
            background: linear-gradient(to bottom, #f1f5f9, #ffffff);
            border-bottom: 1px solid #e2e8f0;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-badge {
            background-color: var(--primary-color);
            color: white;
            font-size: 14px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .question-prompt {
            margin-top: 8px;
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.5;
            background-color: #f0fdf4;
            border-left: 4px solid #22c55e;
            padding: 8px 12px;
            border-radius: 0 8px 8px 0;
        }

        /* 可视化主体区域 */
        .visualization-area {
            flex: 1;
            position: relative;
            background-color: var(--bg-color);
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            user-select: none;
        }

        /* 控制面板 */
        .control-panel {
            padding: 20px 30px;
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #e2e8f0;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover:not(:disabled) {
            background-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #2563eb;
        }

        .btn-reset {
            background-color: #ef4444;
            color: white;
        }

        .btn-reset:hover {
            background-color: #dc2626;
        }

        .btn.active-step {
            outline: 3px solid #93c5fd;
            background-color: #1e40af;
            color: white;
        }

        /* 结论卡片 */
        .result-card {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            width: 90%;
            background-color: rgba(255, 255, 255, 0.95);
            border: 2px solid #22c55e;
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 10;
        }

        .result-card.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .result-title {
            font-size: 18px;
            font-weight: 800;
            color: #15803d;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-desc {
            font-size: 15px;
            color: #374151;
            line-height: 1.6;
        }

        /* SVG 样式 */
        .label-title {
            font-size: 18px;
            font-weight: 800;
            fill: #0f172a;
        }

        .label-sub {
            font-size: 15px;
            font-weight: 600;
            fill: var(--text-muted);
        }

        .label-rate {
            font-size: 16px;
            font-weight: 800;
        }

        .jia-color { fill: var(--jia-color); }
        .yi-color { fill: var(--yi-color); }

        .formula-text {
            font-size: 16px;
            font-weight: 700;
            filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.1));
        }

        .axis-label {
            font-size: 12px;
            fill: var(--text-muted);
            font-weight: 600;
        }

        .compare-bar-label {
            font-size: 14px;
            font-weight: 700;
            fill: #334155;
        }

        .diff-text {
            font-size: 14px;
            font-weight: 800;
            fill: #ef4444;
        }

        /* 闪烁动画提示 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <div class="header">
        <div class="title">
            <span class="title-badge">数学 · 六年级</span>
            双部门纳税额大比拼
        </div>
        <div class="question-prompt" id="prompt-text">
            思考：营业额高的分公司，纳税额就一定多吗？点击下方步骤开始探索！
        </div>
    </div>

    <!-- 可视化主体 -->
    <div class="visualization-area">
        <svg id="viz" viewBox="0 0 800 500">
            <!-- 渐变定义 -->
            <defs>
                <linearGradient id="grad-jia" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ff974d" />
                    <stop offset="100%" stop-color="#f97316" />
                </linearGradient>
                <linearGradient id="grad-yi" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#38bdf8" />
                    <stop offset="100%" stop-color="#0284c7" />
                </linearGradient>
                <!-- 箭头定义 -->
                <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#ef4444" />
                </marker>
                <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
                </marker>
            </defs>

            <!-- 背景参考网格线 -->
            <g id="grid" stroke="#e2e8f0" stroke-width="1">
                <line x1="80" y1="280" x2="720" y2="280" />
                <line x1="80" y1="220" x2="720" y2="220" stroke-dasharray="4 4" />
                <line x1="80" y1="160" x2="720" y2="160" stroke-dasharray="4 4" />
                <line x1="80" y1="100" x2="720" y2="100" stroke-dasharray="4 4" />
                <line x1="80" y1="40" x2="720" y2="40" stroke-dasharray="4 4" />
            </g>

            <!-- 网格刻度标签 -->
            <g fill="#94a3b8" font-size="12" text-anchor="end" font-weight="600">
                <text x="70" y="284">0</text>
                <text x="70" y="224">20万</text>
                <text x="70" y="164">40万</text>
                <text x="70" y="104">60万</text>
                <text x="70" y="44">80万</text>
                <text x="65" y="20" text-anchor="start" font-size="11">营业额</text>
            </g>

            <!-- 甲分公司 (左侧) -->
            <g id="group-jia">
                <!-- 营业额柱状图背景虚线框 -->
                <rect x="140" y="130" width="120" height="150" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="2" stroke-dasharray="4 4" />
                <!-- 营业额柱状图 (动态高度) -->
                <rect id="jia-rev-bar" x="140" y="280" width="120" height="0" rx="8" fill="var(--jia-light)" stroke="var(--jia-border)" stroke-width="2" style="transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);" />
                
                <!-- 文本标注 -->
                <text x="200" y="315" class="label-title" text-anchor="middle">甲分公司</text>
                <text id="jia-rev-text" x="200" y="340" class="label-sub" text-anchor="middle" opacity="0" style="transition: opacity 0.5s;">营业额: 50 万元</text>
                <text id="jia-rate-text" x="200" y="365" class="label-rate jia-color" text-anchor="middle" opacity="0" style="transition: opacity 0.5s;">税率: 5%</text>
            </g>

            <!-- 乙分公司 (右侧) -->
            <g id="group-yi">
                <!-- 营业额柱状图背景虚线框 -->
                <rect x="540" y="40" width="120" height="240" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" stroke-dasharray="4 4" />
                <!-- 营业额柱状图 (动态高度) -->
                <rect id="yi-rev-bar" x="540" y="280" width="120" height="0" rx="8" fill="var(--yi-light)" stroke="var(--yi-border)" stroke-width="2" style="transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);" />
                
                <!-- 文本标注 -->
                <text x="600" y="315" class="label-title" text-anchor="middle">乙分公司</text>
                <text id="yi-rev-text" x="600" y="340" class="label-sub" text-anchor="middle" opacity="0" style="transition: opacity 0.5s;">营业额: 80 万元</text>
                <text id="yi-rate-text" x="600" y="365" class="label-rate yi-color" text-anchor="middle" opacity="0" style="transition: opacity 0.5s;">税率: 3%</text>
            </g>

            <!-- 纳税额切片 (用于动画提取) -->
            <!-- 初始位置重合在营业额柱状图顶部 -->
            <!-- 甲: 50万 * 5% = 2.5万。在1万=3px的比例下，50万高150px，5%即7.5px。为便于观察，切片高度设为12px，动画中再拉伸 -->
            <rect id="jia-tax-block" x="140" y="130" width="120" height="12" rx="4" fill="url(#grad-jia)" opacity="0" style="transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);" />
            <rect id="yi-tax-block" x="540" y="40" width="120" height="12" rx="4" fill="url(#grad-yi)" opacity="0" style="transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);" />

            <!-- 计算公式标注 (步骤2显示) -->
            <g id="formulas" opacity="0" style="transition: opacity 0.5s;">
                <rect x="110" y="85" width="180" height="35" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1" />
                <text id="jia-formula" x="200" y="108" class="formula-text jia-color" text-anchor="middle">50 × 5% = 2.5 万元</text>

                <rect x="510" y="2" width="180" height="35" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
                <text id="yi-formula" x="600" y="25" class="formula-text yi-color" text-anchor="middle">80 × 3% = 2.4 万元</text>
            </g>

            <!-- 下方对比区域 (步骤3显示) -->
            <g id="comparison-axis" opacity="0" style="transition: opacity 0.8s ease;">
                <!-- 分割线 -->
                <line x1="80" y1="390" x2="720" y2="390" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 4" />
                
                <!-- 对比坐标轴 -->
                <line x1="200" y1="460" x2="600" y2="460" stroke="#94a3b8" stroke-width="2" />
                
                <!-- 刻度线及标签 (1万元 = 120px 比例放大对比) -->
                <line x1="200" y1="460" x2="200" y2="466" stroke="#94a3b8" stroke-width="2" />
                <text x="200" y="485" class="axis-label" text-anchor="middle">0 万元</text>

                <line x1="320" y1="460" x2="320" y2="466" stroke="#94a3b8" stroke-width="2" />
                <text x="320" y="485" class="axis-label" text-anchor="middle">1.0 万元</text>

                <line x1="440" y1="460" x2="440" y2="466" stroke="#94a3b8" stroke-width="2" />
                <text x="440" y="485" class="axis-label" text-anchor="middle">2.0 万元</text>

                <line x1="560" y1="460" x2="560" y2="466" stroke="#94a3b8" stroke-width="2" />
                <text x="560" y="485" class="axis-label" text-anchor="middle">3.0 万元</text>

                <!-- 部门标签 -->
                <text x="180" y="418" class="compare-bar-label" text-anchor="end">甲分公司 (5%)</text>
                <text x="180" y="448" class="compare-bar-label" text-anchor="end">乙分公司 (3%)</text>
            </g>

            <!-- 差值高亮标注 (步骤3动画后显示) -->
            <g id="difference-highlight" opacity="0" style="transition: opacity 0.6s ease 1.2s;">
                <!-- 乙纳税额末端对齐虚线 (2.4万对应 x = 200 + 2.4 * 120 = 488) -->
                <line x1="488" y1="395" x2="488" y2="460" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" />
                <!-- 甲纳税额末端对齐虚线 (2.5万对应 x = 200 + 2.5 * 120 = 500) -->
                <line x1="500" y1="395" x2="500" y2="460" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" />
                
                <!-- 差值双向箭头 -->
                <path d="M 488 413 L 500 413" stroke="#ef4444" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
                <text x="494" y="392" class="diff-text" text-anchor="middle">多 0.1 万元</text>
            </g>
        </svg>

        <!-- 结论卡片 -->
        <div class="result-card" id="result-card">
            <div class="result-title">
                <span>💡</span> 教学总结与发现
            </div>
            <div class="result-desc">
                虽然乙分公司的营业额（80万）远大于甲分公司（50万），但因为甲分公司的税率（5%）高于乙分公司（3%），最终计算得出：<strong>甲分公司纳税 2.5 万元 &gt; 乙分公司纳税 2.4 万元</strong>。
                <br>
                这说明：<strong>应纳税额不仅取决于税率的高低，还取决于营业额（基数）的大小！</strong>
            </div>
        </div>
    </div>

    <!-- 控制面板 -->
    <div class="control-panel">
        <button class="btn btn-reset" id="btn-reset">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            重置演示
        </button>
        <div class="btn-group">
            <button class="btn btn-primary" id="btn-step1">1. 观察营业额</button>
            <button class="btn btn-primary" id="btn-step2" disabled>2. 引入税率</button>
            <button class="btn btn-primary" id="btn-step3" disabled>3. 提取并对比纳税额</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 获取DOM元素
        const btnStep1 = document.getElementById('btn-step1');
        const btnStep2 = document.getElementById('btn-step2');
        const btnStep3 = document.getElementById('btn-step3');
        const btnReset = document.getElementById('btn-reset');
        const promptText = document.getElementById('prompt-text');
        const resultCard = document.getElementById('result-card');

        // SVG 元素
        const jiaRevBar = document.getElementById('jia-rev-bar');
        const yiRevBar = document.getElementById('yi-rev-bar');
        const jiaRevText = document.getElementById('jia-rev-text');
        const yiRevText = document.getElementById('yi-rev-text');
        const jiaRateText = document.getElementById('jia-rate-text');
        const yiRateText = document.getElementById('yi-rate-text');
        
        const jiaTaxBlock = document.getElementById('jia-tax-block');
        const yiTaxBlock = document.getElementById('yi-tax-block');
        const formulas = document.getElementById('formulas');
        const compAxis = document.getElementById('comparison-axis');
        const diffHighlight = document.getElementById('difference-highlight');

        // 初始状态重置
        function reset() {
            // 恢复营业额柱状图高度为0
            jiaRevBar.setAttribute('y', '280');
            jiaRevBar.setAttribute('height', '0');
            yiRevBar.setAttribute('y', '280');
            yiRevBar.setAttribute('height', '0');

            // 隐藏文本
            jiaRevText.style.opacity = '0';
            yiRevText.style.opacity = '0';
            jiaRateText.style.opacity = '0';
            yiRateText.style.opacity = '0';

            // 重置纳税切片位置与大小 (重合在营业额柱顶部)
            jiaTaxBlock.style.opacity = '0';
            jiaTaxBlock.setAttribute('x', '140');
            jiaTaxBlock.setAttribute('y', '130');
            jiaTaxBlock.setAttribute('width', '120');
            jiaTaxBlock.setAttribute('height', '12');

            yiTaxBlock.style.opacity = '0';
            yiTaxBlock.setAttribute('x', '540');
            yiTaxBlock.setAttribute('y', '40');
            yiTaxBlock.setAttribute('width', '120');
            yiTaxBlock.setAttribute('height', '12');

            // 隐藏公式、对比轴、高亮和结论卡片
            formulas.style.opacity = '0';
            compAxis.style.opacity = '0';
            diffHighlight.style.opacity = '0';
            resultCard.classList.remove('show');

            // 按钮状态
            btnStep1.disabled = false;
            btnStep2.disabled = true;
            btnStep3.disabled = true;
            btnStep1.classList.remove('active-step');
            btnStep2.classList.remove('active-step');
            btnStep3.classList.remove('active-step');

            promptText.textContent = "思考：营业额高的分公司，纳税额就一定多吗？点击下方步骤开始探索！";
        }

        // 步骤1：展示营业额
        btnStep1.addEventListener('click', () => {
            // 升起柱状图
            jiaRevBar.setAttribute('y', '130');
            jiaRevBar.setAttribute('height', '150');
            yiRevBar.setAttribute('y', '40');
            yiRevBar.setAttribute('height', '240');

            // 显示营业额文本
            jiaRevText.style.opacity = '1';
            yiRevText.style.opacity = '1';

            // 按钮状态切换
            btnStep1.classList.add('active-step');
            btnStep2.disabled = false;
            btnStep1.disabled = true;

            promptText.textContent = "观察：乙分公司的营业额（80万）明显大于甲分公司（50万）。接下来我们引入税率...";
        });

        // 步骤2：引入税率
        btnStep2.addEventListener('click', () => {
            // 显示税率文本
            jiaRateText.style.opacity = '1';
            yiRateText.style.opacity = '1';

            // 在柱状图顶部显现纳税额切片
            jiaTaxBlock.style.opacity = '1';
            yiTaxBlock.style.opacity = '1';

            // 显示计算公式
            formulas.style.opacity = '1';

            // 按钮状态切换
            btnStep2.classList.add('active-step');
            btnStep3.disabled = false;
            btnStep2.disabled = true;

            promptText.textContent = "计算：甲分公司按5%纳税，乙分公司按3%纳税。请口算一下，谁交的税多？";
        });

        // 步骤3：提取并对比纳税额
        btnStep3.addEventListener('click', () => {
            // 动画：将纳税切片移动到下方对比区域，并按比例放大
            // 比例尺：1万元 = 120px
            // 甲纳税额 2.5万元 -> 宽度 = 2.5 * 120 = 300px
            jiaTaxBlock.setAttribute('x', '200');
            jiaTaxBlock.setAttribute('y', '402');
            jiaTaxBlock.setAttribute('width', '300');
            jiaTaxBlock.setAttribute('height', '20');

            // 乙纳税额 2.4万元 -> 宽度 = 2.4 * 120 = 288px
            yiTaxBlock.setAttribute('x', '200');
            yiTaxBlock.setAttribute('y', '432');
            yiTaxBlock.setAttribute('width', '288');
            yiTaxBlock.setAttribute('height', '20');

            // 显示对比坐标轴
            compAxis.style.opacity = '1';

            // 显示差值高亮
            diffHighlight.style.opacity = '1';

            // 弹出结论卡片
            resultCard.classList.add('show');

            // 按钮状态切换
            btnStep3.classList.add('active-step');
            btnStep3.disabled = true;

            promptText.textContent = "对比：通过下方放大对比，清晰可见甲分公司的纳税额（2.5万）比乙分公司（2.4万）更多！";
        });

        // 重置
        btnReset.addEventListener('click', reset);

        // 初始化
        reset();
    });
</script>

</body>
</html>
