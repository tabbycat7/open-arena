<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>校园寻路指南</title>
    <style>
        :root {
            --bg: #f0f7f4;
            --primary: #4a7c59;
            --accent: #ffb347;
            --text: #333;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #app {
            width: 80vw;
            height: 60vw;
            max-width: 1024px;
            max-height: 768px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            padding: 20px;
            gap: 20px;
        }
        #sidebar {
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            padding: 15px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            color: #999;
            font-weight: bold;
        }
        .card.active {
            border-style: solid;
            border-color: var(--primary);
            background: #e8f5e9;
            color: var(--primary);
        }
        #map-container {
            flex-grow: 1;
            position: relative;
            background: #fafafa;
            border-radius: 10px;
            overflow: hidden;
        }
        #visitor {
            position: absolute;
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 50%;
            cursor: grab;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            transition: left 0.3s, top 0.3s;
        }
        .point {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ddd;
            border-radius: 50%;
            z-index: 5;
        }
        .label {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <h3>寻路步骤：</h3>
        <div id="step1" class="card">第一步：从校门口出发</div>
        <div id="step2" class="card">第二步：经过操场</div>
        <div id="step3" class="card">第三步：到达图书馆</div>
    </div>
    <div id="map-container" id="map">
        <svg width="100%" height="100%" style="position:absolute; top:0; left:0;">
            <path id="path-line" d="M 50 400 L 200 400 L 200 200 L 400 200" fill="none" stroke="#4a7c59" stroke-width="4" stroke-dasharray="10 5" opacity="0"/>
        </svg>
        <div id="visitor">👤</div>
        <div class="point" style="left:40px; top:390px;"></div><div class="label" style="left:30px; top:420px;">校门口</div>
        <div class="point" style="left:190px; top:390px;"></div><div class="label" style="left:170px; top:420px;">教学楼</div>
        <div class="point" style="left:190px; top:190px;"></div><div class="label" style="left:170px; top:160px;">操场</div>
        <div class="point" style="left:390px; top:190px;"></div><div class="label" style="left:370px; top:160px;">图书馆</div>
    </div>
</div>

<script>
    const visitor = document.getElementById('visitor');
    const pathLine = document.getElementById('path-line');
    const steps = [
        { id: 'step1', pos: { x: 40, y: 390 } },
        { id: 'step2', pos: { x: 190, y: 190 } },
        { id: 'step3', pos: { x: 390, y: 190 } }
    ];

    let currentStep = 0;

    function updateUI(stepIndex) {
        // 更新卡片状态
        document.querySelectorAll('.card').forEach((c, i) => {
            c.classList.toggle('active', i <= stepIndex);
        });
        
        // 更新路径显示
        pathLine.style.opacity = stepIndex > 0 ? '1' : '0';
        
        // 移动小人
        const pos = steps[stepIndex].pos;
        visitor.style.left = pos.x + 'px';
        visitor.style.top = pos.y + 'px';
    }

    // 交互逻辑：点击地图模拟移动
    document.getElementById('map-container').addEventListener('click', (e) => {
        if (currentStep < 2) {
            currentStep++;
            updateUI(currentStep);
        } else {
            currentStep = 0;
            updateUI(0);
        }
    });

    // 初始化
    updateUI(0);
</script>

</body>
</html>
