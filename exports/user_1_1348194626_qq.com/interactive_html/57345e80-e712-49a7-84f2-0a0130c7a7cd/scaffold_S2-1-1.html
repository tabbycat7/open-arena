<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>番茄炒蛋的顺序逻辑</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #fdf6e3;
            font-family: "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }
        #stage {
            width: 80vmin;
            height: 60vmin;
            background: white;
            border: 4px solid #333;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 8px;
            background: #fff;
            transition: all 0.2s;
        }
        button:hover { background: #eee; }
        #msg {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #d33682;
            height: 2em;
        }
        .pan {
            position: absolute;
            bottom: 10%;
            left: 20%;
            width: 60%;
            height: 20%;
            border: 8px solid #555;
            border-top: none;
            border-radius: 0 0 50% 50%;
            background: #eee;
        }
        .ingredient {
            position: absolute;
            transition: all 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="stage">
        <div class="pan"></div>
        <div id="tomato" class="ingredient" style="bottom: 30%; left: 30%; font-size: 50px;">🍅</div>
        <div id="egg" class="ingredient" style="bottom: 30%; left: 50%; font-size: 50px;">🥚</div>
        <div id="smoke" style="position: absolute; bottom: 30%; left: 40%; font-size: 40px; opacity: 0;">💨</div>
        <div id="emoji" style="position: absolute; top: 20%; left: 40%; font-size: 60px; opacity: 0;">😵</div>
    </div>

    <div class="controls">
        <button id="btn-cut">切番茄</button>
        <button id="btn-beat">打鸡蛋</button>
        <button id="btn-cook">下锅炒</button>
    </div>

    <div id="msg"></div>

    <script>
        const tomato = document.getElementById('tomato');
        const egg = document.getElementById('egg');
        const smoke = document.getElementById('smoke');
        const emoji = document.getElementById('emoji');
        const msg = document.getElementById('msg');

        let isCut = false;
        let isBeaten = false;

        document.getElementById('btn-cut').addEventListener('click', () => {
            isCut = true;
            tomato.innerHTML = '🍅🔪';
            msg.innerText = "番茄切好了！";
        });

        document.getElementById('btn-beat').addEventListener('click', () => {
            isBeaten = true;
            egg.innerHTML = '🍳';
            msg.innerText = "鸡蛋打散了！";
        });

        document.getElementById('btn-cook').addEventListener('click', () => {
            if (isCut && isBeaten) {
                tomato.style.bottom = "20%";
                egg.style.bottom = "20%";
                msg.innerText = "太棒了，美味的番茄炒蛋做好了！";
                msg.style.color = "#268bd2";
            } else {
                // 错误逻辑演示
                tomato.style.bottom = "25%";
                egg.style.bottom = "25%";
                smoke.style.opacity = "1";
                emoji.style.opacity = "1";
                msg.innerText = "还没切和打散就炒，这可做不成番茄炒蛋呀！";
                msg.style.color = "#d33682";
                
                // 动画效果
                setTimeout(() => {
                    smoke.style.opacity = "0";
                }, 2000);
            }
        });
    </script>
</body>
</html>
