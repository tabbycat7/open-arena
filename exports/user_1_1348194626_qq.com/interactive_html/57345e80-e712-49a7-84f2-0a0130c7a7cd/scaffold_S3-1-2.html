<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>S3-1-2 机器人指令逻辑</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background: var(--card);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: var(--primary); }
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 2rem 0;
        }
        .box {
            border: 2px solid #e2e8f0;
            padding: 1rem;
            border-radius: 0.5rem;
            min-height: 150px;
        }
        .robot-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #robot-icon {
            width: 60px;
            height: 60px;
            fill: #94a3b8;
            transition: fill 0.3s;
        }
        .controls {
            text-align: center;
            margin-top: 1rem;
        }
        button {
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            margin: 0 0.5rem;
        }
        #robot-status {
            font-weight: bold;
            color: #059669;
            opacity: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>人机指令对比</h2>
    <div class="comparison">
        <div class="box">
            <h3>给妈妈的指令</h3>
            <p>“拿鞋子”</p>
            <small>（妈妈知道你在哪，知道哪双是你的，知道鞋柜在哪）</small>
        </div>
        <div class="box robot-area">
            <h3>给机器人的指令</h3>
            <svg id="robot-icon" viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2v1h2a1 1 0 0 1 1 1v2h1a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1v2a1 1 0 0 1-1 1h-2v1a2 2 0 0 1-4 0v-1H7a1 1 0 0 1-1-1v-2H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h1V5a1 1 0 0 1 1-1h2V4a2 2 0 0 1 2-2zM8 6v2h8V6H8zm0 4v6h8v-6H8z"/></svg>
            <p id="robot-instruction">（等待具体指令...）</p>
            <div id="robot-status">指令明确，可以执行！</div>
        </div>
    </div>

    <div class="controls">
        <button id="btn-vague">就这样挺好</button>
        <button id="btn-clear">再具体点</button>
    </div>
</div>

<script>
    const instructionEl = document.getElementById('robot-instruction');
    const statusEl = document.getElementById('robot-status');
    const iconEl = document.getElementById('robot-icon');
    const btnVague = document.getElementById('btn-vague');
    const btnClear = document.getElementById('btn-clear');

    btnVague.addEventListener('click', () => {
        instructionEl.innerText = "“拿鞋子”";
        statusEl.style.opacity = "1";
        statusEl.innerText = "错误：目标模糊，无法执行！";
        statusEl.style.color = "#dc2626";
        iconEl.style.fill = "#94a3b8";
    });

    btnClear.addEventListener('click', () => {
        instructionEl.innerText = "走到鞋柜前，打开第一层，拿出那双蓝色35码的运动鞋。";
        statusEl.style.opacity = "1";
        statusEl.innerText = "指令明确，可以执行！";
        statusEl.style.color = "#059669";
        iconEl.style.fill = "#22c55e";
    });
</script>

</body>
</html>
