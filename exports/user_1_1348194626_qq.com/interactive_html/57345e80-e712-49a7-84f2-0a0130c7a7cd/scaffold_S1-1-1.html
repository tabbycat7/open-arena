<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>算法本质：寻路任务</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --bg: #f4f7f6;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #container {
            width: 800px;
            height: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h2 { color: #333; margin-bottom: 20px; }
        #canvas-area {
            width: 100%;
            height: 400px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            position: relative;
            background: #fafafa;
        }
        .card {
            position: absolute;
            left: 20px;
            top: 20px;
            width: 200px;
            padding: 15px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }
        .map-node {
            position: absolute;
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-size: 12px;
            text-align: center;
            z-index: 2;
        }
        .map-node:hover { transform: scale(1.1); box-shadow: 0 0 15px var(--primary); }
        #target-node { background: #e67e22; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(230, 126, 34, 0); } 100% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0); } }
        
        #message-box {
            margin-top: 20px;
            padding: 15px 30px;
            background: var(--success);
            color: white;
            border-radius: 50px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

<div id="container">
    <h2>写下步骤，是为了解决什么困难？</h2>
    <div id="canvas-area">
        <div class="card">
            <strong>指路指南：</strong>
            <ol style="padding-left: 20px; font-size: 14px;">
                <li>直走过喷泉</li>
                <li>右转进教学楼</li>
                <li>上三楼左转</li>
            </ol>
        </div>
        
        <div class="map-node" style="left: 100px; top: 250px;">校门口</div>
        <div class="map-node" id="target-node" style="left: 600px; top: 150px;">图书馆</div>
        
        <svg id="path-svg" width="100%" height="100%" style="position: absolute; top:0; left:0; pointer-events: none;">
            <path id="path-line" d="M 130 280 Q 350 250 630 180" stroke="#2ecc71" stroke-width="4" stroke-dasharray="10,10" fill="none" opacity="0" />
        </svg>
    </div>
    <div id="message-box">写下步骤，是为了解决“如何去图书馆”的问题！</div>
</div>

<script>
    const target = document.getElementById('target-node');
    const pathLine = document.getElementById('path-line');
    const messageBox = document.getElementById('message-box');

    target.addEventListener('click', function() {
        // 显示路径
        pathLine.style.opacity = "1";
        
        // 显示提示
        messageBox.style.opacity = "1";
        
        // 视觉反馈
        target.style.animation = "none";
        target.style.backgroundColor = "#27ae60";
    });
</script>

</body>
</html>
