<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <title>算法判定机 - 课堂教学可视化</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #f4f7f6;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #container {
            width: 80vw;
            height: 60vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        h2 { color: #333; margin-bottom: 20px; }
        
        .items-zone { display: flex; gap: 40px; margin-bottom: 40px; }
        .item {
            width: 120px; height: 60px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: grab;
            user-select: none;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        #machine {
            width: 300px; height: 150px;
            border: 4px solid #333;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #eee;
        }
        #light {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #999;
            margin-right: 20px;
        }
        
        #feedback {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #555;
            text-align: center;
            min-height: 3em;
        }
    </style>
</head>
<body>

    <h2>算法判定机：这是算法吗？</h2>
    
    <div class="items-zone">
        <div id="item1" class="item" draggable="true">指路指南</div>
        <div id="item2" class="item" draggable="true">小明日记</div>
    </div>

    <div id="machine">
        <div id="light"></div>
        <div>判定入口</div>
    </div>

    <div id="feedback">请将选项拖入判定入口</div>

    <script>
        const machine = document.getElementById('machine');
        const light = document.getElementById('light');
        const feedback = document.getElementById('feedback');
        const items = document.querySelectorAll('.item');

        items.forEach(item => {
            item.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
            });
        });

        machine.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        machine.addEventListener('drop', (e) => {
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            
            if (id === 'item1') {
                light.style.background = 'var(--success)';
                feedback.style.color = 'var(--success)';
                feedback.innerText = '判定结果：具备指导行动、解决问题的能力 = 合格算法！';
            } else {
                light.style.background = 'var(--danger)';
                feedback.style.color = 'var(--danger)';
                feedback.innerText = '判定结果：仅为日常记录，无法指导行动。';
            }
        });
    </script>
</body>
</html>
