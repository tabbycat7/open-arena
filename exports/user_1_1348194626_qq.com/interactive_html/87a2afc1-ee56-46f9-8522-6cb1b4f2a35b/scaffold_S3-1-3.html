<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人所得税计算微课交互</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --success-color: #10b981;
            --error-color: #ef4444;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --bg-light: #f3f4f6;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 4:3 比例教学投影容器 */
        .classroom-container {
            width: 100vw;
            height: 75vw; /* 4:3 Aspect Ratio */
            max-width: 1000px;
            max-height: 750px;
            background: radial-gradient(circle at top left, #f8fafc, #e2e8f0);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        /* 头部标题区 */
        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .question-tag {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .title {
            font-size: 28px;
            color: var(--text-main);
            font-weight: 700;
            line-height: 1.4;
        }

        /* 核心可视化区域：薪资结构直观图 */
        .visualization-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 16px 0;
        }

        .salary-bar-container {
            width: 80%;
            text-align: center;
            margin-bottom: 24px;
        }

        .bar-title {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* SVG 薪资拆解图 */
        .salary-svg {
            width: 100%;
            height: 100px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        .svg-rect {
            transition: all 0.3s ease;
        }

        .svg-text {
            font-size: 14px;
            font-weight: bold;
            fill: #ffffff;
            text-anchor: middle;
            dominant-baseline: middle;
            transition: all 0.3s ease;
        }

        .svg-label {
            font-size: 14px;
            fill: var(--text-muted);
            text-anchor: middle;
        }

        /* 公式选择区域 */
        .formula-container {
            display: flex;
            justify-content: space-around;
            gap: 32px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .formula-card {
            flex: 1;
            background: var(--card-bg);
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            user-select: none;
        }

        .formula-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.08);
            border-color: var(--primary-color);
        }

        .formula-card .math {
            font-size: 36px;
            font-family: 'Cambria', 'Georgia', serif;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .formula-card .desc {
            font-size: 16px;
            color: var(--text-muted);
        }

        /* 状态样式 */
        .formula-card.incorrect {
            background-color: #f3f4f6;
            border-color: #9ca3af;
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        .formula-card.incorrect .math {
            color: #9ca3af;
            text-decoration: line-through;
        }

        .formula-card.correct {
            background-color: #ecfdf5;
            border-color: var(--success-color);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            transform: scale(1.05);
        }
        .formula-card.correct .math {
            color: var(--success-color);
        }

        /* 反馈提示区 */
        .feedback-panel {
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 12px 24px;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.5);
            border: 1px dashed #cbd5e1;
            margin-top: 16px;
        }

        .feedback-text {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .feedback-text.error {
            color: var(--error-color);
            animation: shake 0.5s ease-in-out;
        }

        .feedback-text.success {
            color: var(--success-color);
            font-size: 22px;
        }

        /* 重置按钮 */
        .reset-btn {
            position: absolute;
            top: 32px;
            right: 32px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .reset-btn:hover {
            background-color: var(--bg-light);
            color: var(--text-main);
        }

        /* 烟花/粒子画布 */
        #effect-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* 动画效果 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* 辅助高亮动画 */
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(59, 130, 246, 0.5)); }
            50% { filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8)); }
        }
        .pulse {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>
<body>

    <div class="classroom-container">
        <button class="reset-btn" id="resetBtn">重置演示</button>
        <canvas id="effect-canvas"></canvas>

        <!-- 头部 -->
        <div class="header">
            <span class="question-tag">思考与抉择</span>
            <h1 class="title">应该用哪个数乘 3%？是总工资 8500，还是超出的 3500？</h1>
        </div>

        <!-- 薪资结构可视化 -->
        <div class="visualization-area">
            <div class="salary-bar-container">
                <div class="bar-title">总工资：8500 元</div>
                <svg class="salary-svg" viewBox="0 0 800 100">
                    <!-- 总背景/辅助线 -->
                    <rect x="0" y="20" width="800" height="40" rx="8" fill="#e2e8f0" />
                    
                    <!-- 免税部分 (5000元) -> 占 500/850 比例 -->
                    <rect id="part-free" class="svg-rect" x="2" y="22" width="468" height="36" rx="6" fill="#94a3b8" />
                    <text id="text-free" class="svg-text" x="236" y="40">免税额度 5000 元</text>
                    
                    <!-- 纳税部分 (3500元) -> 占 350/850 比例 -->
                    <rect id="part-tax" class="svg-rect" x="474" y="22" width="324" height="36" rx="6" fill="#f59e0b" />
                    <text id="text-tax" class="svg-text" x="636" y="40">超出部分 3500 元</text>

                    <!-- 底部大括号辅助标注 -->
                    <path d="M 2,68 L 2,75 L 236,75 L 236,80 L 236,75 L 470,75 L 470,68" fill="none" stroke="#94a3b8" stroke-width="2"/>
                    <text x="236" y="95" class="svg-label">不纳税</text>

                    <path id="tax-bracket" d="M 474,68 L 474,75 L 636,75 L 636,80 L 636,75 L 798,75 L 798,68" fill="none" stroke="#f59e0b" stroke-width="2"/>
                    <text id="tax-bracket-label" x="636" y="95" class="svg-label" fill="#f59e0b" style="font-weight: bold;">按 3% 纳税</text>
                </svg>
            </div>
        </div>

        <!-- 公式选择卡片 -->
        <div class="formula-container">
            <div class="formula-card" id="card-wrong">
                <div class="math">8500 × 3%</div>
                <div class="desc">用“总工资”直接乘税率</div>
            </div>
            <div class="formula-card" id="card-right">
                <div class="math">3500 × 3%</div>
                <div class="desc">用“超出免税额的部分”乘税率</div>
            </div>
        </div>

        <!-- 动态反馈面板 -->
        <div class="feedback-panel">
            <div class="feedback-text" id="feedback-msg">请点击上方公式，选择你认为正确的计算方式。</div>
        </div>
    </div>

    <script>
        const cardWrong = document.getElementById('card-wrong');
        const cardRight = document.getElementById('card-right');
        const feedbackMsg = document.getElementById('feedback-msg');
        const resetBtn = document.getElementById('resetBtn');
        
        const partFree = document.getElementById('part-free');
        const partTax = document.getElementById('part-tax');
        const taxBracket = document.getElementById('tax-bracket');
        const taxBracketLabel = document.getElementById('tax-bracket-label');

        // 烟花画布设置
        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId = null;

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 粒子类
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 6 + 4;
                this.speedX = Math.random() * 10 - 5;
                this.speedY = Math.random() * -12 - 4;
                this.gravity = 0.3;
                this.color = `hsl(${Math.random() * 360}, 90%, 60%)`;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }
            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle(x, y));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            if (particles.length > 0) {
                animationFrameId = requestAnimationFrame(animateParticles);
            }
        }

        // 交互逻辑
        cardWrong.addEventListener('click', () => {
            if (cardWrong.classList.contains('incorrect') || cardRight.classList.contains('correct')) return;

            // 错误反馈
            cardWrong.classList.add('incorrect');
            feedbackMsg.textContent = "不对哦！8500元里有5000元是免税的，免税部分不需要交税！";
            feedbackMsg.className = "feedback-text error";

            // 视觉辅助：高亮免税部分，弱化纳税部分
            partFree.setAttribute('fill', '#ef4444');
            partTax.setAttribute('fill', '#cbd5e1');
        });

        cardRight.addEventListener('click', (e) => {
            if (cardRight.classList.contains('correct')) return;

            // 正确反馈
            cardRight.classList.add('correct');
            cardWrong.classList.add('incorrect');
            feedbackMsg.textContent = "完全正确！只乘需要纳税的 3500 元！";
            feedbackMsg.className = "feedback-text success";

            // 视觉辅助：高亮纳税部分
            partTax.setAttribute('fill', '#10b981');
            partFree.setAttribute('fill', '#94a3b8');
            taxBracket.setAttribute('stroke', '#10b981');
            taxBracketLabel.setAttribute('fill', '#10b981');
            taxBracketLabel.style.fontSize = "18px";

            // 触发烟花
            const rect = cardRight.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            const x = rect.left + rect.width / 2 - canvasRect.left;
            const y = rect.top - canvasRect.top;
            
            cancelAnimationFrame(animationFrameId);
            particles = [];
            createExplosion(x, y);
            createExplosion(x - 100, y + 50);
            createExplosion(x + 100, y + 50);
            animateParticles();
        });

        // 重置
        resetBtn.addEventListener('click', () => {
            cardWrong.classList.remove('incorrect');
            cardRight.classList.remove('correct');
            feedbackMsg.textContent = "请点击上方公式，选择你认为正确的计算方式。";
            feedbackMsg.className = "feedback-text";
            
            // 恢复SVG初始状态
            partFree.setAttribute('fill', '#94a3b8');
            partTax.setAttribute('fill', '#f59e0b');
            taxBracket.setAttribute('stroke', '#f59e0b');
            taxBracketLabel.setAttribute('fill', '#f59e0b');
            taxBracketLabel.style.fontSize = "14px";

            // 清除画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = [];
            cancelAnimationFrame(animationFrameId);
        });
    </script>
</body>
</html>
