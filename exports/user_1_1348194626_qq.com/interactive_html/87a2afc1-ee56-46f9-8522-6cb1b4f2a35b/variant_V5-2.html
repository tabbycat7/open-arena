<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业所得税与国家科技创新可视化教学</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 4:3 宽高比自适应容器 */
        .classroom-container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.1);
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        /* 头部标题 */
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 26px;
            color: #2c3e50;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 15px;
            color: #7f8c8d;
            margin: 0;
        }

        /* 主可视化区域 */
        .visualization-area {
            flex-grow: 1;
            position: relative;
            width: 100%;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* SVG 元素过渡动画 */
        rect, text, g, path {
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 初始状态与纳税状态样式控制 */
        .bar-tax { fill: #3498db; }
        .bar-retained { fill: #3498db; }
        .bar-extra { fill: #3498db; }

        .label-tax, .label-retained, .label-extra {
            opacity: 0;
            pointer-events: none;
        }

        /* 激活纳税状态后的样式 */
        .taxed .normal-tax { fill: #e74c3c; }
        .taxed .hitech-tax { fill: #e74c3c; }
        .taxed .normal-retained { fill: #3498db; }
        .taxed .hitech-retained { fill: #3498db; }

        .taxed .label-tax, .taxed .label-retained {
            opacity: 1;
        }

        /* 10万科研留存资金块的飞行与转化动画 */
        .taxed #hitech-extra-group {
            transform: translate(220px, 110px) scale(0.85);
            opacity: 0;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s ease 0.4s;
        }
        .taxed .bar-extra {
            fill: #f1c40f;
        }
        .taxed .label-extra {
            opacity: 1;
        }

        /* 研发中心内容渐现 */
        .rd-content {
            opacity: 0;
            transform: scale(0.9);
            transform-origin: 640px 230px;
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s;
        }
        .taxed .rd-content {
            opacity: 1;
            transform: scale(1);
        }

        /* 图标呼吸灯效果 */
        @keyframes icon-pulse {
            0% { transform: scale(1.4); filter: drop-shadow(0 2px 4px rgba(241, 196, 15, 0.2)); }
            100% { transform: scale(1.5); filter: drop-shadow(0 8px 16px rgba(241, 196, 15, 0.6)); }
        }
        .taxed .pulse-icon {
            animation: icon-pulse 1.8s infinite alternate 1.8s;
        }

        /* 底部控制与思考区域 */
        .footer-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        /* 核心口号横幅 */
        .slogan-banner {
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slogan {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
            background-color: #e8f8f5;
            padding: 8px 24px;
            border-radius: 30px;
            border: 1px solid #a3e4d7;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.2s;
        }
        .taxed .slogan {
            opacity: 1;
            transform: translateY(0);
        }

        /* 交互按钮 */
        .control-buttons {
            display: flex;
            gap: 16px;
        }
        .btn {
            padding: 10px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background-color: #2ecc71;
            color: white;
        }
        .btn-primary:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(46, 204, 113, 0.3);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
            transform: translateY(-2px);
        }
        .btn:disabled {
            background-color: #d5dbdb;
            color: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 课堂思考引导 */
        .thinking-box {
            width: 100%;
            background-color: #fcf8e3;
            border-left: 5px solid #f1c40f;
            padding: 10px 15px;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .thinking-box p {
            margin: 0;
            font-size: 14px;
            color: #c0392b;
            line-height: 1.5;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="classroom-container" id="viz-container">
    <!-- 头部标题 -->
    <div class="header">
        <h1>企业所得税率与国家科技创新战略</h1>
        <p>对比分析：普通企业（税率 25%） vs 高新技术企业（税率 15%）</p>
    </div>

    <!-- 主可视化画布 -->
    <div class="visualization-area">
        <svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
            <!-- 背景网格线与Y轴刻度 -->
            <g class="grid-lines">
                <line x1="80" y1="60" x2="480" y2="60" stroke="#e0e0e0" stroke-dasharray="4,4"/>
                <line x1="80" y1="135" x2="480" y2="135" stroke="#e0e0e0" stroke-dasharray="4,4"/>
                <line x1="80" y1="210" x2="480" y2="210" stroke="#e0e0e0" stroke-dasharray="4,4"/>
                <line x1="80" y1="285" x2="480" y2="285" stroke="#e0e0e0" stroke-dasharray="4,4"/>
                <line x1="80" y1="360" x2="480" y2="360" stroke="#7f8c8d" stroke-width="2"/>
                
                <text x="70" y="65" font-size="12" fill="#7f8c8d" text-anchor="end">100 万元 (利润)</text>
                <text x="70" y="140" font-size="12" fill="#7f8c8d" text-anchor="end">75 万元</text>
                <text x="70" y="215" font-size="12" fill="#7f8c8d" text-anchor="end">50 万元</text>
                <text x="70" y="290" font-size="12" fill="#7f8c8d" text-anchor="end">25 万元</text>
                <text x="70" y="365" font-size="12" fill="#7f8c8d" text-anchor="end">0 元</text>
            </g>

            <!-- 柱状图 1：普通企业 -->
            <g id="normal-enterprise">
                <!-- 留存利润部分 (75%) -->
                <rect class="bar-retained normal-retained" x="140" y="135" width="100" height="225" rx="6"/>
                <!-- 应纳税部分 (25%) -->
                <rect class="bar-tax normal-tax" x="140" y="60" width="100" height="75" rx="6"/>
                
                <!-- 文本标签 -->
                <text class="label-initial" x="190" y="50" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">年利润 100万</text>
                <text class="label-tax" x="190" y="100" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">所得税 25万</text>
                <text class="label-retained" x="190" y="250" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">留存 75万</text>
                
                <text x="190" y="385" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="middle">普通企业 (税率25%)</text>
            </g>

            <!-- 柱状图 2：高新技术企业 -->
            <g id="hitech-enterprise">
                <!-- 留存利润基础部分 (75%) -->
                <rect class="bar-retained hitech-retained" x="320" y="135" width="100" height="225" rx="6"/>
                <!-- 应纳税部分 (15%) -->
                <rect class="bar-tax hitech-tax" x="320" y="60" width="100" height="45" rx="6"/>
                
                <!-- 减税留存的关键 10% 资金块 (可飞行动画组) -->
                <g id="hitech-extra-group">
                    <rect class="bar-extra" x="320" y="105" width="100" height="30" rx="4"/>
                    <text class="label-extra" x="370" y="124" font-size="12" font-weight="bold" fill="#7f8c8d" text-anchor="middle">科研留存 10万</text>
                </g>

                <!-- 文本标签 -->
                <text class="label-initial" x="370" y="50" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">年利润 100万</text>
                <text class="label-tax" x="370" y="88" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">所得税 15万</text>
                <text class="label-retained" x="370" y="250" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">留存 75万</text>
                
                <text x="370" y="385" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="middle">高新企业 (税率15%)</text>
            </g>

            <!-- 转换指向箭头 -->
            <path class="rd-content" d="M 440 120 Q 490 120 510 150" fill="none" stroke="#f1c40f" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 2 L 10 5 L 0 8 z" fill="#f1c40f"/>
                </marker>
            </defs>

            <!-- 右侧：企业研发中心（减税资金去向） -->
            <g id="rd-center">
                <!-- 研发中心外框 -->
                <rect x="520" y="60" width="240" height="300" rx="12" fill="#fcfcfc" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="6,6"/>
                <text x="640" y="90" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">企业研发中心</text>
                
                <!-- 研发中心内部激活内容 -->
                <g class="rd-content">
                    <!-- 机器人图标 -->
                    <g class="pulse-icon" transform="translate(560, 120) scale(1.4)">
                        <rect x="5" y="10" width="24" height="20" rx="4" fill="none" stroke="#3498db" stroke-width="2"/>
                        <circle cx="12" cy="17" r="1.5" fill="#3498db"/>
                        <circle cx="22" cy="17" r="1.5" fill="#3498db"/>
                        <path d="M 11 23 Q 17 27 23 23" fill="none" stroke="#3498db" stroke-width="1.5"/>
                        <line x1="17" y1="5" x2="17" y2="10" stroke="#3498db" stroke-width="2"/>
                        <circle cx="17" cy="4" r="2" fill="#f1c40f"/>
                    </g>
                    <!-- 专利证书图标 -->
                    <g class="pulse-icon" transform="translate(660, 120) scale(1.4)">
                        <rect x="5" y="5" width="22" height="28" rx="2" fill="none" stroke="#f1c40f" stroke-width="2"/>
                        <line x1="9" y1="12" x2="23" y2="12" stroke="#f1c40f" stroke-width="1.5"/>
                        <line x1="9" y1="18" x2="23" y2="18" stroke="#f1c40f" stroke-width="1.5"/>
                        <line x1="9" y1="24" x2="17" y2="24" stroke="#f1c40f" stroke-width="1.5"/>
                        <circle cx="21" cy="25" r="3" fill="#e74c3c"/>
                    </g>
                    
                    <!-- 资金转化说明 -->
                    <text x="640" y="230" font-size="15" font-weight="bold" fill="#f39c12" text-anchor="middle">释放科研资金：+10 万元</text>
                    <text x="640" y="265" font-size="13" fill="#7f8c8d" text-anchor="middle">用于：研发高新技术产品</text>
                    <text x="640" y="290" font-size="13" fill="#7f8c8d" text-anchor="middle">招募科研人才、申请专利</text>
                    <text x="640" y="330" font-size="14" font-weight="bold" fill="#2ecc71" text-anchor="middle">企业创新活力 ↑ 100%</text>
                </g>
            </g>
        </svg>
    </div>

    <!-- 底部控制与思考引导 -->
    <div class="footer-panel">
        <!-- 核心标语 -->
        <div class="slogan-banner">
            <div class="slogan" id="slogan-text">减税降费，助力中国科技创新！</div>
        </div>

        <!-- 交互按钮 -->
        <div class="control-buttons">
            <button class="btn btn-primary" id="btn-tax">模拟企业纳税</button>
            <button class="btn btn-secondary" id="btn-reset" disabled>重置对比</button>
        </div>

        <!-- 课堂思考问题 -->
        <div class="thinking-box">
            <p>💡 课堂思考：算一算，高新技术企业比普通企业少缴了多少税？这笔省下来的“10万元”对企业和国家的发展有什么深远意义？</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('viz-container');
        const btnTax = document.getElementById('btn-tax');
        const btnReset = document.getElementById('btn-reset');

        // 点击“模拟纳税”
        btnTax.addEventListener('click', () => {
            container.classList.add('taxed');
            btnTax.disabled = true;
            btnReset.disabled = false;
        });

        // 点击“重置对比”
        btnReset.addEventListener('click', () => {
            container.classList.remove('taxed');
            btnTax.disabled = false;
            btnReset.disabled = true;
        });
    });
</script>

</body>
</html>
