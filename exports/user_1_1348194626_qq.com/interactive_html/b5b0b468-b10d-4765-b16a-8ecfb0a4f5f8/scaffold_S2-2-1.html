<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数形结合：函数图象与水平直线的交点</title>
    <style>
        /* 基础样式重置与课堂投屏优化 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 4:3 比例自适应容器 */
        .container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        /* 头部区域 */
        .header {
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px 24px;
            border-bottom: 4px solid #3b82f6;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1::before {
            content: "数学探究";
            font-size: 12px;
            background-color: #3b82f6;
            padding: 4px 8px;
            border-radius: 4px;
            vertical-align: middle;
        }
        .header p {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* 主交互区域 */
        .main-layout {
            flex: 1;
            display: flex;
            position: relative;
            padding: 20px;
            gap: 24px;
            min-height: 0; /* 允许子元素在flex中缩放 */
        }

        /* 左侧画布区域 */
        .canvas-container {
            flex: 1;
            position: relative;
            background-color: #fafafa;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 右侧控制面板 */
        .control-panel {
            width: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #f1f5f9;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e2e8f0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            width: 100%;
        }

        .control-title {
            font-size: 16px;
            font-weight: 600;
            color: #334155;
            text-align: center;
            width: 100%;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 8px;
        }

        /* 垂直滑块容器 */
        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            height: 220px;
            position: relative;
            width: 100%;
        }

        /* 垂直滑块样式 */
        .vertical-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 8px;
            height: 180px;
            background: #cbd5e1;
            outline: none;
            border-radius: 4px;
            /* 旋转为垂直方向 */
            writing-mode: bt-lr; /* IE */
            -webkit-appearance: slider-vertical; /* Webkit */
        }

        .vertical-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            border: 3px solid #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .vertical-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .value-display {
            font-size: 20px;
            font-weight: bold;
            color: #2563eb;
            font-family: "Courier New", Courier, monospace;
            background: #ffffff;
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            min-width: 80px;
            text-align: center;
        }

        /* 快捷定位按钮 */
        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .btn {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 500;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            color: #475569;
        }

        .btn:hover {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        .btn.active {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }

        /* 底部说明区域 */
        .footer-info {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            color: #1e3a8a;
            line-height: 1.6;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-info::before {
            content: "💡";
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <div class="header">
        <h1>方程的根与函数交点</h1>
        <p>思考：方程左边的“槽谷”折线已画出。右边的常数 a 对应的函数 y = a 是一条怎样的直线？当 a 变化时，它如何运动？</p>
    </div>

    <!-- 主交互区 -->
    <div class="main-layout">
        <!-- 左侧坐标系 -->
        <div class="canvas-container" id="canvasContainer">
            <canvas id="mathCanvas"></canvas>
        </div>

        <!-- 右侧控制面板 -->
        <div class="control-panel">
            <div class="control-group">
                <div class="control-title">调节参数 a</div>
                <div class="slider-container">
                    <input type="range" id="aSlider" class="vertical-slider" min="-2" max="6" step="0.1" value="2">
                    <div class="value-display" id="aValue">a = 2.0</div>
                </div>
            </div>

            <div class="control-group">
                <div class="control-title">快速定位</div>
                <div class="preset-buttons">
                    <button class="btn" data-val="4.0">a = 4.0</button>
                    <button class="btn" data-val="2.0">a = 2.0</button>
                    <button class="btn" data-val="1.0">a = 1.0</button>
                    <button class="btn" data-val="-0.5">a = -0.5</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部动态提示 -->
    <div style="padding: 0 20px 20px 20px;">
        <div class="footer-info" id="dynamicTip">
            y = a 是一条可以上下移动的水平直线。请拖动右侧滑块观察它与“槽谷”折线的交点变化。
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mathCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');
    const aSlider = document.getElementById('aSlider');
    const aValue = document.getElementById('aValue');
    const dynamicTip = document.getElementById('dynamicTip');
    const presetButtons = document.querySelectorAll('.preset-buttons .btn');

    // 状态变量
    let state = {
        a: 2.0,
        // 坐标系物理范围
        minX: -5,
        maxX: 5,
        minY: -3,
        maxY: 7
    };

    // 槽谷折线顶点数据 (例如：y = |x-1| + |x+1| - 1)
    const valleyPoints = [
        {x: -5, y: 7},
        {x: -2, y: 1},
        {x: 2, y: 1},
        {x: 5, y: 7}
    ];

    // 初始化画布大小
    function resizeCanvas() {
        const rect = container.getBoundingClientRect();
        // 考虑高分屏缩放
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        draw();
    }

    // 坐标转换：数学坐标 -> 屏幕像素坐标
    function toScreen(mathX, mathY, width, height) {
        const px = ((mathX - state.minX) / (state.maxX - state.minX)) * width;
        const py = height - ((mathY - state.minY) / (state.maxY - state.minY)) * height;
        return { x: px, y: py };
    }

    // 绘制主函数
    function draw() {
        const width = canvas.width / (window.devicePixelRatio || 1);
        const height = canvas.height / (window.devicePixelRatio || 1);

        // 清空画布
        ctx.clearRect(0, 0, width, height);

        // 1. 绘制背景网格
        ctx.strokeStyle = '#f1f5f9';
        ctx.lineWidth = 1;
        for (let x = state.minX; x <= state.maxX; x++) {
            const pt1 = toScreen(x, state.minY, width, height);
            const pt2 = toScreen(x, state.maxY, width, height);
            ctx.beginPath();
            ctx.moveTo(pt1.x, 0);
            ctx.lineTo(pt1.x, height);
            ctx.stroke();
        }
        for (let y = state.minY; y <= state.maxY; y++) {
            const pt1 = toScreen(state.minX, y, width, height);
            const pt2 = toScreen(state.maxX, y, width, height);
            ctx.beginPath();
            ctx.moveTo(0, pt1.y);
            ctx.lineTo(width, pt1.y);
            ctx.stroke();
        }

        // 2. 绘制坐标轴
        const origin = toScreen(0, 0, width, height);
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2;
        
        // X 轴
        ctx.beginPath();
        ctx.moveTo(0, origin.y);
        ctx.lineTo(width, origin.y);
        ctx.stroke();
        // Y 轴
        ctx.beginPath();
        ctx.moveTo(origin.x, 0);
        ctx.lineTo(origin.x, height);
        ctx.stroke();

        // 轴箭头与标签
        ctx.fillStyle = '#64748b';
        ctx.font = '14px sans-serif';
        ctx.fillText('x', width - 15, origin.y - 8);
        ctx.fillText('y', origin.x + 8, 15);
        ctx.fillText('O', origin.x - 15, origin.y + 18);

        // 刻度值
        ctx.font = '11px sans-serif';
        for (let x = state.minX; x <= state.maxX; x++) {
            if (x === 0) continue;
            const pt = toScreen(x, 0, width, height);
            ctx.fillText(x.toString(), pt.x - 4, origin.y + 15);
        }
        for (let y = state.minY; y <= state.maxY; y++) {
            if (y === 0) continue;
            const pt = toScreen(0, y, width, height);
            ctx.fillText(y.toString(), origin.x - 18, pt.y + 4);
        }

        // 3. 绘制“槽谷”折线 (y = f(x))
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        const startPt = toScreen(valleyPoints[0].x, valleyPoints[0].y, width, height);
        ctx.moveTo(startPt.x, startPt.y);
        for (let i = 1; i < valleyPoints.length; i++) {
            const pt = toScreen(valleyPoints[i].x, valleyPoints[i].y, width, height);
            ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();

        // 标注折线
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 14px sans-serif';
        const labelPt = toScreen(3.5, 4.5, width, height);
        ctx.fillText('y = f(x)', labelPt.x, labelPt.y);

        // 4. 绘制动态水平直线 y = a
        const linePt1 = toScreen(state.minX, state.a, width, height);
        const linePt2 = toScreen(state.maxX, state.a, width, height);
        
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 4]); // 虚线样式增加动态感
        ctx.beginPath();
        ctx.moveTo(0, linePt1.y);
        ctx.lineTo(width, linePt2.y);
        ctx.stroke();
        ctx.setLineDash([]); // 恢复实线

        // 标注水平直线
        ctx.fillStyle = '#2563eb';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(`y = a (a = ${state.a.toFixed(1)})`, 20, linePt1.y - 10);

        // 5. 计算并绘制交点 (不直接给出个数结论，只做视觉呈现引导学生观察)
        ctx.fillStyle = '#0f172a';
        const intersections = getIntersections(state.a);
        intersections.forEach(pt => {
            const screenPt = toScreen(pt.x, pt.y, width, height);
            ctx.beginPath();
            ctx.arc(screenPt.x, screenPt.y, 6, 0, 2 * Math.PI);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        });
    }

    // 简单的线段交点计算 (针对本题特定的槽谷折线)
    function getIntersections(a) {
        const pts = [];
        // 槽谷由三条线段构成：
        // 1. (-5, 7) 到 (-2, 1) -> y = -2x - 3  (x ∈ [-5, -2])
        // 2. (-2, 1) 到 (2, 1)  -> y = 1       (x ∈ [-2, 2])
        // 3. (2, 1) 到 (5, 7)   -> y = 2x - 3   (x ∈ [2, 5])
        
        // 第一段
        if (a >= 1 && a <= 7) {
            const x1 = (a + 3) / -2;
            if (x1 >= -5 && x1 < -2) pts.push({x: x1, y: a});
        }
        // 第二段 (重合情况不单独标极多点，只在恰好等于1时做视觉提示)
        if (Math.abs(a - 1) < 0.01) {
            pts.push({x: -2, y: 1});
            pts.push({x: 2, y: 1});
        }
        // 第三段
        if (a >= 1 && a <= 7) {
            const x3 = (a + 3) / 2;
            if (x3 > 2 && x3 <= 5) pts.push({x: x3, y: a});
        }
        return pts;
    }

    // 更新状态与UI
    function updateA(val) {
        state.a = parseFloat(val);
        aSlider.value = state.a;
        aValue.textContent = `a = ${state.a.toFixed(1)}`;
        
        // 动态更新底部提示，引导学生思考
        if (state.a > 1) {
            dynamicTip.textContent = `当前 a = ${state.a.toFixed(1)}，水平直线 y = a 与“槽谷”折线有 2 个交点。`;
        } else if (Math.abs(state.a - 1) < 0.1) {
            dynamicTip.textContent = `当前 a = 1.0，水平直线刚好贴住“槽谷”的底部，此时交点情况如何？`;
        } else {
            dynamicTip.textContent = `当前 a = ${state.a.toFixed(1)}，水平直线在“槽谷”下方，此时它们有交点吗？`;
        }

        // 更新按钮高亮
        presetButtons.forEach(btn => {
            if (Math.abs(parseFloat(btn.dataset.val) - state.a) < 0.05) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        draw();
    }

    // 事件监听
    aSlider.addEventListener('input', (e) => {
        updateA(e.target.value);
    });

    presetButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            updateA(btn.dataset.val);
        });
    });

    // 响应式视口
    window.addEventListener('resize', resizeCanvas);

    // 初始化
    resizeCanvas();
    updateA(2.0);
</script>

</body>
</html>
