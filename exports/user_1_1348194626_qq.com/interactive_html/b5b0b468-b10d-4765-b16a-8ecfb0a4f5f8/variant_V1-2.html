<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加权绝对值几何意义探索</title>
    <style>
        /* 基础样式，适配 4:3 比例投屏 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 800px;
            height: 600px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            position: relative;
        }
        /* 头部信息 */
        .header {
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
        }
        .tag {
            display: inline-block;
            background-color: #3182ce;
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .title {
            font-size: 22px;
            color: #2d3748;
            line-height: 1.5;
        }
        .highlight {
            color: #e53e3e;
            font-weight: bold;
        }

        /* 可视化区域 */
        .visualization {
            flex-grow: 1;
            position: relative;
            margin: 20px 0;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: 100%;
            user-select: none;
        }

        /* 控制面板 */
        .control-panel {
            background-color: #edf2f7;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .slider-label {
            font-size: 16px;
            font-weight: bold;
            color: #4a5568;
            width: 80px;
        }
        .range-slider {
            flex-grow: 1;
            height: 8px;
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
            background: #cbd5e0;
            cursor: pointer;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3182ce;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 预设按钮 */
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 6px 16px;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            background-color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            color: #4a5568;
        }
        .btn:hover {
            background-color: #ebf8ff;
            border-color: #3182ce;
            color: #3182ce;
        }

        /* 动态数值显示 */
        .formula-display {
            font-family: "Courier New", Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            color: #2d3748;
            padding: 5px;
            background: #fff;
            border-radius: 6px;
            border: 1px dashed #cbd5e0;
        }

        /* 提示说明 */
        .footer-tips {
            font-size: 14px;
            color: #718096;
            text-align: center;
            line-height: 1.4;
        }

        /* 拖拽点样式 */
        .draggable-point {
            cursor: grab;
        }
        .draggable-point:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <div class="header">
        <span class="tag">数学 · 高一</span>
        <h1 class="title">
            探索非对称绝对值之和：<span class="highlight">2|x - 1| + |x + 1|</span> 的几何意义
        </h1>
    </div>

    <!-- 动态公式显示 -->
    <div class="formula-display" id="formulaText">
        y = 2|x - 1| + |x + 1| = 2 × 0.00 + 0.00 = 0.00
    </div>

    <!-- SVG 可视化区域 -->
    <div class="visualization">
        <svg id="svgCanvas" viewBox="0 0 740 280">
            <!-- 坐标轴网格线 -->
            <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5">
                <line x1="70" y1="40" x2="70" y2="220" />
                <line x1="170" y1="40" x2="170" y2="220" />
                <line x1="270" y1="40" x2="270" y2="220" />
                <line x1="370" y1="40" x2="370" y2="220" />
                <line x1="470" y1="40" x2="470" y2="220" />
                <line x1="570" y1="40" x2="570" y2="220" />
                <line x1="670" y1="40" x2="670" y2="220" />
            </g>

            <!-- 数轴主线 -->
            <line x1="40" y1="180" x2="700" y2="180" stroke="#4a5568" stroke-width="3" marker-end="url(#arrow)" />
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a5568" />
                </marker>
            </defs>

            <!-- 刻度与标注 -->
            <!-- A(-1) -->
            <line x1="270" y1="173" x2="270" y2="187" stroke="#4a5568" stroke-width="2" />
            <text x="270" y="210" font-size="16" font-weight="bold" text-anchor="middle" fill="#2d3748">A (-1)</text>
            
            <!-- 原点(0) -->
            <line x1="370" y1="175" x2="370" y2="185" stroke="#a0aec0" stroke-width="1.5" />
            <text x="370" y="205" font-size="14" text-anchor="middle" fill="#a0aec0">0</text>

            <!-- B(1) -->
            <line x1="470" y1="173" x2="470" y2="187" stroke="#4a5568" stroke-width="2" />
            <text x="470" y="210" font-size="16" font-weight="bold" text-anchor="middle" fill="#2d3748">B (1)</text>

            <!-- 距离线段 A 到 x (绿色，单线) -->
            <path id="lineAX" d="" stroke="#48bb78" stroke-width="4" fill="none" stroke-linecap="round" />
            <text id="labelAX" x="0" y="0" font-size="14" font-weight="bold" fill="#2f855a" text-anchor="middle"></text>

            <!-- 距离线段 B 到 x (红色，双线/加粗表示2倍权重) -->
            <path id="lineBX_outer" d="" stroke="#f56565" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.4" />
            <path id="lineBX_inner" d="" stroke="#e53e3e" stroke-width="3" fill="none" stroke-linecap="round" />
            <text id="labelBX" x="0" y="0" font-size="14" font-weight="bold" fill="#c53030" text-anchor="middle"></text>

            <!-- 动点 x 的投影虚线 -->
            <line id="projLine" x1="0" y1="180" x2="0" y2="100" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4,4" />

            <!-- 动点 x 及其手柄 -->
            <g id="pointX" class="draggable-point">
                <circle cx="0" cy="180" r="10" fill="#3182ce" stroke="#fff" stroke-width="2.5" />
                <circle cx="0" cy="180" r="18" fill="#3182ce" opacity="0.15" />
                <text y="155" font-size="18" font-weight="bold" fill="#2b6cb0" text-anchor="middle">x</text>
            </g>

            <!-- 临界点/最值达成金色奖杯 -->
            <g id="trophy" transform="translate(470, 65)" style="display: none;">
                <circle cx="0" cy="0" r="22" fill="#f6e05e" opacity="0.2" />
                <!-- 奖杯简易图标 -->
                <path d="M -8 -12 L 8 -12 L 8 -4 C 8 2 4 6 0 6 C -4 6 -8 2 -8 -4 Z" fill="#ecc94b" stroke="#d69e2e" stroke-width="1.5"/>
                <path d="M -2 6 L 2 6 L 2 11 L -2 11 Z" fill="#d69e2e"/>
                <path d="M -6 11 L 6 11 L 8 14 L -8 14 Z" fill="#b7791f"/>
                <path d="M -8 -9 C -12 -9 -12 -5 -8 -3" fill="none" stroke="#d69e2e" stroke-width="1.5"/>
                <path d="M 8 -9 C 12 -9 12 -5 8 -3" fill="none" stroke="#d69e2e" stroke-width="1.5"/>
                <text x="0" y="-18" font-size="12" font-weight="bold" fill="#b7791f" text-anchor="middle">最小值点！</text>
            </g>
        </svg>
    </div>

    <!-- 控制面板 -->
    <div class="control-panel">
        <div class="slider-container">
            <span class="slider-label">拖动点 x:</span>
            <input type="range" id="xSlider" class="range-slider" min="-3" max="3" step="0.01" value="-1.8">
            <span id="sliderVal" style="font-size: 18px; font-weight: bold; width: 50px; color: #3182ce;">-1.80</span>
        </div>
        <div class="btn-group">
            <button class="btn" id="btnA">定位到 A (-1)</button>
            <button class="btn" id="btnO">定位到原点 (0)</button>
            <button class="btn" id="btnB">定位到 B (1)</button>
        </div>
    </div>

    <!-- 引导思考 -->
    <div class="footer-tips">
        💡 观察：绿色线段表示 <span style="color:#48bb78;font-weight:bold;">|x + 1|</span>，红色粗线表示双倍权重的 <span style="color:#e53e3e;font-weight:bold;">2|x - 1|</span>。<br>
        试着把 x 拖到不同的区间，看看两段距离的“加权和”在什么时候能拿到最小值？
    </div>
</div>

<script>
    // 获取DOM元素
    const xSlider = document.getElementById('xSlider');
    const sliderVal = document.getElementById('sliderVal');
    const formulaText = document.getElementById('formulaText');
    const pointX = document.getElementById('pointX');
    const projLine = document.getElementById('projLine');
    const lineAX = document.getElementById('lineAX');
    const lineBX_outer = document.getElementById('lineBX_outer');
    const lineBX_inner = document.getElementById('lineBX_inner');
    const labelAX = document.getElementById('labelAX');
    const labelBX = document.getElementById('labelBX');
    const trophy = document.getElementById('trophy');
    const svgCanvas = document.getElementById('svgCanvas');

    const btnA = document.getElementById('btnA');
    const btnO = document.getElementById('btnO');
    const btnB = document.getElementById('btnB');

    // 数轴物理映射参数
    // 0 对应 370px, 每个单位长度 100px
    const originX = 370;
    const unitPx = 100;

    function mathToPx(x) {
        return originX + x * unitPx;
    }

    function pxToMath(px) {
        return (px - originX) / unitPx;
    }

    // 更新视图
    function update(x) {
        // 限制范围
        if (x < -3.2) x = -3.2;
        if (x > 3.2) x = 3.2;

        // 计算几何距离
        const distA = Math.abs(x - (-1));
        const distB = Math.abs(x - 1);
        const weightedSum = 2 * distB + distA;

        // 更新滑块和文本
        xSlider.value = x.toFixed(2);
        sliderVal.textContent = x.toFixed(2);

        // 更新公式文本
        formulaText.innerHTML = `y = 2|x - 1| + |x + 1| = 2 × <span style="color:#e53e3e">${distB.toFixed(2)}</span> + <span style="color:#48bb78">${distA.toFixed(2)}</span> = <span style="color:#3182ce; font-size:22px;">${weightedSum.toFixed(2)}</span>`;

        // 动点 x 的像素坐标
        const pxX = mathToPx(x);
        const pxA = mathToPx(-1);
        const pxB = mathToPx(1);

        // 更新动点位置
        pointX.setAttribute('transform', `translate(${pxX}, 0)`);
        pointX.querySelector('text').setAttribute('x', pxX);

        // 更新投影虚线
        projLine.setAttribute('x1', pxX);
        projLine.setAttribute('x2', pxX);

        // 绘制 A 到 x 的绿色线段 (高度 y=120 避免重叠)
        const yAX = 130;
        lineAX.setAttribute('d', `M ${pxA} ${yAX} L ${pxX} ${yAX}`);
        labelAX.setAttribute('x', (pxA + pxX) / 2);
        labelAX.setAttribute('y', yAX - 10);
        labelAX.textContent = `|x+1|=${distA.toFixed(2)}`;

        // 绘制 B 到 x 的红色双线 (高度 y=100)
        const yBX = 100;
        lineBX_outer.setAttribute('d', `M ${pxB} ${yBX} L ${pxX} ${yBX}`);
        lineBX_inner.setAttribute('d', `M ${pxB} ${yBX} L ${pxX} ${yBX}`);
        labelBX.setAttribute('x', (pxB + pxX) / 2);
        labelBX.setAttribute('y', yBX - 12);
        labelBX.textContent = `2|x-1|=${(2 * distB).toFixed(2)}`;

        // 触发最值彩蛋 (当且仅当 x 非常接近 1 时)
        if (Math.abs(x - 1) < 0.02) {
            trophy.style.display = 'block';
            // 强行吸附到 1
            if (Math.abs(x - 1) > 0) {
                xSlider.value = 1;
                sliderVal.textContent = "1.00";
            }
        } else {
            trophy.style.display = 'none';
        }
    }

    // 滑块事件监听
    xSlider.addEventListener('input', (e) => {
        update(parseFloat(e.target.value));
    });

    // 按钮事件监听
    btnA.addEventListener('click', () => update(-1));
    btnO.addEventListener('click', () => update(0));
    btnB.addEventListener('click', () => update(1));

    // SVG 拖拽交互实现
    let isDragging = false;

    pointX.addEventListener('mousedown', (e) => {
        isDragging = true;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        // 获取 SVG 容器的边界
        const rect = svgCanvas.getBoundingClientRect();
        // 计算鼠标在 SVG 内部的相对 X 坐标
        const mouseXInSvg = (e.clientX - rect.left) * (740 / rect.width);
        
        // 转换为数学坐标并更新
        const mathX = pxToMath(mouseXInSvg);
        update(mathX);
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    // 移动端触摸支持
    pointX.addEventListener('touchstart', (e) => {
        isDragging = true;
        e.preventDefault();
    });

    window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const rect = svgCanvas.getBoundingClientRect();
        const touch = e.touches[0];
        const mouseXInSvg = (touch.clientX - rect.left) * (740 / rect.width);
        const mathX = pxToMath(mouseXInSvg);
        update(mathX);
    });

    window.addEventListener('touchend', () => {
        isDragging = false;
    });

    // 初始化状态
    update(-1.8);
</script>

</body>
</html>
