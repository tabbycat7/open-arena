<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百分数的认识 - 百格图交互微课</title>
  <style>
    :root {
      --primary-color: #0284c7;
      --primary-hover: #0369a1;
      --accent-color: #f59e0b;
      --accent-hover: #d97706;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --grid-border: #e2e8f0;
      --grid-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    /* 4:3 比例自适应容器 */
    .app-container {
      width: 960px;
      height: 720px;
      background-color: var(--bg-color);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 24px;
      position: relative;
    }

    header {
      margin-bottom: 20px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .main-layout {
      display: flex;
      flex: 1;
      gap: 24px;
      height: calc(100% - 80px);
    }

    /* 左侧：百格图区域 */
    .visual-section {
      flex: 1.2;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .grid-wrapper {
      width: 380px;
      height: 380px;
      background: var(--grid-bg);
      border: 4px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 3px;
      position: relative;
    }

    .cell {
      background-color: #ffffff;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    /* 激活状态：代表税收/填充 */
    .cell.active {
      background-color: var(--accent-color);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
    }

    /* 悬停预览状态 */
    .cell.preview {
      background-color: #fde68a;
    }

    .grid-legend {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid #cbd5e1;
    }

    /* 右侧：控制与公式区域 */
    .control-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      padding: 18px;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 按钮组 */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      flex: 1;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-accent {
      background-color: var(--accent-color);
      color: white;
    }

    .btn-accent:hover {
      background-color: var(--accent-hover);
    }

    .btn-outline {
      background-color: #f1f5f9;
      color: var(--text-main);
      border: 1px solid #cbd5e1;
    }

    .btn-outline:hover {
      background-color: #e2e8f0;
    }

    /* 滑块 */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .slider-container label {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }

    .range-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #cbd5e1;
      border-radius: 3px;
      outline: none;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary-color);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* 数学公式展示区 */
    .formula-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
      border: 1px solid #bbf7d0;
    }

    .formula-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 24px;
      font-weight: bold;
      color: #065f46;
      width: 100%;
    }

    .fraction {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      padding: 0 4px;
    }

    .numerator {
      border-bottom: 3px solid #065f46;
      padding: 2px 8px;
      text-align: center;
      min-width: 50px;
    }

    .denominator {
      padding: 2px 8px;
      text-align: center;
      min-width: 50px;
    }

    .equals {
      font-size: 28px;
    }

    .percentage-display {
      font-size: 42px;
      color: var(--accent-color);
      font-weight: 800;
      text-shadow: 1px 1px 0px rgba(0,0,0,0.05);
      min-width: 120px;
      text-align: center;
    }

    /* 动态提示卡片 */
    .info-card {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      font-size: 14px;
      line-height: 1.6;
    }

    .highlight-text {
      color: var(--accent-hover);
      font-weight: bold;
    }

    /* 课堂互动引导 */
    .guide-box {
      margin-top: auto;
      background: #fffbeb;
      border: 1px solid #fef3c7;
      border-left: 4px solid var(--accent-color);
      padding: 12px;
      border-radius: 4px 8px 8px 4px;
      font-size: 13px;
      color: #92400e;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>📊 百分数的认识：百格图模型</h1>
      <div class="subtitle">通过具体的百元模型，将抽象的税率转化为具体的比例感知</div>
    </header>

    <div class="main-layout">
      <!-- 左侧：百格图 -->
      <div class="visual-section">
        <div class="grid-wrapper" id="grid-container">
          <!-- 100个格子由JS动态生成 -->
        </div>
        <div class="grid-legend">
          <div class="legend-item">
            <div class="legend-color" style="background-color: var(--accent-color);"></div>
            <span>已填充（表示交税金额）</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background-color: #ffffff;"></div>
            <span>未填充（表示剩余收入）</span>
          </div>
        </div>
      </div>

      <!-- 右侧：控制面板与公式 -->
      <div class="control-section">
        <!-- 交互控制 -->
        <div class="card">
          <div class="card-title">🎯 课堂互动操作</div>
          <div class="btn-group">
            <button class="btn btn-accent" id="btn-tax">设为 10% (税率)</button>
            <button class="btn btn-outline" id="btn-reset">清空</button>
            <button class="btn btn-outline" id="btn-random">随机生成</button>
          </div>
          <div class="slider-container">
            <label for="grid-slider">填充数量:</label>
            <input type="range" id="grid-slider" class="range-slider" min="0" max="100" value="10">
            <span id="slider-val" style="font-weight: bold; width: 30px; text-align: right;">10</span>
          </div>
        </div>

        <!-- 动态公式展示 -->
        <div class="card formula-card">
          <div class="formula-container">
            <div class="fraction">
              <span class="numerator" id="formula-num">10</span>
              <span class="denominator">100</span>
            </div>
            <span class="equals">=</span>
            <span class="percentage-display" id="formula-percent">10%</span>
          </div>
        </div>

        <!-- 动态情境解析 -->
        <div class="card info-card" id="info-text">
          如果国家规定“每100元收入要交10元税”，这10元占100元的 <span class="highlight-text">10/100</span>，也就是 <span class="highlight-text">10%</span>。
        </div>

        <!-- 教学引导 -->
        <div class="guide-box">
          <strong>💡 教学思考：</strong><br>
          1. 拖动滑块或直接点击左侧百格图，观察分数与百分数是如何对应的。<br>
          2. 想一想：百分数表示的是两个数量之间的什么关系？它的分母固定是多少？
        </div>
      </div>
    </div>
  </div>

  <script>
    const gridContainer = document.getElementById('grid-container');
    const slider = document.getElementById('grid-slider');
    const sliderVal = document.getElementById('slider-val');
    const formulaNum = document.getElementById('formula-num');
    const formulaPercent = document.getElementById('formula-percent');
    const infoText = document.getElementById('info-text');

    const btnTax = document.getElementById('btn-tax');
    const btnReset = document.getElementById('btn-reset');
    const btnRandom = document.getElementById('btn-random');

    let currentCount = 10; // 默认10%

    // 初始化生成100个格子
    function createGrid() {
      gridContainer.innerHTML = '';
      for (let i = 0; i < 100; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.dataset.index = i;
        
        // 点击格子直接设置填充数量
        cell.addEventListener('click', () => {
          updateState(i + 1);
        });

        // 鼠标悬停预览效果
        cell.addEventListener('mouseenter', () => {
          previewState(i + 1);
        });

        gridContainer.appendChild(cell);
      }
      
      // 鼠标移出网格恢复当前实际状态
      gridContainer.addEventListener('mouseleave', () => {
        renderGrid(currentCount);
      });
    }

    // 更新全局状态
    function updateState(count) {
      currentCount = count;
      slider.value = count;
      sliderVal.textContent = count;
      renderGrid(count);
      updateFormula(count);
    }

    // 仅渲染网格视觉（用于悬停预览）
    function renderGrid(count) {
      const cells = gridContainer.querySelectorAll('.cell');
      cells.forEach((cell, idx) => {
        cell.classList.remove('preview');
        if (idx < count) {
          cell.classList.add('active');
        } else {
          cell.classList.remove('active');
        }
      });
    }

    // 悬停预览
    function previewState(count) {
      const cells = gridContainer.querySelectorAll('.cell');
      cells.forEach((cell, idx) => {
        if (idx < count) {
          if (!cell.classList.contains('active')) {
            cell.classList.add('preview');
          }
        } else {
          cell.classList.remove('active');
          cell.classList.remove('preview');
        }
      });
    }

    // 更新公式与情境文本
    function updateFormula(count) {
      formulaNum.textContent = count;
      formulaPercent.textContent = count + '%';

      // 动态更新情境描述，增强代入感
      if (count === 10) {
        infoText.innerHTML = `如果国家规定“每100元收入要交10元税”，这10元占100元的 <span class="highlight-text">10/100</span>，也就是 <span class="highlight-text">10%</span>。此时税率就是10%。`;
      } else if (count === 0) {
        infoText.innerHTML = `当填充为 0 时，表示没有交税。占总收入的 <span class="highlight-text">0/100</span>，即 <span class="highlight-text">0%</span>。`;
      } else if (count === 100) {
        infoText.innerHTML = `当填充 100 格时，表示全部收入都要交税！占总收入的 <span class="highlight-text">100/100</span>，即 <span class="highlight-text">100%</span>（整体）。`;
      } else {
        infoText.innerHTML = `如果每100元收入要交 <span class="highlight-text">${count}</span> 元税，这部分税收就占总收入的 <span class="highlight-text">${count}/100</span>，也就是 <span class="highlight-text">${count}%</span>。`;
      }
    }

    // 滑块事件监听
    slider.addEventListener('input', (e) => {
      updateState(parseInt(e.target.value));
    });

    // 预设按钮事件
    btnTax.addEventListener('click', () => {
      updateState(10);
    });

    btnReset.addEventListener('click', () => {
      updateState(0);
    });

    btnRandom.addEventListener('click', () => {
      const randomVal = Math.floor(Math.random() * 101);
      updateState(randomVal);
    });

    // 初始化执行
    createGrid();
    updateState(10);
  </script>
</body>
</html>
