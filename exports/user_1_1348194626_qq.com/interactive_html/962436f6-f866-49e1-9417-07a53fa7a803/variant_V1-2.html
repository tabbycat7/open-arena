<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商业消费 vs 公共服务 - 教学可视化</title>
    <style>
        :root {
            --primary-color: #2B6CB0;
            --commercial-color: #DD6B20;
            --public-color: #319795;
            --bg-color: #F7FAFC;
            --card-bg: #FFFFFF;
            --text-color: #2D3748;
            --border-color: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 4:3 比例自适应容器 */
        .container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 24px;
        }

        /* 头部区域 */
        .header {
            text-align: center;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            color: #4A5568;
            line-height: 1.5;
        }

        /* 主可视化区域 */
        .visualization-area {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: stretch;
            margin-bottom: 16px;
        }

        /* 卡片样式 */
        .card {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            background: #FCFDFE;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
        }

        .card.active-commercial {
            border-color: var(--commercial-color);
            background-color: #FFFAF0;
        }

        .card.active-public {
            border-color: var(--public-color);
            background-color: #E6FFFA;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .commercial .card-title { color: var(--commercial-color); }
        .public .card-title { color: var(--public-color); }

        /* SVG 绘图区 */
        .svg-container {
            width: 100%;
            flex: 1;
            min-height: 180px;
            background: #FFFFFF;
            border-radius: 8px;
            border: 1px dashed #CBD5E0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* 交互标签 */
        .info-tag {
            margin-top: 12px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            width: 90%;
            transition: all 0.3s ease;
            background-color: #EDF2F7;
            color: #718096;
        }

        .active-commercial .info-tag {
            background-color: var(--commercial-color);
            color: white;
        }

        .active-public .info-tag {
            background-color: var(--public-color);
            color: white;
        }

        /* 控制面板 */
        .control-panel {
            background: #EDF2F7;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .slider-label {
            font-size: 15px;
            font-weight: bold;
            min-width: 180px;
        }

        .slider-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            outline: none;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .slider-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            min-width: 60px;
        }

        /* 引导说明 */
        .explanation-box {
            font-size: 14px;
            line-height: 1.6;
            color: #4A5568;
            background: #FFF;
            padding: 10px 14px;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
            min-height: 54px;
            display: flex;
            align-items: center;
        }

        /* 动画效果 */
        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部：呈现核心冲突问题 -->
    <div class="header">
        <h1>商业消费 vs 公共服务</h1>
        <p><strong>思考：</strong>有人说“我不纳税，所以我不去公立公园/图书馆”，这个逻辑对吗？请通过下方实验观察两者的本质区别。</p>
    </div>

    <!-- 主可视化区 -->
    <div class="visualization-area">
        <!-- 左侧：商业消费 -->
        <div class="card commercial" id="card-comm">
            <div class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <line x1="12" y1="4" x2="12" y2="20"/>
                </svg>
                商业消费（游乐园门票）
            </div>
            <div class="svg-container">
                <svg id="svg-comm" viewBox="0 0 200 150">
                    <!-- 背景 -->
                    <rect width="200" height="150" fill="#FFFDF9"/>
                    <!-- 游乐园大门/围栏 -->
                    <path d="M 20,130 L 180,130" stroke="#718096" stroke-width="4"/>
                    <path d="M 40,130 L 40,80 L 80,80 L 80,130" fill="none" stroke="#A0AEC0" stroke-width="3"/>
                    <path d="M 120,130 L 120,80 L 160,80 L 160,130" fill="none" stroke="#A0AEC0" stroke-width="3"/>
                    <!-- 闸机/门禁 -->
                    <rect x="90" y="90" width="20" height="40" rx="2" fill="#DD6B20"/>
                    <line id="gate-bar" x1="90" y1="100" x2="70" y2="100" stroke="#E53E3E" stroke-width="4"/>
                    <!-- 游客 -->
                    <circle id="comm-visitor" cx="50" cy="115" r="8" fill="#4A5568"/>
                    <path id="comm-visitor-body" d="M 50,123 L 50,130 M 45,126 L 55,126" stroke="#4A5568" stroke-width="2"/>
                    <!-- 门票提示 -->
                    <g id="ticket-group" opacity="0">
                        <rect x="75" y="40" width="50" height="25" rx="3" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1.5"/>
                        <text x="100" y="57" font-size="10" text-anchor="middle" fill="#B7791F" font-weight="bold">门票已付</text>
                    </g>
                    <!-- 锁/禁止标识 -->
                    <g id="lock-icon" opacity="1">
                        <circle cx="100" cy="60" r="12" fill="#FED7D7"/>
                        <path d="M 96,60 L 104,60 M 100,56 L 100,64" stroke="#E53E3E" stroke-width="2" transform="rotate(45 100 60)"/>
                    </g>
                </svg>
            </div>
            <div class="info-tag" id="tag-comm">点击观察：准入规则</div>
        </div>

        <!-- 右侧：公共服务 -->
        <div class="card public" id="card-pub">
            <div class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                公共服务（公立公园）
            </div>
            <div class="svg-container">
                <svg id="svg-pub" viewBox="0 0 200 150">
                    <!-- 背景 -->
                    <rect width="200" height="150" fill="#F0FFF4"/>
                    <!-- 开放式公园场景 -->
                    <path d="M 10,130 L 190,130" stroke="#718096" stroke-width="4"/>
                    <!-- 树木（受税收影响生长） -->
                    <g id="park-trees">
                        <path d="M 30,130 L 30,100" stroke="#718096" stroke-width="3"/>
                        <circle id="tree-leaves-1" cx="30" cy="90" r="16" fill="#48BB78"/>
                        <path d="M 170,130 L 170,100" stroke="#718096" stroke-width="3"/>
                        <circle id="tree-leaves-2" cx="170" cy="90" r="16" fill="#48BB78"/>
                    </g>
                    <!-- 长椅 -->
                    <path d="M 85,130 L 85,115 L 115,115 L 115,130 M 80,120 L 120,120" fill="none" stroke="#718096" stroke-width="2"/>
                    <!-- 共享的人群（无论纳税多少，始终都在） -->
                    <!-- 人物A：老人 -->
                    <circle cx="65" cy="110" r="7" fill="#319795"/>
                    <path d="M 65,117 L 65,130 M 60,121 L 70,121" stroke="#319795" stroke-width="2"/>
                    <!-- 人物B：小孩 -->
                    <circle cx="100" cy="115" r="5" fill="#319795"/>
                    <path d="M 100,120 L 100,130 M 96,123 L 104,123" stroke="#319795" stroke-width="2"/>
                    <!-- 人物C：普通市民 -->
                    <circle cx="135" cy="108" r="8" fill="#319795"/>
                    <path d="M 135,116 L 135,130 M 130,120 L 140,120" stroke="#319795" stroke-width="2"/>
                    
                    <!-- 开放标识 -->
                    <g id="open-sign">
                        <rect x="70" y="20" width="60" height="20" rx="10" fill="#C6F6D5" stroke="#38A169" stroke-width="1"/>
                        <text x="100" y="33" font-size="10" text-anchor="middle" fill="#22543D" font-weight="bold">全民免费共享</text>
                    </g>
                </svg>
            </div>
            <div class="info-tag" id="tag-pub">点击观察：准入规则</div>
        </div>
    </div>

    <!-- 控制面板：滑块与动态解释 -->
    <div class="control-panel">
        <div class="slider-group">
            <div class="slider-label">模拟个人纳税/消费金额:</div>
            <div class="slider-wrapper">
                <input type="range" id="tax-slider" min="0" max="100" value="0">
                <span class="slider-value" id="slider-val">0 元</span>
            </div>
        </div>
        <div class="explanation-box" id="exp-text">
            💡 拖动上方滑块，或点击左右卡片，观察商业消费与公共服务的本质区别。
        </div>
    </div>
</div>

<script>
    const cardComm = document.getElementById('card-comm');
    const cardPub = document.getElementById('card-pub');
    const tagComm = document.getElementById('tag-comm');
    const tagPub = document.getElementById('tag-pub');
    const taxSlider = document.getElementById('tax-slider');
    const sliderVal = document.getElementById('slider-val');
    const expText = document.getElementById('exp-text');

    // SVG 内部元素
    const gateBar = document.getElementById('gate-bar');
    const commVisitor = document.getElementById('comm-visitor');
    const commVisitorBody = document.getElementById('comm-visitor-body');
    const ticketGroup = document.getElementById('ticket-group');
    const lockIcon = document.getElementById('lock-icon');
    const treeLeaves1 = document.getElementById('tree-leaves-1');
    const treeLeaves2 = document.getElementById('tree-leaves-2');

    let activeMode = 'none'; // 'comm' or 'pub' or 'none'

    // 交互：点击左侧卡片（商业消费）
    cardComm.addEventListener('click', () => {
        activeMode = 'comm';
        cardComm.classList.add('active-commercial');
        cardPub.classList.remove('active-public');
        
        tagComm.textContent = "个人付费者使用";
        tagPub.textContent = "点击观察：准入规则";
        
        updateVisuals();
    });

    // 交互：点击右侧卡片（公共服务）
    cardPub.addEventListener('click', () => {
        activeMode = 'pub';
        cardPub.classList.add('active-public');
        cardComm.classList.remove('active-commercial');
        
        tagPub.textContent = "所有人共享";
        tagComm.textContent = "点击观察：准入规则";
        
        updateVisuals();
    });

    // 交互：滑动条变化
    taxSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        sliderVal.textContent = val + ' 元';
        updateVisuals();
    });

    // 核心更新逻辑
    function updateVisuals() {
        const val = parseInt(taxSlider.value);

        // 1. 更新左侧（商业消费）表现
        if (val >= 50) {
            // 模拟购买了门票
            gateBar.setAttribute('transform', 'rotate(-90 90 100)'); // 闸机打开
            commVisitor.setAttribute('cx', '110'); // 游客走进去
            commVisitorBody.setAttribute('transform', 'translate(60, 0)');
            ticketGroup.setAttribute('opacity', '1');
            lockIcon.setAttribute('opacity', '0');
        } else {
            // 钱不够，无法进入
            gateBar.setAttribute('transform', 'rotate(0 90 100)'); // 闸机关闭
            commVisitor.setAttribute('cx', '50'); // 游客在外面
            commVisitorBody.setAttribute('transform', 'translate(0, 0)');
            ticketGroup.setAttribute('opacity', '0');
            lockIcon.setAttribute('opacity', '1');
        }

        // 2. 更新右侧（公共服务）表现
        // 随着纳税额增加，公共设施（树木）变得更茂盛，但“全民共享”的规则和人群从未改变
        const treeSize = 16 + (val / 100) * 10; // 树冠从16变大到26
        treeLeaves1.setAttribute('r', treeSize);
        treeLeaves2.setAttribute('r', treeSize);

        // 3. 动态更新教学引导文字
        if (activeMode === 'none') {
            expText.innerHTML = `💡 <strong>请点击上方任意卡片</strong>，开始探索！`;
        } else if (activeMode === 'comm') {
            if (val < 50) {
                expText.innerHTML = `🔴 <strong>商业消费：</strong>当前金额（${val}元）不足以购买门票。商业逻辑是<strong>“等价交换”</strong>，不付费就无法享受服务。`;
            } else {
                expText.innerHTML = `🔴 <strong>商业消费：</strong>你支付了${val}元，成功购票入场！这属于<strong>“谁付款，谁受益”</strong>的私人消费。`;
            }
        } else if (activeMode === 'pub') {
            if (val === 0) {
                expText.innerHTML = `🟢 <strong>公共服务：</strong>即使你当前的直接纳税额为 0 元，公园依然<strong>免费向你和所有人开放</strong>！因为公共服务具有<strong>“非排他性”</strong>。`;
            } else {
                expText.innerHTML = `🟢 <strong>公共服务：</strong>你纳税了 ${val} 元，公共资金增加，公园的树木长得更茂盛了（设施变好）。但无论你纳税多少，<strong>所有人享有的使用权是完全一样的</strong>。`;
            }
        }
    }

    // 初始提示动画
    cardComm.classList.add('pulse');
    cardPub.classList.add('pulse');
    setTimeout(() => {
        cardComm.classList.remove('pulse');
        cardPub.classList.remove('pulse');
    }, 4000);
</script>

</body>
</html>
