<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3-1-1 循环变量自增模拟器</title>
    <style>
        /* 全局样式重置与投影仪优化 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 4:3 比例自适应容器 */
        .aspect-ratio-container {
            width: 95vw;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background-color: #1e293b;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 2px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5% 4%;
            position: relative;
            overflow: hidden;
        }

        /* 头部标题区 */
        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 1.1rem;
            color: #94a3b8;
        }

        /* 核心可视化区域 */
        .visualization-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        /* 算式动态显示区 */
        .formula-box {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 10px 30px;
            border: 1px solid #475569;
            min-width: 320px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .formula-text {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .highlight-add {
            color: #f59e0b;
            animation: pulse 1s infinite;
        }

        .highlight-result {
            color: #10b981;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        /* 指针指示器 */
        .pointer-container {
            width: 100%;
            height: 30px;
            position: relative;
            margin-bottom: -10px;
        }

        .pointer {
            position: absolute;
            bottom: 0;
            transform: translateX(-50%);
            transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pointer-arrow {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 12px solid #38bdf8;
            filter: drop-shadow(0 -2px 4px rgba(56, 189, 248, 0.5));
        }

        /* 百格板（简化为11格单行纸带，代表1000-1010） */
        .grid-board {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            gap: 6px;
            width: 100%;
            background: #0f172a;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .grid-cell {
            aspect-ratio: 1;
            background-color: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #64748b;
            transition: all 0.3s ease;
            position: relative;
            user-select: none;
        }

        .grid-cell .index-label {
            font-size: 0.65rem;
            color: #475569;
            margin-top: 2px;
        }

        /* 激活状态（当前扫描到的数字） */
        .grid-cell.active {
            background-color: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
            transform: scale(1.08);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
            z-index: 10;
        }

        .grid-cell.active .index-label {
            color: #bae6fd;
        }

        /* 已访问过的状态 */
        .grid-cell.visited {
            background-color: #0f172a;
            border-color: #1e293b;
            color: #334155;
        }

        .grid-cell.visited .index-label {
            color: #1e293b;
        }

        /* 底部控制区 */
        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #334155;
            padding-top: 20px;
        }

        .info-badge {
            background-color: #334155;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-badge strong {
            color: #38bdf8;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background-color: #7dd3fc;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background-color: #334155;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
        }

        #reset-btn {
            background-color: transparent;
            border: 1px solid #475569;
            color: #94a3b8;
        }

        #reset-btn:hover {
            background-color: rgba(71, 85, 105, 0.2);
            color: #f1f5f9;
        }

        /* 动画效果 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="aspect-ratio-container">
        <!-- 头部标题 -->
        <div class="header">
            <h1>探索循环：计算机是如何数数的？</h1>
            <p>我们要让计算机在 [1000, 1100] 范围内一个一个地检查。</p>
        </div>

        <!-- 核心可视化区 -->
        <div class="visualization-area">
            <!-- 动态算式 -->
            <div class="formula-box">
                <div id="formula-content" class="formula-text">
                    <span>当前检查：</span>
                    <span class="highlight-result">1000</span>
                </div>
            </div>

            <!-- 指针 -->
            <div class="pointer-container">
                <div id="pointer" class="pointer" style="left: 4.54%;">
                    <div class="pointer-arrow"></div>
                </div>
            </div>

            <!-- 数字百格板（局部展示 1000 - 1010） -->
            <div class="grid-board" id="grid-board">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>

        <!-- 底部控制面板 -->
        <div class="control-panel">
            <div class="info-badge">
                <span>循环变量 <strong>i</strong> 的当前值:</span>
                <strong id="variable-display" style="font-size: 1.2rem;">1000</strong>
            </div>
            <div class="btn-group">
                <button id="reset-btn">重置</button>
                <button id="prev-btn" disabled>上一步</button>
                <button id="next-btn">下一步</button>
            </div>
        </div>
    </div>

    <script>
        // 常量定义
        const START_VAL = 1000;
        const END_VAL = 1010;
        let currentIndex = 0; // 对应 1000

        // DOM 元素获取
        const gridBoard = document.getElementById('grid-board');
        const pointer = document.getElementById('pointer');
        const formulaContent = document.getElementById('formula-content');
        const variableDisplay = document.getElementById('variable-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const resetBtn = document.getElementById('reset-btn');

        // 初始化生成格子
        function initGrid() {
            gridBoard.innerHTML = '';
            for (let val = START_VAL; val <= END_VAL; val++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.id = `cell-${val}`;
                
                const numSpan = document.createElement('span');
                numSpan.textContent = val;
                
                const labelSpan = document.createElement('span');
                labelSpan.className = 'index-label';
                labelSpan.textContent = `第 ${val - START_VAL + 1} 个`;
                
                cell.appendChild(numSpan);
                cell.appendChild(labelSpan);
                gridBoard.appendChild(cell);
            }
            updateUI();
        }

        // 更新UI状态
        function updateUI() {
            const currentVal = START_VAL + currentIndex;

            // 1. 更新格子样式
            for (let val = START_VAL; val <= END_VAL; val++) {
                const cell = document.getElementById(`cell-${val}`);
                cell.className = 'grid-cell'; // 重置
                if (val < currentVal) {
                    cell.classList.add('visited');
                } else if (val === currentVal) {
                    cell.classList.add('active');
                }
            }

            // 2. 更新指针位置 (11个格子，每个占比 1/11，居中对齐)
            const percent = ((currentIndex + 0.5) / 11) * 100;
            pointer.style.left = `${percent}%`;

            // 3. 更新底部变量显示
            variableDisplay.textContent = currentVal;

            // 4. 更新动态算式
            if (currentIndex === 0) {
                formulaContent.innerHTML = `
                    <span class="fade-in">起点：i = <span class="highlight-result">1000</span></span>
                `;
            } else {
                const prevVal = currentVal - 1;
                formulaContent.innerHTML = `
                    <span class="fade-in">${prevVal}</span>
                    <span class="highlight-add fade-in"> + 1 </span>
                    <span class="fade-in"> ➔ </span>
                    <span class="highlight-result fade-in">${currentVal}</span>
                `;
            }

            // 5. 按钮状态控制
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === (END_VAL - START_VAL);
        }

        // 事件监听
        nextBtn.addEventListener('click', () => {
            if (currentIndex < (END_VAL - START_VAL)) {
                currentIndex++;
                updateUI();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateUI();
            }
        });

        resetBtn.addEventListener('click', () => {
            currentIndex = 0;
            updateUI();
        });

        // 键盘左右方向键支持，方便教师操作
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                if (currentIndex < (END_VAL - START_VAL)) {
                    currentIndex++;
                    updateUI();
                }
            } else if (e.key === 'ArrowLeft') {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateUI();
                }
            }
        });

        // 初始化执行
        initGrid();
    </script>
</body>
</html>
