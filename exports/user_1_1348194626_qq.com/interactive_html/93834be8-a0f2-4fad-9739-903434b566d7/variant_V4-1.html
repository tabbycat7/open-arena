<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算法控制流交互模拟器 - 循环与分支的顺序</title>
  <style>
    :root {
      --primary: #3182ce;
      --primary-light: #ebf8ff;
      --success: #38a169;
      --success-light: #f0fff4;
      --danger: #e53e3e;
      --danger-light: #fff5f5;
      --gray-100: #f7fafc;
      --gray-200: #edf2f7;
      --gray-300: #e2e8f0;
      --gray-600: #4a5568;
      --gray-800: #2d3748;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background-color: #f0f4f8;
      color: var(--gray-800);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    /* 4:3 比例自适应容器 */
    .app-container {
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 4 / 3;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--gray-300);
    }

    /* 头部区域 */
    .header {
      background: linear-gradient(135deg, #2b6cb0, #3182ce);
      color: white;
      padding: 15px 20px;
      text-align: center;
      border-bottom: 3px solid #2b6cb0;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    /* 主体布局 */
    .main-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      overflow: hidden;
    }

    /* 左侧：流程图画布 */
    .canvas-area {
      background-color: var(--gray-100);
      border-right: 1px solid var(--gray-300);
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 10px;
    }

    .tab-container {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid var(--gray-300);
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      background: var(--gray-200);
    }

    .tab-btn.active-A {
      border-color: var(--success);
      color: var(--success);
      background: var(--success-light);
    }

    .tab-btn.active-B {
      border-color: var(--danger);
      color: var(--danger);
      background: var(--danger-light);
    }

    .flowchart-wrapper {
      flex: 1;
      position: relative;
      background: white;
      border-radius: 12px;
      border: 1px solid var(--gray-300);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    /* 右侧：控制面板与状态 */
    .control-panel {
      display: flex;
      flex-direction: column;
      padding: 15px;
      overflow-y: auto;
      gap: 12px;
      background: #ffffff;
    }

    .panel-section {
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      padding: 12px;
      background: var(--gray-100);
    }

    .section-title {
      font-size: 14px;
      font-weight: bold;
      color: var(--gray-800);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 按钮样式 */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn {
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover { background-color: #2b6cb0; }
    .btn-primary:disabled { background-color: var(--gray-300); cursor: not-allowed; }

    .btn-secondary {
      background-color: var(--gray-300);
      color: var(--gray-800);
    }

    .btn-secondary:hover { background-color: #cbd5e0; }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    .btn-danger:hover { background-color: #c53030; }

    /* 速度滑块 */
    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }

    .speed-control input {
      flex: 1;
      cursor: pointer;
    }

    /* 变量监视器 */
    .monitor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .monitor-card {
      background: white;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }

    .monitor-label {
      font-size: 11px;
      color: var(--gray-600);
      margin-bottom: 2px;
    }

    .monitor-value {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary);
    }

    .monitor-value.highlight {
      color: var(--danger);
      animation: pulse 0.5s infinite alternate;
    }

    /* 运行日志 */
    .log-container {
      height: 110px;
      background: var(--gray-800);
      color: #a0aec0;
      border-radius: 8px;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      overflow-y: auto;
      line-height: 1.4;
    }

    .log-entry {
      margin-bottom: 4px;
    }

    .log-entry.info { color: #63b3ed; }
    .log-entry.success { color: #68d391; }
    .log-entry.warn { color: #f6e05e; }
    .log-entry.error { color: #fc8181; }

    /* 思考与分析 */
    .analysis-box {
      background-color: #fffaf0;
      border: 1px solid #feebc8;
      color: #744210;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.5;
    }

    /* SVG 节点样式 */
    .node {
      transition: all 0.2s ease;
    }

    .node rect, .node polygon, .node ellipse {
      fill: #ffffff;
      stroke: var(--gray-600);
      stroke-width: 2;
      transition: all 0.2s ease;
    }

    .node text {
      fill: var(--gray-800);
      font-size: 12px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    /* 激活状态 */
    .node.active rect, .node.active polygon, .node.active ellipse {
      fill: var(--primary-light);
      stroke: var(--primary);
      stroke-width: 3;
      filter: drop-shadow(0px 0px 4px rgba(66, 153, 225, 0.6));
    }

    .node.active text {
      fill: #2b6cb0;
    }

    /* 成功/失败状态 */
    .node.success rect, .node.success polygon, .node.success ellipse {
      fill: var(--success-light);
      stroke: var(--success);
    }

    .node.error rect, .node.error polygon, .node.error ellipse {
      fill: var(--danger-light);
      stroke: var(--danger);
    }

    /* 流程线 */
    .flow-line {
      fill: none;
      stroke: var(--gray-600);
      stroke-width: 2;
    }

    .flow-text {
      font-size: 11px;
      fill: var(--gray-600);
      font-weight: bold;
    }

    /* 动画指针 */
    #pointer {
      transition: cx 0.2s linear, cy 0.2s linear;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 头部 -->
    <div class="header">
      <h1>算法控制流探究：分支框放哪里？</h1>
      <p>探究：如果把“余数条件判断框”移到循环外面，程序还能找到士兵人数吗？</p>
    </div>

    <!-- 主体 -->
    <div class="main-content">
      <!-- 左侧：流程图 -->
      <div class="canvas-area">
        <div class="tab-container">
          <button id="tab-A" class="tab-btn active-A">通道 A：余数判断在循环内（正确）</button>
          <button id="tab-B" class="tab-btn">通道 B：余数判断在循环外（错误）</button>
        </div>

        <div class="flowchart-wrapper">
          <!-- 通道 A SVG -->
          <svg id="svg-A" viewBox="0 0 600 420">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4a5568" />
              </marker>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            <!-- 连线 -->
            <path class="flow-line" d="M 300 35 L 300 70" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 300 110 L 300 140" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 300 180 L 300 230" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 300 270 L 430 270" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 300 160 L 430 160" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 490 180 L 490 340 L 350 340" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 490 290 L 490 340 L 350 340" marker-end="url(#arrow)" />
            
            <!-- 循环返回线 -->
            <path class="flow-line" d="M 230 250 L 140 250 L 140 200" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 140 160 L 140 110 L 300 110" marker-end="url(#arrow)" />

            <!-- 连线文本 -->
            <text class="flow-text" x="310" y="200">是 (i <= 100)</text>
            <text class="flow-text" x="350" y="150">否 (i > 100)</text>
            <text class="flow-text" x="350" y="260">是 (满足余数)</text>
            <text class="flow-text" x="170" y="240">否</text>

            <!-- 节点 -->
            <g id="node-A-start" class="node"><ellipse cx="300" cy="20" rx="45" ry="15" /><text x="300" y="20">开始</text></g>
            <g id="node-A-init" class="node"><rect x="240" y="70" width="120" height="40" rx="5" /><text x="300" y="90">i = 1</text></g>
            <g id="node-A-cond" class="node"><polygon points="300,130 370,160 300,190 230,160" /><text x="300" y="160">i <= 100 ?</text></g>
            <g id="node-A-decide" class="node"><polygon points="300,220 370,250 300,280 230,250" /><text x="300" y="250">满足余数条件?</text></g>
            <g id="node-A-inc" class="node"><rect x="80" y="160" width="120" height="40" rx="5" /><text x="140" y="180">i = i + 1</text></g>
            <g id="node-A-output" class="node"><polygon points="420,250 550,250 530,290 400,290" /><text x="475" y="270">输出 i (找到人数)</text></g>
            <g id="node-A-nofound" class="node"><polygon points="420,140 550,140 530,180 400,180" /><text x="475" y="160">输出 "未找到"</text></g>
            <g id="node-A-end" class="node"><ellipse cx="300" cy="340" rx="45" ry="15" /><text x="300" y="340">结束</text></g>

            <!-- 运行指针 -->
            <circle id="pointer-A" r="8" fill="#ff9f43" filter="url(#glow)" style="display:none;" />
          </svg>

          <!-- 通道 B SVG -->
          <svg id="svg-B" viewBox="0 0 600 420" style="display: none;">
            <!-- 连线 -->
            <path class="flow-line" d="M 300 35 L 300 70" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 300 110 L 300 140" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 300 180 L 300 230" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 300 270 L 430 270" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 300 270 L 170 270" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 490 290 L 490 340 L 350 340" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 110 290 L 110 340 L 250 340" marker-end="url(#arrow)" />
            
            <!-- 循环返回线 -->
            <path class="flow-line" d="M 230 160 L 140 160" marker-end="url(#arrow)" />
            <path class="flow-line" d="M 140 140 L 140 110 L 300 110" marker-end="url(#arrow)" />

            <!-- 连线文本 -->
            <text class="flow-text" x="170" y="150">是 (i <= 100)</text>
            <text class="flow-text" x="310" y="200">否 (i > 100)</text>
            <text class="flow-text" x="350" y="260">是 (满足余数)</text>
            <text class="flow-text" x="190" y="260">否</text>

            <!-- 节点 -->
            <g id="node-B-start" class="node"><ellipse cx="300" cy="20" rx="45" ry="15" /><text x="300" y="20">开始</text></g>
            <g id="node-B-init" class="node"><rect x="240" y="70" width="120" height="40" rx="5" /><text x="300" y="90">i = 1</text></g>
            <g id="node-B-cond" class="node"><polygon points="300,130 370,160 300,190 230,160" /><text x="300" y="160">i <= 100 ?</text></g>
            <g id="node-B-inc" class="node"><rect x="80" y="140" width="120" height="40" rx="5" /><text x="140" y="160">i = i + 1</text></g>
            <g id="node-B-decide" class="node"><polygon points="300,220 370,250 300,280 230,250" /><text x="300" y="250">满足余数条件?</text></g>
            <g id="node-B-output" class="node"><polygon points="420,250 550,250 530,290 400,290" /><text x="475" y="270">输出 i (找到人数)</text></g>
            <g id="node-B-nofound" class="node"><polygon points="50,250 180,250 160,290 30,290" /><text x="105" y="270">输出 "未找到"</text></g>
            <g id="node-B-end" class="node"><ellipse cx="300" cy="340" rx="45" ry="15" /><text x="300" y="340">结束</text></g>

            <!-- 运行指针 -->
            <circle id="pointer-B" r="8" fill="#ff9f43" filter="url(#glow)" style="display:none;" />
          </svg>
        </div>
      </div>

      <!-- 右侧：控制面板 -->
      <div class="control-panel">
        <!-- 运行控制 -->
        <div class="panel-section">
          <div class="section-title">⚙️ 运行控制</div>
          <div class="btn-group">
            <button id="btn-play" class="btn btn-primary">▶ 自动运行</button>
            <button id="btn-step" class="btn btn-secondary">⏭ 单步执行</button>
          </div>
          <div class="btn-group">
            <button id="btn-reset" class="btn btn-secondary" style="grid-column: span 2;">🔄 重置程序</button>
          </div>
          <div class="speed-control">
            <span>演示速度：</span>
            <input type="range" id="speed-slider" min="1" max="4" value="2">
            <span id="speed-text">中速</span>
          </div>
        </div>

        <!-- 变量监视器 -->
        <div class="panel-section">
          <div class="section-title">📊 变量实时监视器</div>
          <div class="monitor-grid">
            <div class="monitor-card">
              <div class="monitor-label">当前士兵人数 i</div>
              <div id="val-i" class="monitor-value">1</div>
            </div>
            <div class="monitor-card">
              <div class="monitor-label">循环条件 (i <= 100)</div>
              <div id="val-cond" class="monitor-value">-</div>
            </div>
            <div class="monitor-card" style="grid-column: span 2;">
              <div class="monitor-label">余数条件 (除3余2 且 除5余3 且 除7余2)</div>
              <div id="val-remainder" class="monitor-value">-</div>
            </div>
          </div>
        </div>

        <!-- 运行日志 -->
        <div class="panel-section">
          <div class="section-title">📝 运行日志</div>
          <div id="log-box" class="log-container">
            <div class="log-entry info">系统就绪，请选择通道并点击“自动运行”或“单步执行”。</div>
          </div>
        </div>

        <!-- 思考与分析 -->
        <div class="panel-section">
          <div class="section-title">💡 课堂思考</div>
          <div id="analysis-text" class="analysis-box">
            <strong>韩信点兵问题：</strong>我们要寻找一个100以内的数，满足除以3余2，除以5余3，除以7余2（正确答案是23和68）。
            <br><br>
            请选择<strong>通道 B</strong>，观察当判断框被移到循环外时，程序会发生什么？
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 状态变量
    let currentMode = 'A'; // 'A' or 'B'
    let i = 1;
    let currentNode = 'start';
    let isRunning = false;
    let isPaused = false;
    let timer = null;
    let stepDelay = 400; // 毫秒

    // 路径坐标定义 (用于动画指针移动)
    const pathsA = {
      'start->init': [[300, 20], [300, 70]],
      'init->cond': [[300, 90], [300, 130]],
      'cond->decide': [[300, 190], [300, 220]],
      'cond->nofound': [[300, 160], [400, 160]],
      'decide->output': [[300, 250], [400, 270]],
      'decide->inc': [[300, 250], [140, 250], [140, 200]],
      'inc->cond': [[140, 180
