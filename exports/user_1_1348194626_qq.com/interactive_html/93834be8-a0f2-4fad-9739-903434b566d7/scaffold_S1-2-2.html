<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>为什么计算机适合死板的工作？</title>
  <style>
    /* 全局样式重置与课堂大屏适配 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f4f7f6;
      font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 4:3 比例自适应容器 */
    .aspect-ratio-container {
      width: 95vw;
      max-width: 960px;
      aspect-ratio: 4 / 3;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      border: 4px solid #333;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* 标题区域 */
    .header {
      text-align: center;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 28px;
      color: #2c3e50;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 16px;
      color: #7f8c8d;
    }

    /* 主展示区：左右对比 */
    .comparison-stage {
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex: 1;
      position: relative;
      z-index: 2;
    }

    /* 角色卡片 */
    .character-card {
      width: 42%;
      background: #fafbfc;
      border: 3px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: all 0.3s ease;
    }
    .character-card.active-human {
      border-color: #e74c3c;
      background: #fff5f5;
    }
    .character-card.active-robot {
      border-color: #2ecc71;
      background: #f0fff4;
    }

    /* 气泡对话框 */
    .speech-bubble {
      position: relative;
      background: #ffffff;
      border: 3px solid #333;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      line-height: 1.4;
      color: #2c3e50;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      width: 100%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .speech-bubble::after, .speech-bubble::before {
      top: 100%;
      left: 50%;
      border: solid transparent;
      content: "";
      height: 0;
      width: 0;
      position: absolute;
      pointer-events: none;
    }
    .speech-bubble::after {
      border-color: rgba(255, 255, 255, 0);
      border-top-color: #ffffff;
      border-width: 10px;
      margin-left: -10px;
    }
    .speech-bubble::before {
      border-color: rgba(51, 51, 51, 0);
      border-top-color: #333;
      border-width: 14px;
      margin-left: -14px;
    }

    /* 角色动画容器 */
    .character-sprite {
      width: 130px;
      height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
    }
    
    /* 机器人专属悬停提示 */
    .robot-sprite::after {
      content: "点我试试！";
      position: absolute;
      bottom: -20px;
      background: #2ecc71;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      opacity: 0.8;
      animation: bounce 1.5s infinite;
    }

    /* 状态面板 */
    .status-panel {
      width: 100%;
      margin-top: 15px;
      border-top: 2px dashed #e2e8f0;
      padding-top: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 6px;
      color: #34495e;
    }
    .status-val {
      font-weight: bold;
    }
    .progress-bar {
      width: 100%;
      height: 12px;
      background: #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
    }
    .human-fill {
      background: #e74c3c;
    }
    .robot-fill {
      background: #2ecc71;
    }

    /* 控制台区域 */
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      z-index: 3;
    }
    .btn {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border: 3px solid #333;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 #333;
    }
    .btn-primary {
      background: #f1c40f;
      color: #333;
    }
    .btn-primary:hover {
      background: #f39c12;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #333;
    }
    .btn-primary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #333;
    }
    .btn-secondary {
      background: #ecf0f1;
      color: #7f8c8d;
      border-color: #bdc3c7;
      box-shadow: 0 4px 0 #bdc3c7;
    }
    .btn-secondary:hover {
      background: #bdc3c7;
      color: #fff;
    }

    /* 动画效果 */
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    
    .spin-animation {
      animation: spin 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes spin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .shaking {
      animation: shake 0.5s infinite;
    }
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(0px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(2px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(2px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }

    /* 粒子画布 */
    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="aspect-ratio-container">
    <!-- 顶部标题 -->
    <div class="header">
      <h1>死板规则的对决：人类 vs 计算机</h1>
      <p>既然规则完全固定、只需死记硬背和拼命计算，谁能坚持到最后？</p>
    </div>

    <!-- 粒子特效画布 -->
    <canvas id="confetti-canvas"></canvas>

    <!-- 角色对比舞台 -->
    <div class="comparison-stage">
      
      <!-- 人类卡片 -->
      <div class="character-card" id="human-card">
        <div class="speech-bubble" id="human-speech">
          这工作太死板了，我快无聊死了！
        </div>
        <div class="character-sprite" id="human-sprite">
          <!-- 疲惫人类 SVG -->
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <!-- 身体 -->
            <path d="M30,90 C30,70 70,70 70,90" fill="#3498db" stroke="#2c3e50" stroke-width="3"/>
            <!-- 脖子 -->
            <rect x="46" y="60" width="8" height="15" fill="#f3c6a5" stroke="#2c3e50" stroke-width="3"/>
            <!-- 头部 -->
            <circle cx="50" cy="40" r="22" fill="#f3c6a5" stroke="#2c3e50" stroke-width="3"/>
            <!-- 头发 -->
            <path d="M28,40 C28,20 72,20 72,40 C65,25 35,25 28,40 Z" fill="#2c3e50"/>
            <!-- 眼睛 (动态改变) -->
            <g id="human-eyes">
              <!-- 正常眼睛 -->
              <circle cx="42" cy="38" r="3" fill="#2c3e50"/>
              <circle cx="58" cy="38" r="3" fill="#2c3e50"/>
            </g>
            <!-- 嘴巴 (动态改变) -->
            <path id="human-mouth" d="M44,52 Q50,48 56,52" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
            <!-- 汗滴 (初始隐藏) -->
            <path id="sweat-drop" d="M72,35 C72,35 75,40 72,43 C69,43 69,40 72,35" fill="#3498db" opacity="0"/>
          </svg>
        </div>
        <div class="status-panel">
          <div class="status-row">
            <span>计算速度:</span>
            <span class="status-val" id="human-speed">1 次 / 秒</span>
          </div>
          <div class="status-row">
            <span>疲劳度:</span>
            <span class="status-val" id="human-fatigue-text" style="color: #e74c3c;">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill human-fill" id="human-progress"></div>
          </div>
        </div>
      </div>

      <!-- 机器人卡片 -->
      <div class="character-card" id="robot-card">
        <div class="speech-bubble" id="robot-speech">
          死板？我最喜欢死板了！我永远不嫌无聊！
        </div>
        <div class="character-sprite robot-sprite" id="robot-sprite">
          <!-- 精神抖擞机器人 SVG -->
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <!-- 天线 -->
            <line x1="50" y1="20" x2="50" y2="5" stroke="#7f8c8d" stroke-width="3"/>
            <circle id="robot-light" cx="50" cy="5" r="5" fill="#e74c3c"/>
            <!-- 身体 -->
            <rect x="25" y="55" width="50" height="35" rx="8" fill="#95a5a6" stroke="#2c3e50" stroke-width="3"/>
            <!-- 屏幕 -->
            <rect x="35" y="63" width="30" height="18" rx="3" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
            <!-- 屏幕心跳线 -->
            <path d="M38,72 L44,72 L47,66 L50,78 L53,72 L62,72" fill="none" stroke="#2ecc71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- 头部 -->
            <rect x="30" y="20" width="40" height="32" rx="6" fill="#bdc3c7" stroke="#2c3e50" stroke-width="3"/>
            <!-- 眼睛 -->
            <circle cx="42" cy="32" r="5" fill="#2ecc71" id="robot-eye-l"/>
            <circle cx="58" cy="32" r="5" fill="#2ecc71" id="robot-eye-r"/>
            <!-- 嘴巴 -->
            <rect x="42" y="42" width="16" height="4" rx="2" fill="#2c3e50"/>
            <!-- 关节连接 -->
            <rect x="45" y="52" width="10" height="4" fill="#7f8c8d"/>
          </svg>
        </div>
        <div class="status-panel">
          <div class="status-row">
            <span>计算速度:</span>
            <span class="status-val" style="color: #2ecc71;">1亿 次 / 秒</span>
          </div>
          <div class="status-row">
            <span>疲劳度:</span>
            <span class="status-val" style="color: #2ecc71;">0% (恒定)</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill robot-fill" id="robot-progress"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- 控制按钮 -->
    <div class="controls">
      <button class="btn btn-primary" id="btn-start">开始 1000 万次重复检验</button>
      <button class="btn btn-secondary" id="btn-reset">重置</button>
    </div>
  </div>

  <script>
    // 获取DOM元素
    const btnStart = document.getElementById('btn-start');
    const btnReset = document.getElementById('btn-reset');
    const robotSprite = document.getElementById('robot-sprite');
    const robotCard = document.getElementById('robot-card');
    const humanCard = document.getElementById('human-card');
    const humanSprite = document.getElementById('human-sprite');
    
    const humanSpeech = document.getElementById('human-speech');
    const robotSpeech = document.getElementById('robot-speech');
    
    const humanProgress = document.getElementById('human-progress');
    const robotProgress = document.getElementById('robot-progress');
    const humanFatigueText = document.getElementById('human-fatigue-text');
    const humanSpeedText = document.getElementById('human-speed');
    
    // SVG 内部元素
    const humanEyes = document.getElementById('human-eyes');
    const humanMouth = document.getElementById('human-mouth');
    const sweatDrop = document.getElementById('sweat-drop');
    const robotLight = document.getElementById('robot-light');

    // 粒子系统设置
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationFrameId = null;

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 8 + 4;
        this.color = `hsla(${Math.random() * 50 + 45}, 100%, 60%, ${Math.random() * 0.7 + 0.3})`; // 金色/黄色系
        this.speedX = Math.random() * 10 - 5;
        this.speedY = Math.random() * -10 - 5;
        this.gravity = 0.3;
        this.life = 100;
        this.decay = Math.random() * 2 + 1;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.speedY += this.gravity;
        this.life -= this.decay;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function spawnConfetti(x, y) {
      for (let i = 0; i < 60; i++) {
        particles.push(new Particle(x, y));
      }
      if (!animationFrameId) {
        animateParticles();
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      if (particles.length > 0) {
        animationFrameId = requestAnimationFrame(animateParticles);
      } else {
        animationFrameId = null;
      }
    }

    // 模拟运行状态
    let isRunning = false;
    let humanInterval = null;
    let robotTimeout = null;

    function startSimulation() {
      if (isRunning) return;
      isRunning = true;
      btnStart.disabled = true;
      btnStart.style.opacity = 0.5;

      // 1. 机器人表现：瞬间爆发
      robotSprite.classList.add('spin-animation');
      robotCard.classList.add('active-robot');
      robotLight.setAttribute('fill', '#2ecc71');
      
      // 机器人进度条瞬间拉满
      robotProgress.style.width = '100%';
      robotSpeech.innerHTML = '⚡️ 1000万次检验完成！耗时 0.1 秒！毫无感觉，甚至想再算10亿次！';

      // 触发金色礼花
      const rect = robotSprite.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      const x = rect.left - canvasRect.left + rect.width / 2;
      const y = rect.top - canvasRect.top + rect.height / 2;
      spawnConfetti(x, y);

      // 2. 人类表现：极其痛苦，缓慢进行
      humanCard.classList.add('active-human');
      humanSprite.classList.add('shaking');
      sweatDrop.setAttribute('opacity', '1');
      
      // 改变人类表情为痛苦
      humanEyes.innerHTML = `
        <path d="M38,35 L46,43 M46,35 L38,43" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
        <path d="M54,35 L62,43 M62,35 L54,43" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
      `;
      humanMouth.setAttribute('d', 'M42,52 Q50,58 58,52'); // 哭丧嘴

      let count = 0;
      let fatigue = 0;
      humanSpeech.innerHTML = '呃……第一道题检验完毕……第二道题……好无聊啊……';

      humanInterval = setInterval(() => {
        count++;
        fatigue += 20;
        if (fatigue > 100) fatigue = 100;

        humanProgress.style.width = `${(count / 5) * 100}%`;
        humanFatigueText.innerText = `${fatigue}%`;

        if (count === 1) {
          humanSpeech.innerHTML = '（第2次）手酸了，眼睛好花，规则是什么来着？';
        } else if (count === 2) {
          humanSpeech.innerHTML = '（第3次）脑子要炸了！为什么我要重复做这种不动脑子的事？';
        } else if (count === 3) {
          humanSpeech.innerHTML = '（第4次）我开始走神了……刚才算到哪里了？完了，得重算……';
          humanSpeedText.innerText = '0.2 次 / 秒 (严重下降)';
        } else if (count >= 5) {
          clearInterval(humanInterval);
          humanSpeech.innerHTML = '😵 罢工了！我数都数不清了！这简直不是人干的活！';
          humanSprite.classList.remove('shaking');
        }
      }, 1200);

      // 机器人动画结束后移除类，允许重复点击机器人
      setTimeout(() => {
        robotSprite.classList.remove('spin-animation');
      }, 600);
    }

    function resetSimulation() {
      isRunning = false;
      clearInterval(humanInterval);
      clearTimeout(robotTimeout);
      
      btnStart.disabled = false;
      btnStart.style.opacity = 1;

      // 重置卡片状态
      humanCard.classList.remove('active-human');
      robotCard.classList.remove('active-robot');
      humanSprite.classList.remove('shaking');
      robotSprite.classList.remove('spin-animation');

      // 重置进度条与文本
      humanProgress.style.width = '0%';
      robotProgress.style.width = '0%';
      humanFatigueText.innerText = '0%';
      humanSpeedText.innerText = '1 次 / 秒';

      humanSpeech.innerHTML = '这工作太死板了，我快无聊死了！';
      robotSpeech.innerHTML = '死板？我最喜欢死板了！我永远不嫌无聊！';

      // 重置表情
      humanEyes.innerHTML = `
        <circle cx="42" cy="38" r="3" fill="#2c3e50"/>
        <circle cx="58" cy="38" r="3" fill="#2c3e50"/>
      `;
      humanMouth.setAttribute('d', 'M44,52 Q50,48 56,52');
      sweatDrop.setAttribute('opacity', '0');
      robotLight.setAttribute('fill', '#e74c3c');

      // 清空画布
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = [];
    }

    // 绑定事件
    btnStart.addEventListener('click', startSimulation);
    btnReset.addEventListener('click', resetSimulation);
    
    // 点击机器人也可以触发
    robotSprite.addEventListener('click', () => {
      if (!isRunning) {
        startSimulation();
      } else {
        // 如果已经在运行，点击机器人让它再转一下，洒点礼花
        robotSprite.classList.add('spin-animation');
        const rect = robotSprite.getBoundingClientRect();
        const canvasRect = canvas.getBoundingClientRect();
        spawnConfetti(
          rect.left - canvasRect.left + rect.width / 2,
          rect.top - canvasRect.top + rect.height / 2
        );
        setTimeout(() => {
          robotSprite.classList.remove('spin-animation');
        }, 600);
      }
    });
  </script>
</body>
</html>
