<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Open Arena - AI 应用平台{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
</head>

<body>

    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="navbar-inner">
            <div class="navbar-brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="20" fill="#409eff" />
                        <path d="M12 20 C12 14 28 14 28 20 C28 26 12 26 12 20Z" fill="white" opacity="0.9" />
                        <circle cx="16" cy="19" r="2.5" fill="#409eff" />
                        <circle cx="24" cy="19" r="2.5" fill="#409eff" />
                        <path d="M17 23.5 Q20 25.5 23 23.5" stroke="#409eff" stroke-width="1.5" stroke-linecap="round"
                            fill="none" />
                    </svg>
                </div>
                <span class="brand-name">Open Arena</span>
                <span class="brand-sub">AI 应用平台</span>
            </div>
            <nav class="navbar-menu" id="main-nav">
                <a href="/" class="nav-link{% if request.path == '/' %} active{% endif %}">首页</a>
                <a href="{% if request.path == '/' %}#apps{% else %}/{% endif %}"
                    class="nav-link{% if request.path.startswith('/app/') %} active{% endif %}">应用</a>
                <a href="{% if request.path == '/' %}#about{% else %}/#about{% endif %}" class="nav-link">关于</a>
            </nav>
            <div class="navbar-actions">
                <button class="btn btn-outline btn-sm">登录</button>
                <button class="btn btn-primary btn-sm">注册</button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="page-enter">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="footer" id="about">
        <div class="footer-inner">
            <div class="footer-brand">
                <div class="brand-logo brand-logo--sm">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="20" fill="#409eff" />
                        <path d="M12 20 C12 14 28 14 28 20 C28 26 12 26 12 20Z" fill="white" opacity="0.9" />
                        <circle cx="16" cy="19" r="2.5" fill="#409eff" />
                        <circle cx="24" cy="19" r="2.5" fill="#409eff" />
                        <path d="M17 23.5 Q20 25.5 23 23.5" stroke="#409eff" stroke-width="1.5" stroke-linecap="round"
                            fill="none" />
                    </svg>
                </div>
                <p class="footer-desc">Open Arena 致力于为用户提供一站式 AI 应用体验，整合多种 AI 能力，让智能触手可及。</p>
            </div>
            <div class="footer-links">
                <div class="footer-col">
                    <h4>产品</h4>
                    <a href="#">功能介绍</a>
                    <a href="#">更新日志</a>
                    <a href="#">路线图</a>
                </div>
                <div class="footer-col">
                    <h4>支持</h4>
                    <a href="#">使用文档</a>
                    <a href="#">常见问题</a>
                    <a href="#">联系我们</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2026 Open Arena. All rights reserved.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>

</html>
