<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素小人动画预览</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="../../css/mat_pixel.css">
<style>
  body { margin: 0; background: #0f1729; color: #e2e8f0;
         font-family: "Press Start 2P", system-ui, sans-serif; }
  h1 { font-size: 14px; text-align: center; padding: 24px 0 8px; color: #fbbf24; }
  p.note { text-align: center; font-family: system-ui, sans-serif; color: #94a3b8; margin: 0 0 20px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
          gap: 16px; padding: 16px 24px 48px; max-width: 1100px; margin: 0 auto; }
  .cell { border: 4px solid #1f2937; background: linear-gradient(180deg,#1e293b,#0f1729);
          border-radius: 8px; display: flex; flex-direction: column; align-items: center;
          justify-content: flex-end; min-height: 240px; position: relative; overflow: hidden; }
  .cell .mat-px-floor { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
          width: 80%; height: 14px; background: repeating-linear-gradient(90deg,#0b1120 0 8px,#1f2937 8px 16px);
          border: 3px solid #0b1120; }
  .cell span.label { font-size: 9px; color: #cbd5e1; padding: 8px 0 12px; z-index: 3; }
  .mat-px-sprite { margin-bottom: 14px; z-index: 2; }
</style>
</head>
<body>
  <h1>MAT 像素小人 · 逐帧动画预览</h1>
  <p class="note">每个小人都是 4 帧 sprite sheet（CSS steps 播放）。这是生成进度动画中各阶段登场的角色。</p>
  <div class="grid">
    <div class="cell"><div class="mat-px-floor"></div><span class="mat-px-sprite mat-px-idle"></span><span class="label">idle · 等待</span></div>
    <div class="cell"><div class="mat-px-floor"></div><span class="mat-px-sprite mat-px-scout"></span><span class="label">scout · 学情侦察</span></div>
    <div class="cell"><div class="mat-px-floor"></div><span class="mat-px-sprite mat-px-drafter"></span><span class="label">drafter · 蓝图设计</span></div>
    <div class="cell"><div class="mat-px-floor"></div><span class="mat-px-sprite mat-px-builder"></span><span class="label">builder · 主干搭建</span></div>
    <div class="cell"><div class="mat-px-floor"></div><span class="mat-px-sprite mat-px-gardener"></span><span class="label">gardener · 分支生长</span></div>
    <div class="cell"><div class="mat-px-floor"></div><span class="mat-px-sprite mat-px-inspector"></span><span class="label">inspector · 校验打磨</span></div>
    <div class="cell"><div class="mat-px-floor"></div><span class="mat-px-sprite mat-px-packer"></span><span class="label">packer · 总装交付</span></div>
    <div class="cell"><div class="mat-px-floor"></div><span class="mat-px-sprite mat-px-celebrate"></span><span class="label">celebrate · 完成</span></div>
  </div>
</body>
</html>
