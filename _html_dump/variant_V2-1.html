<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脑 vs 电脑：密码破译大比拼</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --computer-color: #2ecc71;
            --human-color: #e67e22;
            --dark-bg: #1e272e;
            --card-bg: #2f3640;
            --text-light: #f5f6fa;
            --text-muted: #dcdde1;
            --danger-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #12181f;
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* 4:3 比例自适应容器 */
        .container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background-color: var(--dark-bg);
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #3d4e5d;
            position: relative;
        }

        /* 头部区域 */
        header {
            background-color: #1b222b;
            padding: 15px 24px;
            border-bottom: 2px solid #2c3a47;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 22px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 span {
            font-size: 14px;
            background: var(--primary-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: normal;
        }

        /* 控制面板 */
        .control-panel {
            background-color: #252f3b;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-bottom: 1px solid #3d4e5d;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: bold;
        }

        /* 选项按钮样式 */
        .btn-group {
            display: flex;
            background: #1b222b;
            border-radius: 8px;
            padding: 3px;
        }

        .btn-option {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 16px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-option.active {
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
        }

        /* 开关样式 */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #4b5563;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--danger-color);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* 主操作按钮 */
        .btn-action {
            padding: 8px 20px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #btn-start {
            background-color: var(--computer-color);
            color: #12181f;
        }

        #btn-start:hover {
            background-color: #27ae60;
        }

        #btn-reset {
            background-color: #4b5563;
            color: var(--text-light);
        }

        /* 主体内容区 */
        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            padding: 20px;
            gap: 20px;
            min-height: 0; /* 防止溢出 */
        }

        /* 左侧：手机密码锁模拟 */
        .lock-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            border: 1px solid #3d4e5d;
        }

        .phone-mockup {
            width: 180px;
            height: 320px;
            background: #151a21;
            border: 6px solid #4b5563;
            border-radius: 24px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .phone-camera {
            width: 40px;
            height: 10px;
            background: #4b5563;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .lock-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-align: center;
        }

        /* 密码槽 */
        .pin-container {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            justify-content: center;
            width: 100%;
        }

        .pin-slot {
            width: 32px;
            height: 44px;
            background: #252f3b;
            border: 2px solid #4b5563;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            transition: all 0.1s;
        }

        .pin-slot.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.5);
        }

        /* 手机键盘模拟 */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 140px;
        }

        .key {
            aspect-ratio: 1;
            background: #252f3b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-muted);
            border: 1px solid #3d4e5d;
        }

        /* 锁定覆盖层 */
        .lockout-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(231, 76, 60, 0.95);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .lockout-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lockout-overlay svg {
            width: 48px;
            height: 48px;
            fill: white;
            margin-bottom: 15px;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            75% { transform: rotate(8deg); }
        }

        /* 右侧：对比图表区 */
        .chart-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #3d4e5d;
        }

        .track-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-container {
            background: #1b222b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            position: relative;
            border: 1px solid #2c3a47;
        }

        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .entity-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }

        .entity-icon {
            width: 24px;
            height: 24px;
        }

        .progress-bar-bg {
            height: 16px;
            background: #252f3b;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
            border-radius: 8px;
        }

        #human-fill {
            background: linear-gradient(90deg, #d35400, var(--human-color));
        }

        #computer-fill {
            background: linear-gradient(90deg, #27ae60, var(--computer-color));
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
            font-size: 12px;
        }

        .stat-item {
            background: #252f3b;
            padding: 6px 10px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            color: #8a97a5;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-weight: bold;
            font-size: 13px;
        }

        .human-value { color: var(--human-color); }
        .computer-value { color: var(--computer-color); }

        /* 状态警示标签 */
        .warning-badge {
            background-color: var(--danger-color);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            display: none;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* 底部思考引导 */
        .footer-prompt {
            background-color: #1b222b;
            padding: 12px 20px;
            border-top: 1px solid #2c3a47;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .prompt-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <header>
        <h1>人脑 vs 电脑：密码破译大比拼 <span>信息技术课</span></h1>
        <div class="control-group">
            <button id="btn-start" class="btn-action">开始破译</button>
            <button id="btn-reset" class="btn-action">重置</button>
        </div>
    </header>

    <!-- 控制面板 -->
    <div class="control-panel">
        <div class="control-group">
            <label>密码位数：</label>
            <div class="btn-group" id="digits-selector">
                <button class="btn-option active" data-digits="3">3位 (000-999)</button>
                <button class="btn-option" data-digits="4">4位 (0000-9999)</button>
                <button class="btn-option" data-digits="6">6位 (000000-999999)</button>
            </div>
        </div>

        <div class="control-group">
            <div class="switch-container" id="limit-switch-container">
                <label for="limit-switch" style="cursor:pointer;">开启“防暴力破解”限制</label>
                <span class="switch">
                    <input type="checkbox" id="limit-switch">
                    <span class="slider"></span>
                </span>
            </div>
        </div>
    </div>

    <!-- 主体内容 -->
    <div class="main-content">
        <!-- 左侧：手机锁模拟 -->
        <div class="lock-section">
            <div class="phone-mockup">
                <div class="phone-camera"></div>
                <div class="lock-title" id="lock-instruction">请输入密码解锁</div>
                
                <!-- 动态生成的密码槽 -->
                <div class="pin-container" id="pin-container">
                    <!-- JS 动态生成 -->
                </div>

                <!-- 简易键盘装饰 -->
                <div class="keypad">
                    <div class="key">1</div><div class="key">2</div><div class="key">3</div>
                    <div class="key">4</div><div class="key">5</div><div class="key">6</div>
                    <div class="key">7</div><div class="key">8</div><div class="key">9</div>
                    <div class="key"></div><div class="key">0</div><div class="key"></div>
                </div>

                <!-- 锁定覆盖层 -->
                <div class="lockout-overlay" id="lockout-overlay">
                    <svg viewBox="0 0 24 24">
                        <path d="M18,8H17V6A5,5 0 0,0 12,1A5,5 0 0,0 7,6V8H6A2,2 0 0,0 4,10V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V10A2,2 0 0,0 18,8M8.9,6C8.9,4.29 10.29,2.9 12,2.9C13.71,2.9 15.1,4.29 15.1,6V8H8.9V6M12,17A2,2 0 1,1 14,15A2,2 0 0,1 12,17Z" />
                    </svg>
                    <h3 style="font-size: 16px; margin-bottom: 8px;">系统已锁定</h3>
                    <p style="font-size: 12px; opacity: 0.9;">连续输错5次密码<br>请30秒后再试</p>
                </div>
            </div>
        </div>

        <!-- 右侧：对比图表 -->
        <div class="chart-section">
            <!-- 人类赛道 -->
            <div class="track-container">
                <div class="track-header">
                    <div class="entity-info">
                        <!-- 蜗牛 SVG -->
                        <svg class="entity-icon" viewBox="0 0 24 24" fill="var(--human-color)">
                            <path d="M22,16C22,16 22,13 19,14C16,15 14,14 13,12C12,10 13,9 15,9C17,9 18,11 20,10C22,9 20,6 17,6C13,6 10,9 10,13C10,17 13,18 16,18C19,18 22,16 22,16M2,18A2,2 0 0,1 4,16H10V18H4A2,2 0 0,1 2,18M17,4A1,1 0 0,1 18,5V7A1,1 0 0,1 17,8A1,1 0 0,1 16,7V5A1,1 0 0,1 17,4Z" />
                        </svg>
                        <span>人类手动尝试 (1次/3秒)</span>
                    </div>
                    <span class="warning-badge" id="human-warning">疲劳警告！</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="human-fill"></div>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">已尝试次数</span>
                        <span class="stat-value human-value" id="human-attempts">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">预计总耗时</span>
                        <span class="stat-value human-value" id="human-time">--</span>
                    </div>
                </div>
            </div>

            <!-- 电脑赛道 -->
            <div class="track-container">
                <div class="track-header">
                    <div class="entity-info">
                        <!-- 芯片/电脑 SVG -->
                        <svg class="entity-icon" viewBox="0 0 24 24" fill="var(--computer-color)">
                            <path d="M5,17H19V5H5M19,3A2,2 0 0,1 21,5V17A2,2 0 0,1 19,19H13V21H16V23H8V21H11V19H5C3.89,19 3,18.1 3,17V5C3,3.89 3.89,3 5,3H19Z" />
                        </svg>
                        <span>电脑自动破译 (1万次/秒)</span>
                    </div>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="computer-fill"></div>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">已尝试次数</span>
                        <span class="stat-value computer-value" id="computer-attempts">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">预计总耗时</span>
                        <span class="stat-value computer-value" id="computer-time">--</span>
                    </div>
                </div>
            </div>

            <!-- 统计对比结论 -->
            <div style="background: #1b222b; padding: 12px; border-radius: 8px; border: 1px solid #2c3a47;">
                <h4 style="font-size: 13px; color: var(--text-light); margin-bottom: 6px;">算力对比分析：</h4>
                <p style="font-size: 12px; color: var(--text-muted); line-height: 1.4;" id="comparison-text">
                    选择上方密码位数并点击“开始破译”，观察两者的速度差异。
                </p>
            </div>
        </div>
    </div>

    <!-- 思考引导 -->
    <div class="footer-prompt">
        <span class="prompt-icon">💡</span>
        <div>
            <strong>课堂思考：</strong>
            当密码从 3 位增加到 6 位时，电脑和人类的破译时间分别发生了怎样的暴涨？“防暴力破解限制”对保护我们的手机安全有什么关键作用？
        </div>
    </div>
</div>

<script>
    // 状态管理
    let state = {
        digits: 3,
        limitAttempts: false,
        isRunning: false,
        humanAttempts: 0,
        computerAttempts: 0,
        animationFrameId: null,
        startTime: null
    };

    // 速度配置
    const HUMAN_SPEED = 1 / 3; // 每秒 0.33 次 (3秒1次)
    const COMPUTER_SPEED = 10000; // 每秒 10,000 次

    // DOM 元素
    const pinContainer = document.getElementById('pin-container');
    const digitsSelector = document.getElementById('digits-selector');
    const limitSwitch = document.getElementById('limit-switch');
    const btnStart = document.getElementById('btn-start');
    const btnReset = document.getElementById('btn-reset');
    const lockoutOverlay = document.getElementById('lockout-overlay');
    
    const humanFill = document.getElementById('human-fill');
    const computerFill = document.getElementById('computer-fill');
    const humanAttemptsEl = document.getElementById('human-attempts');
    const computerAttemptsEl = document.getElementById('computer-attempts');
    const humanTimeEl = document.getElementById('human-time');
    const computerTimeEl = document.getElementById('computer-time');
    const humanWarning = document.getElementById('human-warning');
    const comparisonText = document.getElementById('comparison-text');

    // 初始化密码槽
    function initPinSlots() {
        pinContainer.innerHTML = '';
        for (let i = 0; i < state.digits; i++) {
            const slot = document.createElement('div');
            slot.className = 'pin-slot';
            slot.textContent = '-';
            pinContainer.appendChild(slot);
        }
        updateExpectedTimes();
    }

    // 计算并更新预计时间
    function updateExpectedTimes() {
        const totalCombinations = Math.pow(10, state.digits);
        
        // 人类时间计算
        const humanTotalSeconds = totalCombinations * 3;
        let humanTimeStr = '';
        if (humanTotalSeconds < 3600) {
            humanTimeStr = `${Math.round(humanTotalSeconds / 60)} 分钟`;
        } else if (humanTotalSeconds < 86400) {
            humanTimeStr = `${(humanTotalSeconds / 3600).toFixed(1)} 小时`;
        } else {
            humanTimeStr = `${(humanTotalSeconds / 86400).toFixed(1)} 天 (不吃不睡)`;
        }

        // 电脑时间计算
        const computerTotalSeconds = totalCombinations / COMPUTER_SPEED;
        let computerTimeStr = '';
        if (computerTotalSeconds < 1) {
            computerTimeStr = `${(computerTotalSeconds * 1000).toFixed(0)} 毫秒`;
        } else {
            computerTimeStr = `${computerTotalSeconds.toFixed(2)} 秒`;
        }

        humanTimeEl.textContent = humanTimeStr;
        computerTimeEl.textContent = computerTimeStr;

        comparisonText.innerHTML = `在 <strong>${state.digits}</strong> 位密码下，共有 <strong>${totalCombinations.toLocaleString()}</strong> 种组合。<br>` +
            `电脑仅需约 <strong class="computer-value">${computerTimeStr}</strong> 即可全部试完；<br>` +
            `而人类在不犯错、不休息的情况下，平均需要约 <strong class="human-value">${humanTimeStr}</strong>。`;
    }

    // 切换密码位数
    digitsSelector.addEventListener('click', (e) => {
        if (state.isRunning) return;
        const target = e.target;
        if (target.classList.contains('btn-option')) {
            document.querySelectorAll('.btn-option').forEach(btn => btn.classList.remove('active'));
            target.classList.add('active');
            state.digits = parseInt(target.dataset.digits);
            initPinSlots();
            resetSimulation();
        }
    });

    // 切换限制开关
    limitSwitch.addEventListener('change', (e) => {
        state.limitAttempts = e.target.checked;
        resetSimulation();
    });

    // 重置模拟
    function resetSimulation() {
        state.isRunning = false;
        cancelAnimationFrame(state.animationFrameId);
        state.humanAttempts = 0;
        state.computerAttempts = 0;
        
        humanFill.style.width = '0%';
        computerFill.style.width = '0%';
        humanAttemptsEl.textContent = '0';
        computerAttemptsEl.textContent = '0';
        humanWarning.style.display = 'none';
        lockoutOverlay.classList.remove('active');
        
        const slots = document.querySelectorAll('.pin-slot');
        slots.forEach(slot => {
            slot.textContent = '-';
            slot.classList.remove('active');
        });
        
        btnStart.textContent = '开始破译';
        btnStart.style.backgroundColor = 'var(--computer-color)';
        updateExpectedTimes();
    }

    btnReset.addEventListener('click', resetSimulation);

    // 开始模拟
    btnStart.addEventListener('click', () => {
        if (state.isRunning) {
            // 暂停
            state.isRunning = false;
            btnStart.textContent = '继续破译';
            btnStart.style.backgroundColor = 'var(--primary-color)';
        } else {
            // 开始
            state.isRunning = true;
            btnStart.textContent = '暂停';
            btnStart.style.backgroundColor = '#f1c40f';
            state.startTime = performance.now();
            animate();
        }
    });

    // 动画循环
    function animate() {
        if (!state.isRunning) return;

        const totalCombinations = Math.pow(10, state.digits);

        // 为了在课堂上有良好的视觉演示效果：
        // 1. 电脑破译：在 2-4 秒内视觉上完成 100% 的进度，但数值显示真实的破译进度。
        // 2. 人类破译：如果开启了限制，在第 5 次尝试时立刻触发锁定。
        //             如果未开启限制，人类进度条以极慢的速度移动，并触发疲劳警告。

        // 电脑进度更新 (模拟视觉动画，实际计算速度极快)
        if (state.computerAttempts < totalCombinations) {
            // 每次动画帧增加一定的尝试次数，使其在3秒内跑完视觉效果
            const increment = Math.ceil(totalCombinations / 120); 
            state.computerAttempts = Math.min(totalCombinations, state.computerAttempts + increment);
            computerAttemptsEl.textContent = state.computerAttempts.toLocaleString();
            
            const compPercent = (state.computerAttempts / totalCombinations) * 100;
            computerFill.style.width = `${compPercent}%`;
        }

        // 人类进度更新
        if (state.limitAttempts) {
            // 限制模式：人类尝试到第 5 次时锁定
            if (state.humanAttempts < 5) {
                // 模拟每 0.8 秒尝试一次（演示加速版，实际是3秒一次）
                if (Math.random() < 0.02) {
                    state.humanAttempts++;
                    humanAttemptsEl.textContent = state.humanAttempts;
                    humanFill.style.width = `${(state.humanAttempts / totalCombinations) * 100}%`;
                    triggerSlotFlash();
                }
            } else {
                // 触发锁定
                lockoutOverlay.classList.add('active');
                state.isRunning = false;
                btnStart.textContent = '系统已锁定';
                btnStart.style.backgroundColor = '#7f8c8d';
                return;
            }
        } else {
            // 无限制模式：人类极慢移动
            if (state.humanAttempts < totalCombinations) {
                // 演示加速：每帧有微小概率增加一次尝试
                if (Math.random() < 0.03) {
                    state.humanAttempts++;
                    humanAttemptsEl.textContent = state.humanAttempts;
                    humanFill.style.width = `${(state.humanAttempts / totalCombinations) * 100}%`;
                    triggerSlotFlash();

                    // 超过10次尝试，显示疲劳警告
                    if (state.humanAttempts >= 10) {
                        humanWarning.style.display = 'inline-block';
                    }
                }
            }
        }

        // 密码槽数字滚动视觉效果
        const slots = document.querySelectorAll('.pin-slot');
        slots.forEach(slot => {
            if (Math.random() < 0.3) {
                slot.textContent = Math.floor(Math.random() * 10);
            }
        });

        // 检查是否全部完成
        if (state.computerAttempts >= totalCombinations && (state.humanAttempts >= totalCombinations || state.limitAttempts)) {
            state.isRunning = false;
            btnStart.textContent = '破译结束';
            btnStart.style.backgroundColor = '#7f8c8d';
            // 最终显示成功破译的密码（随机模拟一个）
            slots.forEach(slot => {
                slot.textContent = Math.floor(Math.random() * 10);
                slot.classList.add('active');
            });
            return;
        }

        state.animationFrameId = requestAnimationFrame(animate);
    }

    // 密码槽闪烁效果（模拟输入）
    function triggerSlotFlash() {
        const slots = document.querySelectorAll('.pin-slot');
        if (slots.length > 0) {
            const randomSlot = slots[Math.floor(Math.random() * slots.length)];
            randomSlot.classList.add('active');
            setTimeout(() => randomSlot.classList.remove('active'), 150);
        }
    }

    // 初始化
    initPinSlots();
</script>

</body>
</html>
