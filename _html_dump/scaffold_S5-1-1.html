<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法效率可视化分析 - 循环与过滤</title>
    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #2ecc71;
            --fail-color: #e74c3c;
            --warning-color: #f1c40f;
            --dark-color: #2c3e50;
            --light-color: #ecf0f1;
            --bg-color: #f5f7fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft YaHei", sans-serif;
            background-color: #d0d7de;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 4:3 比例自适应容器 */
        .aspect-ratio-container {
            width: 95vw;
            height: 71.25vw; /* 95 * 0.75 */
            max-width: 960px;
            max-height: 720px;
            background-color: var(--bg-color);
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* 头部标题 */
        header {
            text-align: center;
            margin-bottom: 16px;
        }

        header h1 {
            font-size: 28px;
            color: var(--dark-color);
            margin-bottom: 4px;
        }

        header p {
            font-size: 14px;
            color: #7f8c8d;
        }

        /* 主展示区 */
        .main-display {
            flex: 1;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            align-items: stretch;
            position: relative;
        }

        /* 卡片通用样式 */
        .card {
            background: white;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--dark-color);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        /* 左侧：检测历史网格 */
        .left-card {
            position: relative;
        }

        .counter-large {
            font-size: 32px;
            font-weight: 900;
            color: var(--fail-color);
            z-index: 2;
        }

        /* 密密麻麻的背景✖ */
        .bg-watermark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            opacity: 0.04;
            pointer-events: none;
            padding: 10px;
            z-index: 1;
            transition: opacity 0.5s;
        }

        .bg-watermark span {
            font-size: 24px;
            color: var(--fail-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 实际运行网格 */
        .grid-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            background: #f8fafc;
            border-radius: 8px;
            padding: 8px;
            border: 1px solid #e2e8f0;
            z-index: 2;
            overflow-y: auto;
        }

        .cell {
            aspect-ratio: 1;
            border-radius: 4px;
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            color: white;
            transition: all 0.1s ease;
            position: relative;
        }

        .cell.checked-fail {
            background-color: #fadbd8;
            color: var(--fail-color);
        }

        .cell.checked-success {
            background-color: #d4efdf;
            color: var(--success-color);
            font-size: 12px;
            box-shadow: 0 0 8px var(--success-color);
            animation: pulse 1.5s infinite;
        }

        /* 右侧：奖杯与结果 */
        .right-card {
            align-items: center;
            justify-content: space-between;
            text-align: center;
        }

        .right-card .counter-large {
            color: var(--success-color);
        }

        .trophy-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            z-index: 2;
        }

        .trophy-svg {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .trophy-container.active .trophy-svg {
            transform: scale(1.15) rotate(5deg);
        }

        .answer-badge {
            margin-top: 12px;
            background-color: #fef9e7;
            border: 2px solid var(--warning-color);
            color: #b7950b;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }

        .answer-badge.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 右侧背景大✔ */
        .right-bg-watermark {
            position: absolute;
            font-size: 200px;
            color: var(--success-color);
            opacity: 0.03;
            bottom: -20px;
            right: -20px;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.5s;
        }

        /* 控制区 */
        .control-panel {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 10;
        }

        .btn {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-warning {
            background-color: var(--warning-color);
            color: #7d6608;
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-warning.active {
            opacity: 1;
            pointer-events: auto;
            animation: bounce 1s infinite alternate;
        }

        .btn-warning:hover {
            background-color: #f39c12;
        }

        /* 对比碰撞动画状态 */
        .main-display.comparing .left-card {
            transform: translateX(15%) scale(0.95);
            z-index: 1;
        }

        .main-display.comparing .right-card {
            transform: translateX(-15%) scale(1.05);
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.2);
            z-index: 3;
        }

        /* 思考对话框 */
        .thought-bubble {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            width: 85%;
            background: #fff3cd;
            border: 3px solid #ffeeba;
            border-radius: 16px;
            padding: 16px 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .thought-bubble.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .thought-bubble .icon {
            font-size: 32px;
        }

        .thought-bubble .text {
            font-size: 18px;
            color: #856404;
            font-weight: bold;
            line-height: 1.4;
        }

        /* 动画定义 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

        /* 提示标签 */
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="aspect-ratio-container">
        <header>
            <h1>程序运行效率分析报告</h1>
            <p>范围：从 1000 到 1100 逐一检查</p>
        </header>

        <div class="main-display" id="mainDisplay">
            <!-- 左侧：循环检测 -->
            <div class="card left-card" id="leftCard">
                <div class="card-title">
                    <span>循环检测过程</span>
                    <span class="counter-large" id="totalCounter">0 / 101 次</span>
                </div>
                
                <!-- 密密麻麻的背景✖ -->
                <div class="bg-watermark" id="bgWatermark"></div>

                <!-- 101个检测格 -->
                <div class="grid-container" id="gridContainer"></div>
            </div>

            <!-- 右侧：有效答案 -->
            <div class="card right-card" id="rightCard">
                <div class="card-title">
                    <span>符合条件答案</span>
                    <span class="counter-large" id="successCounter">0 个</span>
                </div>

                <div class="right-bg-watermark">✔</div>

                <div class="trophy-container" id="trophyContainer">
                    <!-- 金色小奖杯 SVG -->
                    <svg class="trophy-svg" viewBox="0 0 24 24">
                        <path fill="#bdc3c7" id="trophyPath" d="M19 2h-14c-1.1 0-2 .9-2 2v3c0 2.24 1.81 4.07 4.05 4.24l.95 2.76h-2v2h8v-2h-2l.95-2.76c2.24-.17 4.05-2 4.05-4.24v-3c0-1.1-.9-2-2-2zm-12 5v-3h2v3c0 .55-.45 1-1 1s-1-.45-1-1zm10 0c0 .55-.45 1-1 1s-1-.45-1-1v-3h2v3z"/>
                    </svg>
                    <div class="answer-badge" id="answerBadge">答案：1049</div>
                </div>
            </div>
        </div>

        <!-- 思考对话框 -->
        <div class="thought-bubble" id="thoughtBubble">
            <span class="icon">💡</span>
            <span class="text">算 101 次才中 1 次，是不是有点太浪费计算机的体力了？有没有更聪明的办法？</span>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <button class="btn btn-primary" id="startBtn">开始模拟检测</button>
            <button class="btn btn-warning" id="compareBtn">对比分析</button>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        const gridContainer = document.getElementById('gridContainer');
        const bgWatermark = document.getElementById('bgWatermark');
        const startBtn = document.getElementById('startBtn');
        const compareBtn = document.getElementById('compareBtn');
        const totalCounter = document.getElementById('totalCounter');
        const successCounter = document.getElementById('successCounter');
        const trophyPath = document.getElementById('trophyPath');
        const trophyContainer = document.getElementById('trophyContainer');
        const answerBadge = document.getElementById('answerBadge');
        const mainDisplay = document.getElementById('mainDisplay');
        const thoughtBubble = document.getElementById('thoughtBubble');
        const tooltip = document.getElementById('tooltip');

        const START_NUM = 1000;
        const END_NUM = 1100;
        const TARGET_NUM = 1049;
        const TOTAL_CHECKS = END_NUM - START_NUM + 1;

        let isRunning = false;

        // 1. 初始化背景水印和网格
        function init() {
            gridContainer.innerHTML = '';
            bgWatermark.innerHTML = '';
            
            // 生成100个背景✖
            for (let i = 0; i < 100; i++) {
                const span = document.createElement('span');
                span.textContent = '✖';
                bgWatermark.appendChild(span);
            }

            // 生成101个待检测格子
            for (let i = START_NUM; i <= END_NUM; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.number = i;
                cell.textContent = i - START_NUM + 1; // 显示序号
                
                // 悬停提示
                cell.addEventListener('mouseenter', (e) => {
                    if (cell.classList.contains('checked-fail') || cell.classList.contains('checked-success')) {
                        tooltip.style.opacity = '1';
                        tooltip.textContent = `检测数值: ${i} | 结果: ${i === TARGET_NUM ? '符合条件 ✔' : '不符合 ✖'}`;
                        positionTooltip(e);
                    }
                });

                cell.addEventListener('mousemove', positionTooltip);
                cell.addEventListener('mouseleave', () => {
                    tooltip.style.opacity = '0';
                });

                gridContainer.appendChild(cell);
            }
        }

        function positionTooltip(e) {
            tooltip.style.left = (e.pageX + 10) + 'px';
            tooltip.style.top = (e.pageY + 10) + 'px';
        }

        // 2. 模拟运行动画
        function runSimulation() {
            if (isRunning) return;
            isRunning = true;
            startBtn.disabled = true;
            startBtn.style.opacity = '0.5';
            
            // 重置状态
            init();
            compareBtn.classList.remove('active');
            mainDisplay.classList.remove('comparing');
            thoughtBubble.classList.remove('show');
            trophyPath.setAttribute('fill', '#bdc3c7');
            trophyContainer.classList.remove('active');
            answerBadge.classList.remove('show');
            successCounter.textContent = '0 个';
            totalCounter.textContent = `0 / ${TOTAL_CHECKS} 次`;

            const cells = gridContainer.children;
            let index = 0;

            function checkNext() {
                if (index >= TOTAL_CHECKS) {
                    // 结束
                    isRunning = false;
                    startBtn.disabled = false;
                    startBtn.style.opacity = '1';
                    startBtn.textContent = '重新模拟';
                    compareBtn.classList.add('active');
                    return;
                }

                const cell = cells[index];
                const currentNum = START_NUM + index;

                totalCounter.textContent = `${index + 1} / ${TOTAL_CHECKS} 次`;

                if (currentNum === TARGET_NUM) {
                    cell.className = 'cell checked-success';
                    cell.textContent = '✔';
                    successCounter.textContent = '1 个';
                    
                    // 奖杯变金色
                    trophyPath.setAttribute('fill', '#f1c40f');
                    trophyContainer.classList.add('active');
                    answerBadge.classList.add('show');
                } else {
                    cell.className = 'cell checked-fail';
                    cell.textContent = '✖';
                }

                // 滚动条自动跟随
                if (index > 30) {
                    gridContainer.scrollTop = cell.offsetTop - gridContainer.offsetTop - 40;
                }

                index++;
                // 快速扫描，前段快，找到答案时稍微停顿增加戏剧效果
                let delay = 15;
                if (currentNum === TARGET_NUM) delay = 400; 
                setTimeout(checkNext, delay);
            }

            checkNext();
        }

        // 3. 对比分析
        function compareAnalysis() {
            mainDisplay.classList.add('comparing');
            
            // 降低左侧背景✖的透明度，突出对比
            bgWatermark.style.opacity = '0.15';

            // 弹出思考气泡
            setTimeout(() => {
                thoughtBubble.classList.add('show');
            }, 600);
        }

        // 事件绑定
        startBtn.addEventListener('click', runSimulation);
        compareBtn.addEventListener('click', compareAnalysis);

        // 初始化
        init();
    </script>
</body>
</html>
